<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dividir gastos del viaje | CuántoSale</title>
<meta name="description" content="Armá un grupo, compartí el link y dividí los gastos del viaje con tus amigos, sin necesidad de crear una cuenta.">
<meta name="theme-color" content="#0A1830">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<!-- Misma versión que /app: el servidor marca las URLs con ?v= como
     immutable de un año, así que pedir un ?v= viejo deja al usuario pegado
     con el CSS viejo para siempre. Si tocás style.css, subí las dos páginas. -->
<link rel="stylesheet" href="/style.css?v=51">
<style>
  .grupo-wrap{max-width:620px;margin:0 auto;padding:24px 16px 64px}
  .grupo-header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:22px}
  .grupo-header a{color:var(--ink2);text-decoration:none;font-size:13px;font-weight:600}
  .grupo-kicker{color:var(--ink2);font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}

  .grupo-card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:22px 20px;margin-bottom:16px}
  .grupo-card h1,.grupo-card h2{font-family:var(--fh);margin:0;line-height:1.05}
  .grupo-card h1{font-size:32px;word-break:break-word}
  .grupo-card h2{font-size:22px;font-weight:600}
  .grupo-card__head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
  .grupo-card__head h1,.grupo-card__head h2{margin:0}
  .grupo-card__head h1{font-size:28px}
  .grupo-badge{flex:0 0 auto;background:var(--bg);border:1px solid var(--line);border-radius:99px;padding:5px 11px;font-size:12px;font-weight:700;color:var(--ink2);white-space:nowrap}
  .grupo-sub{color:var(--ink2);font-size:13px;margin:-4px 0 16px}

  /* Una sola acción para compartir: el botón grande. El link queda abajo, chico
     y punteado, como alternativa para copiar a mano. */
  .grupo-invite{width:100%;display:flex;align-items:center;justify-content:center;gap:9px;padding:15px 18px;border:0;border-radius:14px;background:var(--action-bg);color:var(--action-ink);font-family:var(--fb);font-size:16px;font-weight:700;cursor:pointer}
  .grupo-invite:hover{filter:brightness(1.12)}
  .grupo-invite svg{width:17px;height:17px;flex:0 0 auto}
  .grupo-linkchip{position:relative;display:flex;align-items:center;justify-content:center;gap:7px;width:100%;margin-top:10px;padding:10px 12px;border:1px dashed var(--line);border-radius:11px;background:transparent;color:var(--ink2);font-family:var(--fb);font-size:12.5px;font-weight:600;cursor:pointer}
  .grupo-linkchip:hover{border-color:var(--ink2);color:var(--ink);background:var(--bg)}
  .grupo-linkchip svg{width:13px;height:13px;flex:0 0 auto;opacity:.7}
  .grupo-linkchip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .grupo-toast{position:absolute;left:50%;bottom:calc(100% + 7px);transform:translateX(-50%);z-index:5;white-space:nowrap;background:var(--ink);color:var(--bg);border-radius:8px;padding:6px 10px;font-size:12px;font-weight:600}
  .grupo-toast[hidden]{display:none}

  .grupo-field{display:block;margin-bottom:16px;font-weight:700;font-size:13px}
  .grupo-field input,.grupo-field select{display:block;width:100%;margin-top:6px;padding:12px 13px;border:1.5px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);font-family:var(--fb);font-size:15px;transition:border-color .18s ease,box-shadow .18s ease}
  .grupo-field input::placeholder{color:var(--ink2);opacity:.55}
  .grupo-field input:focus,.grupo-field select:focus{outline:none;border-color:var(--action-bg);box-shadow:0 0 0 4px rgba(16,35,62,.08)}
  /* El monto tiene el símbolo de la moneda adentro del campo, a la izquierda,
     así se lee "US$ 120" sin que el label tenga que repetirlo. */
  .grupo-amount{display:flex;align-items:center;margin-top:6px;border:1.5px solid var(--line);border-radius:12px;background:var(--bg);padding-left:13px;transition:border-color .18s ease,box-shadow .18s ease}
  .grupo-amount:focus-within{border-color:var(--action-bg);box-shadow:0 0 0 4px rgba(16,35,62,.08)}
  .grupo-amount__code{flex:0 0 auto;color:var(--ink2);font-size:14px;font-weight:700}
  .grupo-amount input{flex:1;min-width:0;margin:0;padding:12px 8px 12px 7px;border:0;border-radius:0;background:transparent;font-size:17px;font-weight:600}
  .grupo-amount input:focus{outline:none;box-shadow:none}

  .grupo-checks{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
  .grupo-checks label{display:flex;align-items:center;gap:5px;font-weight:500;background:var(--bg);border:1px solid var(--line);border-radius:99px;padding:7px 11px;font-size:13px;cursor:pointer}
  .grupo-checks input{width:auto;margin:0;accent-color:var(--action-bg)}
  .grupo-checks__tools{margin-top:10px}

  .grupo-btn{border:0;border-radius:12px;background:var(--action-bg);color:var(--action-ink);padding:12px 17px;font-family:var(--fb);font-weight:700;cursor:pointer;font-size:15px}
  .grupo-btn:disabled{opacity:.55;cursor:default}
  .grupo-btn--ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}
  .grupo-btn--primary{width:100%;padding:15px 18px;font-size:16px;border-radius:14px;margin-top:2px}
  .grupo-minibtn{border:1px solid var(--line);border-radius:99px;background:transparent;color:var(--ink2);padding:6px 12px;font-family:var(--fb);font-size:12px;font-weight:700;cursor:pointer}
  .grupo-minibtn:hover{border-color:var(--ink2);color:var(--ink)}

  .grupo-participants{display:flex;flex-wrap:wrap;gap:7px;margin:14px 0 0}
  .grupo-chip{background:var(--bg);border:1px solid var(--line);border-radius:99px;padding:6px 12px;font-size:13px;font-weight:700}
  .grupo-add{display:flex;gap:8px;margin-top:10px}
  .grupo-add input{flex:1;min-width:0;padding:11px 13px;border:1.5px solid var(--line);border-radius:11px;background:var(--bg);color:var(--ink);font-family:var(--fb);font-size:15px}
  .grupo-add input::placeholder{color:var(--ink2);opacity:.55}
  .grupo-add input:focus{outline:none;border-color:var(--action-bg);box-shadow:0 0 0 4px rgba(16,35,62,.08)}
  .grupo-add button{flex:0 0 auto;white-space:nowrap}

  /* Cada gasto es una línea: ícono de categoría, nombre, quién pagó, entre
     cuántos y el monto. El ícono va sólo para que la lista se lea de un
     vistazo; la categoría se deduce del texto, no se elige. */
  .grupo-expense{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;padding:13px 0;border-top:1px solid var(--line)}
  .grupo-expense:first-child{border-top:0}
  .grupo-expense__main{display:flex;gap:10px;min-width:0}
  .grupo-expense__ico{flex:0 0 auto;display:grid;place-items:center;width:34px;height:34px;border-radius:10px;background:var(--bg);color:var(--ink2)}
  .grupo-expense__ico svg{width:19px;height:19px}
  .grupo-expense__body{min-width:0}
  .grupo-expense__name{font-size:15px;font-weight:700;word-break:break-word}
  .grupo-expense__meta{margin-top:4px;color:var(--ink2);font-size:12.5px}
  .grupo-expense__right{flex:0 0 auto;display:flex;align-items:center;gap:2px}
  .grupo-expense__amount{font-size:15.5px;font-weight:700;white-space:nowrap}
  .grupo-trash{display:grid;place-items:center;width:28px;height:28px;border:0;border-radius:8px;background:transparent;color:var(--ink2);cursor:pointer;opacity:0;transition:opacity .16s ease,background .16s ease,color .16s ease}
  .grupo-expense:hover .grupo-trash,.grupo-trash:focus-visible{opacity:1}
  .grupo-trash:hover{background:var(--coral-soft);color:var(--coral)}
  .grupo-trash svg{width:15px;height:15px}
  @media (hover:none){.grupo-trash{opacity:.55}}

  .grupo-balance{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line);font-size:14px}
  .grupo-balance:first-child{border-top:0}
  .grupo-balance b.pos{color:var(--good)}
  .grupo-balance b.neg{color:var(--coral)}
  .grupo-balance b.pos,.grupo-balance b.neg{white-space:nowrap;font-weight:700}
  .grupo-subhead{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2);margin:18px 0 2px}
  .grupo-settle{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 13px;border-radius:12px;background:var(--bg);margin-top:8px;font-size:14px}
  .grupo-settle__flow{display:flex;align-items:center;gap:7px;min-width:0}
  .grupo-settle__arrow{flex:0 0 auto;color:var(--ink2)}
  .grupo-settle__arrow svg{width:15px;height:15px;display:block}
  .grupo-settle__amount{flex:0 0 auto;font-weight:700;color:var(--coral)}

  .grupo-error{color:var(--coral);font-size:13px;margin:10px 0 0}
  .grupo-error:empty{display:none}
  .grupo-note{color:var(--ink2);font-size:12px;margin-top:10px}
  .grupo-preset{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 0 16px;padding:11px 13px;border:1px dashed var(--line);border-radius:12px;font-size:13px}
  .grupo-preset button{border:0;background:transparent;color:var(--ink2);font-size:12px;font-weight:700;cursor:pointer;text-decoration:underline}
</style>
</head>
<body>
<div class="wrap grupo-wrap">
  <div class="grupo-header">
    <a href="/app">← CuántoSale</a>
    <span class="grupo-kicker">Dividir gastos</span>
  </div>
  <div id="grupo-app"><p class="grupo-note">Cargando…</p></div>
</div>
<script src="/grupo.js?v=6" defer></script>
</body>
</html>
