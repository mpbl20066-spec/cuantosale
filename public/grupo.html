<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dividir gastos del viaje | CuántoSale</title>
<meta name="description" content="Armá un grupo, compartí el link y dividí los gastos del viaje con tus amigos, sin necesidad de crear una cuenta.">
<meta name="theme-color" content="#0A101A">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<!-- Mismo script que en /app: aplica el tema antes del CSS para que no haya
     destello. Esta pagina no lleva el interruptor (no tiene barra de navegacion,
     es un link de grupo), pero si respeta la eleccion: alguien que la eligio en
     claro la ve en claro, y alguien sin eleccion sigue a su sistema. -->
<script>
(function () {
  try {
    var g = localStorage.getItem('cuantosale_tema');
    if (g !== 'light' && g !== 'night') {
      g = (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) ? 'light' : 'night';
    }
    document.documentElement.setAttribute('data-theme', g);
    var m = document.querySelector('meta[name="theme-color"]');
    if (m) m.setAttribute('content', g === 'light' ? '#F7F8FA' : '#0A101A');
  } catch (e) { /* modo privado */ }
})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<!-- Misma versión que /app: el servidor marca las URLs con ?v= como
     immutable de un año, así que pedir un ?v= viejo deja al usuario pegado
     con el CSS viejo para siempre. Si tocás style.css, subí las dos páginas. -->
<link rel="stylesheet" href="/style.css?v=114">
<style>
  .grupo-wrap{max-width:620px;margin:0 auto;padding:24px 16px 64px}
  .grupo-header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:22px}
  .grupo-header a{color:var(--ink2);text-decoration:none;font-size:13px;font-weight:600}
  .grupo-kicker{color:var(--ink2);font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}

  .grupo-card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:22px 20px;margin-bottom:16px}
  .grupo-card h1,.grupo-card h2{font-family:var(--fh);margin:0;line-height:1.05}
  .grupo-card h1{font-size:32px;word-break:break-word}
  .grupo-card h2{font-size:22px;font-weight:600}
  .grupo-card__head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
  .grupo-card__head h1,.grupo-card__head h2{margin:0}
  .grupo-card__head h1{font-size:28px}
  .grupo-badge{flex:0 0 auto;background:var(--bg);border:1px solid var(--line);border-radius:99px;padding:5px 11px;font-size:12px;font-weight:700;color:var(--ink2);white-space:nowrap}
  /* La intro de la tarjeta de suma. Estaba en 13px sobre --ink2 y con nombres de
     destino largos da dos líneas, que es justo cuando la instrucción —la que
     dice qué hay que hacer después— quedaba como la parte menos legible de la
     pantalla. */
  .grupo-sub{color:var(--ink2);font-size:14px;line-height:1.5;margin:-4px 0 0}

  /* Una sola acción para compartir: el botón grande. El link queda abajo, chico
     y punteado, como alternativa para copiar a mano. */
  .grupo-invite{width:100%;display:flex;align-items:center;justify-content:center;gap:9px;padding:15px 18px;border:0;border-radius:14px;background:var(--action-bg);color:var(--action-ink);font-family:var(--fb);font-size:16px;font-weight:700;cursor:pointer}
  .grupo-invite:hover{filter:brightness(1.12)}
  .grupo-invite svg{width:17px;height:17px;flex:0 0 auto}
  .grupo-linkchip{position:relative;display:flex;align-items:center;justify-content:center;gap:7px;width:100%;margin-top:10px;padding:10px 12px;border:1px dashed var(--line);border-radius:11px;background:transparent;color:var(--ink2);font-family:var(--fb);font-size:12.5px;font-weight:600;cursor:pointer}
  .grupo-linkchip:hover{border-color:var(--ink2);color:var(--ink);background:var(--bg)}
  .grupo-linkchip svg{width:13px;height:13px;flex:0 0 auto;opacity:.7}
  .grupo-linkchip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .grupo-toast{position:absolute;left:50%;bottom:calc(100% + 7px);transform:translateX(-50%);z-index:5;white-space:nowrap;background:var(--ink);color:var(--bg);border-radius:8px;padding:6px 10px;font-size:12px;font-weight:600}
  .grupo-toast[hidden]{display:none}

  /* Grilla de categorías: 3 columnas, ícono con el color de la categoría y
     label en caja alta. Es un atajo para escribir menos, no un campo más. */
  .grupo-cats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
  .grupo-cat{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;min-height:74px;padding:11px 6px;border:1px solid var(--line);border-radius:14px;background:var(--bg);cursor:pointer;transition:border-color .16s ease,background .16s ease,transform .12s ease}
  .grupo-cat:hover{border-color:var(--ink2);background:var(--cel-soft)}
  .grupo-cat:active{transform:scale(.97)}
  .grupo-cat__ico{display:grid;place-items:center;width:22px;height:22px}
  .grupo-cat__ico svg{width:22px;height:22px;stroke-width:2}
  .grupo-cat__label{font-size:10px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2);text-align:center;line-height:1.15}
  .grupo-cat[aria-pressed="true"]{border-color:var(--ink);background:var(--surface);box-shadow:inset 0 0 0 1.5px var(--ink)}
  .grupo-cat[aria-pressed="true"] .grupo-cat__label{color:var(--ink)}
  @media (max-width:380px){.grupo-cats{grid-template-columns:repeat(2,minmax(0,1fr))}}

  .grupo-field{display:block;margin-bottom:16px;font-weight:700;font-size:13px}
  .grupo-field input,.grupo-field select{display:block;width:100%;margin-top:6px;padding:12px 13px;border:1.5px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);font-family:var(--fb);font-size:15px;transition:border-color .18s ease,box-shadow .18s ease}
  .grupo-field input::placeholder{color:var(--ink2);opacity:.55}
  .grupo-field input:focus,.grupo-field select:focus{outline:none;border-color:var(--action-bg);box-shadow:0 0 0 4px rgba(16,35,62,.08)}
  /* El monto tiene el símbolo de la moneda adentro del campo, a la izquierda,
     así se lee "US$ 120" sin que el label tenga que repetirlo. */
  .grupo-amount{display:flex;align-items:center;margin-top:6px;border:1.5px solid var(--line);border-radius:12px;background:var(--bg);padding-left:13px;transition:border-color .18s ease,box-shadow .18s ease}
  .grupo-amount:focus-within{border-color:var(--action-bg);box-shadow:0 0 0 4px rgba(16,35,62,.08)}
  .grupo-amount__code{flex:0 0 auto;color:var(--ink2);font-size:14px;font-weight:700}
  .grupo-amount input{flex:1;min-width:0;margin:0;padding:12px 8px 12px 7px;border:0;border-radius:0;background:transparent;font-size:17px;font-weight:600}
  .grupo-amount input:focus{outline:none;box-shadow:none}
  /* Con selector de moneda el input va un poco más chico: el número tiene que
     dejar lugar al código de la moneda sin que el campo se desborde. */
  .grupo-amount:has(select.grupo-amount__cur) input{font-size:16px}

  .grupo-checks{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
  .grupo-checks label{display:flex;align-items:center;gap:5px;font-weight:500;background:var(--bg);border:1px solid var(--line);border-radius:99px;padding:7px 11px;font-size:13px;cursor:pointer}
  .grupo-checks input{width:auto;margin:0;accent-color:var(--action-bg)}
  .grupo-checks__tools{margin-top:10px}

  .grupo-btn{border:0;border-radius:12px;background:var(--action-bg);color:var(--action-ink);padding:12px 17px;font-family:var(--fb);font-weight:700;cursor:pointer;font-size:15px}
  .grupo-btn:disabled{opacity:.55;cursor:default}
  .grupo-btn--ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}
  .grupo-btn--primary{width:100%;padding:15px 18px;font-size:16px;border-radius:14px;margin-top:2px}
  .grupo-minibtn{border:1px solid var(--line);border-radius:99px;background:transparent;color:var(--ink2);padding:6px 12px;font-family:var(--fb);font-size:12px;font-weight:700;cursor:pointer}
  .grupo-minibtn:hover{border-color:var(--ink2);color:var(--ink)}

  .grupo-participants{display:flex;flex-wrap:wrap;gap:7px;margin:14px 0 0}
  .grupo-chip{background:var(--bg);border:1px solid var(--line);border-radius:99px;padding:6px 12px;font-size:13px;font-weight:700}
  .grupo-add{display:flex;gap:8px;margin-top:10px}
  .grupo-add input{flex:1;min-width:0;padding:11px 13px;border:1.5px solid var(--line);border-radius:11px;background:var(--bg);color:var(--ink);font-family:var(--fb);font-size:15px}
  .grupo-add input::placeholder{color:var(--ink2);opacity:.55}
  .grupo-add input:focus{outline:none;border-color:var(--action-bg);box-shadow:0 0 0 4px rgba(16,35,62,.08)}
  .grupo-add button{flex:0 0 auto;white-space:nowrap}

  /* Cada gasto es una línea: ícono de categoría, nombre, quién pagó, entre
     cuántos y el monto. El ícono va sólo para que la lista se lea de un
     vistazo; la categoría se deduce del texto, no se elige. */
  /* Fila de gasto: ícono de ancho fijo a la izquierda, columna de contenido al
     lado, papelera al extremo derecho. Todo con align-items:flex-start, así el
     ícono, el título y el monto comparten la misma línea base.

     El monto NO va en una columna aparte. Antes estaba en .grupo-expense__right
     con align-items:center, y eso lo centraba a media altura de una fila de
     tres líneas mientras el ícono y el título quedaban pegados arriba: eso era
     la desalineación. Ahora el monto vive en la misma fila que el título, con
     justify-between, y las dos líneas de detalle quedan debajo del título
     dentro de la columna de contenido, nunca debajo del ícono. */
  /* La fila se centra en vertical (align-items:center) y no arranca pegada
     arriba (flex-start): con la papelera en todas las filas, el ícono y el
     botón quedaban desalineados de los de las filas que no los tenían, y
     apelando a eso para esconder la papelera no quedaba. El título y el monto
     siguen compartiendo línea base adentro de la columna de contenido. */
  .grupo-expense{display:flex;align-items:center;gap:10px;padding:13px 0;border-top:1px solid var(--line)}
  .grupo-expense:first-child{border-top:0}
  .grupo-expense__ico{flex:0 0 34px;width:34px;height:34px;display:grid;place-items:center;border-radius:10px;background:var(--bg);color:var(--ink2)}
  .grupo-expense__ico svg{width:19px;height:19px}
  /* flex:1 + min-width:0 para que un nombre largo de gasto o de persona
     encoja el texto y no empuje el monto ni desborde la fila. */
  .grupo-expense__body{flex:1 1 auto;min-width:0;display:flex;flex-direction:column}
  .grupo-expense__top{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
  .grupo-expense__name{min-width:0;font-size:15px;font-weight:700;word-break:break-word}
  .grupo-expense__meta{margin-top:4px;color:var(--ink2);font-size:12.5px;overflow-wrap:anywhere}
  .grupo-expense__amount{flex:0 0 auto;font-size:15.5px;font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums}
  /* La papelera se revela al hover en puntero, pero en pantalla táctil no hay
     hover: se quedaba en opacity:0 y no había forma de borrar un gasto desde
     el celular. Ahora siempre se ve en puntero fino y con area tactil de 44px.
     El margen negativo era para que el botón de 44px no agrandara la fila; con
     la fila centrada, también hay que sacarle el negativo de arriba y abajo o
     la papelera queda más alta que el centro. */
  .grupo-trash{flex:0 0 auto;align-self:center;display:grid;place-items:center;width:44px;height:44px;margin-right:-8px;border:0;border-radius:10px;background:transparent;color:var(--ink2);cursor:pointer;opacity:.55;transition:opacity .16s ease,background .16s ease,color .16s ease}
  .grupo-expense:hover .grupo-trash,.grupo-trash:focus-visible{opacity:1;background:var(--coral-soft);color:var(--coral)}
  .grupo-trash:hover{background:var(--coral-soft);color:var(--coral)}
  .grupo-trash svg{width:15px;height:15px}
  @media (hover:none){.grupo-trash{opacity:.55}}

  .grupo-balance{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line);font-size:14px}
  .grupo-balance:first-child{border-top:0}
  .grupo-balance b.pos{color:var(--good)}
  .grupo-balance b.neg{color:var(--coral)}
  .grupo-balance b.pos,.grupo-balance b.neg{white-space:nowrap;font-weight:700}
  .grupo-subhead{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2);margin:18px 0 2px}
  .grupo-settle{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 13px;border-radius:12px;background:var(--bg);margin-top:8px;font-size:14px}
  .grupo-settle__flow{display:flex;align-items:center;gap:7px;min-width:0}
  .grupo-settle__arrow{flex:0 0 auto;color:var(--ink2)}
  .grupo-settle__arrow svg{width:15px;height:15px;display:block}
  .grupo-settle__amount{flex:0 0 auto;font-weight:700;color:var(--coral)}

  /* Marcar una transferencia como pagada. Es un toggle: el mismo botón
     desmarca, para el que lo apretó sin querer. La fila pagada se apaga con
     un tachado suave en vez de desaparecer, así se ve qué ya está saldado y
     qué no sin tener que recordarlo. */
  /* min-height y no solo padding: el alto sale de la suma de los dos y a 360px
     quedaban 34px. Es la accion principal de esta seccion, asi que va con los
     44px que ya usa la papelera y no con 34. */
  .grupo-settledon{flex:0 0 auto;display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:7px 14px;border:1.5px solid var(--line);border-radius:99px;background:var(--surface);color:var(--ink2);font-family:var(--fb);font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap;transition:border-color .16s ease,color .16s ease,background .16s ease}
  .grupo-settledon:hover{border-color:var(--good);color:var(--good)}
  .grupo-settledon:disabled{opacity:.5;cursor:default}
  .grupo-settledon__box{display:grid;place-items:center;width:15px;height:15px;border:2px solid var(--line);border-radius:5px;font-size:9px;font-weight:800;line-height:1;color:transparent}
  .grupo-settledon[aria-pressed="true"]{border-color:var(--good);background:var(--good);color:var(--action-ink)}
  .grupo-settledon[aria-pressed="true"] .grupo-settledon__box{border-color:var(--good);background:var(--action-ink);color:var(--good)}
  /* El boton de la fila ya saldada es al reves: no marca nada, saca lo que se
     marco. Por eso no se pinta del verde de "confirmado" (que es lo que
     aria-pressed=true significa en cualquier otro boton de la pagina) sino del
     coral de "se puede tocar", asi que no se confunda con marcar un pago. */
  .grupo-settledon.is-undo{background:transparent;border-color:transparent;color:var(--ink2);opacity:0}
  .grupo-settledon.is-undo:hover,.grupo-settledon.is-undo:focus-visible{opacity:1;border-color:var(--coral);color:var(--coral)}
  .grupo-settledon.is-undo .grupo-settledon__box{border-color:currentColor;background:transparent;color:currentColor}
  @media (hover:none){.grupo-settledon.is-undo{opacity:1}}
  /* A 320-360px el boton de 44px mas el importe se comen el ancho y a los
     nombres les quedan 24px: medido, cada nombre se partia en dos lineas de una
     letra. A partir de aca la fila pasa a dos lineas: arriba quien le paga a
     quien, abajo el importe y el boton. Mismo corte que la fila de gasto. */
  @media (max-width:420px){
    .grupo-settle{flex-wrap:wrap;row-gap:10px}
    .grupo-settle__flow{flex:1 1 100%}
  }
  .grupo-settle.is-paid{background:var(--good-soft)}
  .grupo-settle.is-paid .grupo-settle__flow,.grupo-settle.is-paid .grupo-settle__amount{opacity:.55}
  .grupo-settle.is-paid .grupo-settle__amount{text-decoration:line-through}
  /* Aviso de grupo cerrado. Aparece solo cuando no queda ninguna
     transferencia pendiente: es la pregunta que todos hacen al final. */
  .grupo-allday{display:flex;align-items:center;gap:9px;margin-top:14px;padding:12px 14px;border-radius:14px;background:var(--good-soft);color:var(--good);font-size:14px;font-weight:700}
  .grupo-allday svg{flex:0 0 auto;width:19px;height:19px;stroke-width:2.4}
  /* "Cómo se salda" con la identidad de quien mira: primero lo suyo, con su
     botón, y lo del resto del grupo plegado. Todo lo nuevo acá es superficie o
     marco neutro, a proposito: el ambar de --card-sel-* ya significa "elegido"
     en las otras cards de la app y reutilizarlo para "esto es tuyo" mezclaria
     dos senales distintas. La fila propia se distingue por estar sobre la
     superficie, no por un color nuevo. */
  .grupo-mine{margin:2px 0 0;font-size:15px;line-height:1.4;color:var(--ink)}
  .grupo-mine b{font-weight:800;white-space:nowrap}
  .grupo-settle.is-mine{background:var(--surface);border:1.5px solid var(--line);box-shadow:0 4px 14px rgba(16,35,62,.08)}
  /* is-paid gana en orden a proposito: si la fila propia ya esta pagada, el
     fondo verde de "listo" tiene que ganarle al marco de "esto es tuyo". */
  .grupo-settle.is-mine.is-paid{background:var(--good-soft);border-color:transparent;box-shadow:none}
  .grupo-balance.is-me{font-weight:800}
  .grupo-balance.is-me em{font-style:normal;font-weight:700;color:var(--ink2)}
  .grupo-other{margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
  .grupo-other>summary{display:flex;align-items:center;gap:8px;min-height:38px;cursor:pointer;font-size:14px;font-weight:700;color:var(--ink2);list-style:none;-webkit-tap-highlight-color:transparent}
  .grupo-other>summary::-webkit-details-marker{display:none}
  .grupo-other>summary::before{content:'+';flex:0 0 auto;width:20px;height:20px;display:grid;place-items:center;border-radius:50%;background:var(--bg);font-size:15px;font-weight:800;line-height:1;transition:transform .18s ease}
  .grupo-other[open]>summary::before{transform:rotate(45deg)}
  .grupo-other>summary:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:8px}
  .grupo-other .grupo-note{margin:2px 0 0}
  @media (prefers-reduced-motion:reduce){.grupo-other>summary::before{transition:none}}

  /* Selector de moneda del gasto: va a la derecha del número, adentro del
     campo, para que se lea "48.500 UYU$" en una sola línea. */
  .grupo-amount select.grupo-amount__cur{flex:0 0 auto;width:auto;margin:0;padding:8px 26px 8px 9px;border:0;border-left:1.5px solid var(--line);border-radius:0;background:var(--surface);color:var(--ink2);font-family:var(--fb);font-size:12.5px;font-weight:700;appearance:none;cursor:pointer;background-image:linear-gradient(45deg,transparent 50%,currentColor 50%),linear-gradient(135deg,currentColor 50%,transparent 50%);background-position:calc(100% - 13px) 55%,calc(100% - 9px) 55%;background-size:4px 4px,4px 4px;background-repeat:no-repeat}
  /* "Ver en": chico, arriba de la lista, porque es un ajuste de lectura y no
     un dato que se carga. */
  .grupo-veren{display:flex;align-items:center;gap:7px;margin:12px 0 0;padding-top:11px;border-top:1px solid var(--line)}
  .grupo-veren__label{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2)}
  .grupo-veren__sel{margin-left:auto;padding:6px 26px 6px 10px;border:1.5px solid var(--line);border-radius:99px;background:var(--bg);color:var(--ink);font-family:var(--fb);font-size:12.5px;font-weight:700;appearance:none;cursor:pointer;background-image:linear-gradient(45deg,transparent 50%,currentColor 50%),linear-gradient(135deg,currentColor 50%,transparent 50%);background-position:calc(100% - 13px) 55%,calc(100% - 9px) 55%;background-size:4px 4px,4px 4px;background-repeat:no-repeat}

  .grupo-error{color:var(--coral);font-size:13px;margin:10px 0 0}
  .grupo-error:empty{display:none}
  .grupo-note{color:var(--ink2);font-size:12px;margin-top:10px}
  /* Aviso de que un monto no se pudo convertir. No es un error de la pagina: es
     que falta la tasa de una moneda, y el numero que se ve al lado es el de
     verdad, en su moneda. Sin esto el que mira no tiene forma de saber que
     esas dos filas no se pueden sumar entre si. */
  .grupo-warn{margin:12px 0 0;padding:10px 12px;border:1px dashed var(--line);border-radius:12px;background:var(--bg);color:var(--ink2);font-size:12.5px;line-height:1.45}
  .grupo-preset{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 0 16px;padding:11px 13px;border:1px dashed var(--line);border-radius:12px;font-size:13px}
  .grupo-preset button{border:0;background:transparent;color:var(--ink2);font-size:12px;font-weight:700;cursor:pointer;text-decoration:underline}
</style>
</head>
<body>
<div class="wrap grupo-wrap">
  <div class="grupo-header">
    <a href="/app">← CuántoSale</a>
    <span class="grupo-kicker">Dividir gastos</span>
  </div>
  <div id="grupo-app"><p class="grupo-note">Cargando…</p></div>
</div>
<script src="/grupo.js?v=23" defer></script>
</body>
</html>
