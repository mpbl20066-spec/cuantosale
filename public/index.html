<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CuántoSale | Cuánto cuesta realmente tu viaje</title>
<meta name="description" content="Comparamos vuelos, buses y alojamiento desde Uruguay y te decimos cuánto cuesta realmente tu viaje.">
<meta name="theme-color" content="#0A1830">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="CuántoSale">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="/style.css?v=79">
<!-- Los precios de vuelo se consultan en el server y la reserva se completa en
     Google Flights, así que la página no carga ningún script de terceros para
     vuelos. El CSP del server no lo permite. -->

</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="logo" aria-label="CuántoSale">
      <svg width="24" height="30" viewBox="0 0 24 30" aria-hidden="true"><path d="M12 0C5.4 0 0 5.3 0 11.8 0 20 12 30 12 30s12-10 12-18.2C24 5.3 18.6 0 12 0z" fill="var(--ink)"/><circle cx="12" cy="11.5" r="4.6" fill="#F6B21B"/></svg>
      cuántosale
    </div>
    <div class="account-actions" aria-label="Cuenta de usuario">
      <div id="currency-picker-slot"></div>
      <button type="button" id="auth-button" class="account-button">Iniciar sesión</button>
      <button type="button" id="trips-button" class="account-button account-button--secondary" hidden>Mis viajes</button>
    </div>
  </header>

  <h1>¿Cuánto sale realmente tu viaje?</h1>

  <div id="vista-principal">
  <section class="form" aria-label="Datos de tu viaje">
    <div class="origin" id="origin-picker">
      <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="8" cy="8" r="2" fill="currentColor"/></svg>
      <label for="origin-input">Salís desde</label>
      <div class="origin__control"><input id="origin-input" type="text" value="Montevideo (MVD)" autocomplete="off" role="combobox" aria-autocomplete="list" aria-haspopup="listbox" aria-expanded="false" aria-controls="origin-menu" aria-label="Aeropuerto de origen, buscá por ciudad o código IATA"><button id="origin-toggle" type="button" aria-label="Mostrar aeropuertos disponibles" aria-expanded="false"><svg fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="m6 9 6 6 6-6"/></svg></button></div>
      <div id="origin-menu" class="origin__menu" role="listbox" aria-label="Aeropuertos de salida" hidden><button type="button" role="option" data-origin-code="MVD"><strong>Montevideo</strong><span>Aeropuerto Internacional de Carrasco · MVD</span></button><button type="button" role="option" data-origin-code="PDP"><strong>Punta del Este</strong><span>Aeropuerto Internacional de Laguna del Sauce · PDP</span></button></div>
    </div>
    <div>
      <label for="dest-trigger">Destino</label>
      <div id="dest" class="custom-select" aria-label="Seleccioná tu destino">
        <div class="custom-select__control">
          <input id="dest-trigger" class="custom-select__trigger" type="text" role="combobox" aria-autocomplete="list" aria-haspopup="listbox" aria-expanded="false" aria-controls="dest-menu" autocomplete="off" spellcheck="false" placeholder="Buscá un destino…">
        </div>
        <div id="dest-menu" class="custom-select__menu" role="listbox" aria-label="Destinos disponibles" hidden>
          <button id="dest-option-todos" type="button" class="custom-select__option is-selected" data-dest-value="todos" role="option" aria-selected="true">
            <span class="custom-select__option-main">🌍 Todos los destinos</span>
            <span class="custom-select__option-sub">Buscar por mi presupuesto</span>
          </button>
        </div>
      </div>
    </div>
    <div class="date-range-picker">
      <div class="row2 date-range-fields">
        <button type="button" id="dep-trigger" class="date-range-field" aria-haspopup="dialog" aria-controls="date-range-panel" aria-expanded="false"><span>Ida</span><strong id="dep-label">Elegí una fecha</strong></button>
        <button type="button" id="ret-trigger" class="date-range-field" aria-haspopup="dialog" aria-controls="date-range-panel" aria-expanded="false"><span>Vuelta</span><strong id="ret-label">Elegí una fecha</strong></button>
      </div>
      <div id="date-range-panel" class="date-range-panel" role="dialog" aria-label="Elegí las fechas de tu viaje" hidden>
        <div class="date-range-panel__top"><button type="button" class="date-range-nav" data-calendar-nav="prev" aria-label="Mes anterior"><svg fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="m15 6-6 6 6 6"/></svg></button><p id="date-range-instruction" aria-live="polite">Elegí la fecha de ida</p><button type="button" class="date-range-nav" data-calendar-nav="next" aria-label="Mes siguiente"><svg fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="m9 6 6 6-6 6"/></svg></button></div>
        <div id="date-range-months" class="date-range-months"></div>
      </div>
      <input id="dep" type="date" tabindex="-1" aria-hidden="true" hidden>
      <input id="ret" type="date" tabindex="-1" aria-hidden="true" hidden>
    </div>
    <div class="row2">
      <div>
        <span class="lbl" id="paxl">Viajeros</span>
        <div class="step" role="group" aria-labelledby="paxl">
          <button type="button" id="pm" aria-label="Un viajero menos"><svg fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M5 12h14"/></svg></button>
          <output id="pax" aria-live="polite">2</output>
          <button type="button" id="pp" aria-label="Un viajero más"><svg fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 5v14M5 12h14"/></svg></button>
        </div>
      </div>
      <div>
        <label for="bud">Presupuesto total</label>
        <div class="money"><span>US$</span><input id="bud" class="inp" type="number" inputmode="numeric" min="0" step="100"></div>
      </div>
    </div>
    <div>
      <span class="lbl" id="stl">¿Qué tipo de viaje buscás?</span>
      <div class="seg" role="group" aria-labelledby="stl" id="seg">
        <button type="button" data-v="ahorro" aria-pressed="false">Ahorrar al máximo</button>
        <button type="button" data-v="eq" aria-pressed="true">Equilibrado</button>
        <button type="button" data-v="comodo" aria-pressed="false">Con comodidad</button>
      </div>
    </div>
    <!-- Sin `hidden`: el destino inicial es 'todos', asi que este boton es la
         unica via de iniciar una busqueda. Antes dependia de que terminara el
         fetch de /api/destinos para mostrarse, asi que en 3G el formulario se
         quedaba sin boton, y si ese fetch fallaba no habia forma de buscar.
         updateDestinationMode() sigue pudiendo ocultarlo cuando se elige un
         destino concreto. -->
    <button type="button" id="btn-buscar-todos" class="btn-buscar-todos">🔍 Buscar destinos por presupuesto</button>
  </section>

  <section id="destination-highlights" class="destination-highlights" aria-labelledby="destination-highlights-title"></section>

  <div id="results" aria-live="polite"></div>
  <div id="destination-results" aria-live="polite"></div>
  </div>

  <div id="vista-detalle" class="oculto" aria-live="polite">
    <button type="button" id="btn-volver">⬅ Volver a las propuestas</button>
    <div id="detalle-contenido"></div>
  </div>

  <aside id="trip-summary" class="trip-summary" aria-live="polite" hidden></aside>

  <div id="booking-modal" class="booking-modal" hidden aria-hidden="true"></div>
  <div id="checkout-modal" class="booking-modal" hidden aria-hidden="true" aria-label="Reservar y pagar tu vuelo"></div>
  <div id="auth-modal" class="booking-modal" hidden aria-hidden="true"></div>
  <div id="trips-modal" class="booking-modal" hidden aria-hidden="true"></div>
  <div id="install-help" class="booking-modal install-help" hidden aria-hidden="true">
    <div class="booking-dialog install-help__dialog" role="dialog" aria-modal="true" aria-labelledby="install-help-title">
      <button type="button" class="booking-close" data-close-install-help aria-label="Cerrar">×</button>
      <h2 id="install-help-title">Instalar CuántoSale</h2>
      <div id="install-help-content"></div>
    </div>
  </div>

  <footer class="foot" id="foot"></footer>
</div>

<script defer src="/pwa.js"></script>

<!-- GENERADO desde lib/model.js con `npm run build:costos`. Tiene que ir antes
     de app.js porque app.js lee el global al cargar. Sin '?v=' a proposito: lo
     invalida el CACHE_NAME del service worker, que es lo que controla su
     frescura. Si le pusiéramos version propia, volvería a pasar lo de app.js:
     un archivo actualizado que el cache sirve viejo para siempre. -->
<script defer src="/daily-costs.js"></script>
<!-- Contenido de la Guia Secreta, por destino. Va antes de app.js porque
     guiaSecreta() lee window.CS_GUIAS al pintar la vista de detalle.
     Mismo criterio que daily-costs.js: sin '?v=' a propósito, porque un query
     propio invalida la clave del cache del service worker. Para actualizarlo
     se sube CACHE_NAME en sw.js, no esta línea. -->
<script defer src="/guias.js"></script>
<!-- Créditos de las fotos de la guía. Generado por creditos-fotos.js: sin esto
     las imágenes de CC BY-SA se usan sin atribuir al autor. -->
<script defer src="/creditos-fotos.generated.js"></script>
<!-- Precios de transfer por destino. Generado desde data/transfer-precios.json
     con `npm run build:transfer`. Va antes de app.js porque las cards del
     transfer leen de acá cuando el server todavía no mandó meta.officialTransfer. -->
<script defer src="/transfer-precios.js"></script>
<script defer src="/app.js?v=101"></script>

</body>
</html>
