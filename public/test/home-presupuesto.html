<!doctype html>
<html lang="es" data-theme="light" data-pagina="presupuesto">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Maqueta — Destinos por presupuesto</title>
<link rel="stylesheet" href="../style.css">
<style>
  /* "No sé dónde ir": la persona dice cuánto quiere gastar y ve los destinos que entran.
     Un toque en un destino abre el detalle; de ahi se sigue al flujo del viaje. Cifras de ejemplo. */
  body{background:#E9EDF3;margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 12px;font-family:var(--fb)}
  [data-theme="night"] body{background:#05080D}
  .phone{position:relative;width:390px;max-width:100%;height:800px;max-height:calc(100vh - 32px);background:var(--bg);border:10px solid #0A101A;border-radius:48px;box-shadow:0 24px 60px rgba(10,16,26,.28);overflow:hidden;display:flex;flex-direction:column}
  .status{flex:0 0 auto;display:flex;justify-content:space-between;padding:14px 26px 4px;font-size:14px;font-weight:700;color:var(--ink)}
  .scroll{flex:1;overflow-y:auto;padding:4px 16px 20px;scrollbar-width:none}
  .scroll::-webkit-scrollbar{display:none}
  .p-bar{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
  .p-back{width:40px;height:40px;margin-left:-8px;display:grid;place-items:center;border:0;background:transparent;color:var(--ink);cursor:pointer}
  .p-logo{text-align:center;font-family:var(--fh);font-weight:800;font-size:24px;line-height:1.05;color:var(--ink)}
  .p-logo svg{vertical-align:-4px;margin-left:5px;color:#1F6FB5}
  .p-logo small{display:block;font-family:var(--fb);font-weight:500;font-size:11px;color:var(--ink2)}
  h1.p-h{margin:6px 0 4px;font-family:var(--fh);font-size:24px;font-weight:800;line-height:1.15;color:#1F6FB5}
  .p-sub{margin:0 0 14px;font-size:14px;font-weight:600;color:var(--ink2);line-height:1.4}
  .p-budget{display:flex;align-items:center;gap:10px;padding:10px 14px;border:1.5px solid var(--control-border);border-radius:14px;background:var(--surface);color:#1F6FB5}
  .p-budget label{display:flex;flex:1;align-items:center;gap:6px;font-size:16px;font-weight:800;color:var(--ink)}
  .p-budget input{flex:1;min-width:0;width:100%;border:0;background:transparent;font:800 16px var(--fb);color:var(--ink)}
  .p-budget input:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:6px}
  .p-budget span{font-size:13px;font-weight:600;color:var(--ink2);white-space:nowrap}
  .p-chips{display:flex;gap:8px;margin:12px 0 14px}
  .p-chip{display:flex;align-items:center;justify-content:center;gap:6px;padding:9px 14px;border:1.5px solid var(--line);border-radius:99px;background:var(--surface);color:var(--ink);font-family:var(--fb);font-size:13.5px;font-weight:700;cursor:pointer}
  .p-chip.is-on{background:#1F6FB5;border-color:#1F6FB5;color:#fff}
  .p-chip:focus-visible,.p-row:focus-visible,.p-go:focus-visible,.p-back:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
  .p-list{display:flex;flex-direction:column;gap:10px}
  .p-row{display:flex;align-items:center;gap:12px;width:100%;box-sizing:border-box;padding:8px 14px 8px 8px;border:1px solid var(--line);border-radius:16px;background:var(--surface);color:var(--ink);text-align:left;font-family:var(--fb);cursor:pointer}
  .p-row__img{flex:0 0 84px;height:64px;border-radius:12px;background:var(--cel-soft) center/cover}
  .p-row__t{flex:1;min-width:0}
  .p-row__t b{display:block;font-size:16px;line-height:1.2}
  .p-row__t small{display:flex;align-items:center;gap:6px;margin-top:3px;font-size:13px;font-weight:600;color:var(--ink2)}
  .p-row__t small svg{color:#1F6FB5}
  .p-row__p{flex:0 0 auto;text-align:right;font-family:var(--fh);font-size:17px;font-weight:800}
  .p-row__p em{display:block;margin-top:1px;font-family:var(--fb);font-style:normal;font-size:10.5px;font-weight:700;color:var(--ink2)}
  .p-row.is-over .p-row__p{color:var(--ink2)}
  .p-vacio{padding:24px 8px;text-align:center;font-size:14px;font-weight:600;color:var(--ink2)}
  .p-ej{margin:14px 0 0;font-size:11.5px;font-weight:600;color:var(--ink2);text-align:center}
  .p-row__pr{display:block;margin-top:2px;font-family:var(--fh);font-size:19px;font-weight:800;color:var(--ink)}
  .p-row>svg:last-child{flex:0 0 16px;color:var(--ink2)}
  .p-row.is-over .p-row__pr{color:var(--ink2)}
  /* Asistente: pasos 1 y 2 */
  .p-step{min-height:calc(100% - 72px)}
  .p-h2{margin:18px 0 8px;font-family:var(--fh);font-size:16px;font-weight:800;color:#1F6FB5}
  .p-opt{display:flex;align-items:center;gap:12px;width:100%;box-sizing:border-box;margin-bottom:8px;padding:14px;border:1.5px solid var(--line);border-radius:14px;background:var(--surface);color:var(--ink);font-family:var(--fb);font-size:14.5px;font-weight:700;text-align:left;cursor:pointer}
  .p-opt__i{display:grid;place-items:center;width:38px;height:38px;border-radius:50%;background:var(--cel-soft);color:#1F6FB5}
  .p-opt.is-on{border-color:#1F6FB5;background:var(--cel-soft);box-shadow:0 0 0 3px rgba(31,111,181,.15)}
  .p-opt--c{justify-content:center;margin:0;padding:11px 6px;border-radius:99px;font-size:13.5px;text-align:center}
  .p-opt--c.is-on{background:#1F6FB5;border-color:#1F6FB5;color:#fff;box-shadow:none}
  .p-opt:focus-visible,.p-pers button:focus-visible,.p-link:focus-visible,.p-date input:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
  .p-grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .p-tabs{display:flex;gap:8px;margin:2px 0 14px;overflow-x:auto;scrollbar-width:none}
  .p-tabs .p-chip{white-space:nowrap}
  .p-fl{display:block;margin:10px 0 4px;font-size:12.5px;font-weight:700;color:var(--ink2)}
  .p-date{display:flex;align-items:center;gap:10px;padding:12px 14px;border:1px solid var(--line);border-radius:14px;background:var(--surface);color:#1F6FB5}
  .p-date input{flex:1;min-width:0;border:0;background:transparent;font:700 15px var(--fb);color:var(--ink)}
  .p-pers{display:flex;align-items:center;gap:10px;padding:12px 14px;border:1px solid var(--line);border-radius:14px;background:var(--surface);color:#1F6FB5}
  .p-pers b{flex:1;font-size:15px;color:var(--ink)}
  .p-pers span{display:flex;gap:6px}
  .p-pers button{width:34px;height:34px;border:1.5px solid var(--line);border-radius:50%;background:var(--bg);color:var(--ink);font-size:18px;font-weight:700;cursor:pointer}
  .p-pers button:disabled{opacity:.35;cursor:default}
  .p-err{margin:10px 0 0}
  .p-cta{position:sticky;bottom:-20px;margin:14px -16px -20px;padding:12px 16px 22px;background:linear-gradient(180deg,transparent,var(--bg) 28%)}
  /* Resultados */
  .p-res{display:flex;align-items:center;gap:12px;margin:6px 0 10px}
  .p-res__i{flex:0 0 48px;height:48px;border-radius:14px;background:var(--good-soft);color:var(--good);display:grid;place-items:center}
  .p-res h1{margin:0;font-family:var(--fh);font-size:19px;font-weight:800;line-height:1.2;color:#1F6FB5}
  .p-res p{display:flex;align-items:center;gap:5px;margin:3px 0 0;font-size:12.5px;font-weight:600;color:var(--ink2)}
  .p-fechas{display:flex;align-items:center;gap:6px;margin:0 0 4px;font-size:12.5px;font-weight:700;color:var(--ink2)}
  .p-link{border:0;background:transparent;color:#1F6FB5;font:800 12.5px var(--fb);text-decoration:underline;cursor:pointer}
  /* Detalle del destino: hoja que cubre la pantalla. */
  .p-over{position:absolute;inset:0;z-index:20;display:flex;flex-direction:column;background:var(--bg);padding-top:34px}
  .p-over[hidden]{display:none}
  .p-over .scroll{padding-top:0}
  .d-dest{margin:2px 0 0;font-family:var(--fh);font-size:28px;font-weight:800;color:var(--ink);line-height:1.1}
  .d-meta{margin:2px 0 12px;font-size:14px;font-weight:600;color:var(--ink2)}
  .d-seg{display:inline-flex;gap:4px;margin-bottom:12px;padding:3px;border-radius:99px;background:var(--cel-soft)}
  .d-seg button{padding:8px 18px;border:0;border-radius:99px;background:transparent;color:var(--ink);font-family:var(--fb);font-size:13.5px;font-weight:700;cursor:pointer}
  .d-seg button.is-on{background:#1F6FB5;color:#fff}
  .d-seg button:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
  .d-card{overflow:hidden;border:1px solid var(--line);border-radius:18px;background:var(--surface)}
  .d-photo{height:190px;background:var(--cel-soft) center/cover}
  .d-body{padding:14px 16px 16px}
  .d-price{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
  .d-price b{display:block;font-family:var(--fh);font-size:32px;line-height:1.05;color:var(--ink)}
  .d-price small{font-size:13px;font-weight:600;color:var(--ink2)}
  .d-best{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:99px;background:var(--good-soft);color:var(--good);font-size:12.5px;font-weight:800;white-space:nowrap}
  .d-inc{margin:14px 0 6px;font-family:var(--fh);font-size:16px;font-weight:800;color:#1F6FB5}
  .d-list{list-style:none;margin:0;padding:0}
  .d-list li{display:flex;align-items:center;gap:10px;padding:6px 0;font-size:14.5px;font-weight:600;color:var(--ink)}
  .d-list svg{flex:0 0 20px;color:var(--good)}
  .p-foot{flex:0 0 auto;padding:10px 14px 22px;background:var(--bg);border-top:1px solid var(--line)}
  .p-go{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;box-sizing:border-box;padding:15px 16px;border:0;border-radius:14px;background:var(--accent);color:var(--accent-ink);font-family:var(--fb);font-size:14px;font-weight:800;letter-spacing:.02em;text-decoration:none;cursor:pointer}
  @media (max-width:520px){
    body{display:block;padding:0;background:var(--bg)}
    .phone{width:100%;height:100vh;height:100dvh;max-height:none;border:0;border-radius:0;box-shadow:none}
    .status{display:none}
  }
</style>
</head>
<body>
<div class="phone">
  <div class="status"><span>9:41</span><span aria-hidden="true">●●●● ▭</span></div>
  <div class="scroll" id="main"></div>
  <div class="p-over" id="detalle" hidden></div>
</div>
<script src="home-track.js"></script>
<script>
(function () {
  var qs = new URLSearchParams(location.search), fuente = qs.get('fuente') || 'directo', debug = /[?&]debug=1/.test(location.search);
  var $ = function (id) { return document.getElementById(id); };
  var esc = function (s) { return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };
  var f = function (n) { return 'US$ ' + Math.round(n).toLocaleString('es-UY'); };
  var ic = function (p, s) { return '<svg width="' + s + '" height="' + s + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + p + '</svg>'; };
  var I = {
    car: '<path d="M5 16l1.5-6h11L19 16M3 16h18v3H3zM7 19v2M17 19v2"/>',
    avion: '<path d="M17.8 19.2 16 11l3.5-3.5C21 6 21.5 4 21 3c-1-.5-3 0-4.5 1.5L13 8 4.8 6.2c-.5-.1-.9.1-1.1.5l-.3.5c-.2.5-.1 1 .3 1.3L9 12l-2 3H4l-1 1 3 2 2 3 1-1v-3l3-2 3.5 5.3c.3.4.8.5 1.3.3l.5-.2c.4-.3.6-.7.5-1.2z"/>',
    bus: '<rect x="4" y="3" width="16" height="14" rx="3"/><path d="M4 11h16M7 21v-4M17 21v-4"/>',
    back: '<path d="m15 5-7 7 7 7"/>', ok: '<circle cx="12" cy="12" r="9"/><path d="m8 12.5 2.7 2.7L16 9.5"/>', arrow: '<path d="M5 12h14M13 6l6 6-6 6"/>',
    plane: '<path transform="rotate(45 12 12)" d="M21 16v-2l-8-5V3.5c0-.83-.67-1.5-1.5-1.5S10 2.67 10 3.5V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5z"/>'
  };
  var MODOS = { auto: ['En auto', I.car], avion: ['En avión', I.avion], bus: ['En bus', I.bus] };
  var TRANSPORTE = { auto: 'auto', avion: 'flight', bus: 'bus' };
  var DESTS = {};   /* clave -> { nom, precios: { auto|avion|bus: { pp, total, parts } } }, armado con /api/cotizar-todos */
  /* Que incluye cada precio sale del desglose real del modelo: solo se nombra lo que tiene importe. */
  function incluye(nom, parts) {
    var l = [];
    if (parts.auto > 0) l.push('Ruta Montevideo → ' + nom + ' (auto, combustible y peajes)');
    if (parts.pasajes > 0) l.push('Vuelo ida y vuelta Montevideo → ' + nom);
    if (parts.bus > 0) l.push('Pasajes de bus Montevideo → ' + nom);
    if (parts.alojamiento > 0) l.push('Alojamiento');
    if (parts.comidas > 0) l.push('Comida');
    if (parts.local > 0) l.push('Transporte local');
    if (parts.traslados > 0) l.push('Traslados');
    if (parts.tours > 0) l.push('Tours');
    return l;
  }
  var MESES = ['ene.', 'feb.', 'mar.', 'abr.', 'may.', 'jun.', 'jul.', 'ago.', 'sep.', 'oct.', 'nov.', 'dic.'];
  var MESES_L = ['Enero', 'Febrero', 'Marzo', 'Abril', 'Mayo', 'Junio', 'Julio', 'Agosto', 'Septiembre', 'Octubre', 'Noviembre', 'Diciembre'];
  var fdc = function (d) { var q = d.split('-'); return +q[2] + ' ' + MESES[+q[1] - 1]; };
  var iso = function (d) { return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2); };
  var sumarDias = function (s, n) { var d = new Date(s + 'T12:00:00'); d.setDate(d.getDate() + n); return iso(d); };
  var HOY = iso(new Date());
  /* Paso 1: presupuesto y como viaja (cuando). Paso 2: fechas, mes o noches. Paso 3: resultados. */
  var S = { paso: 1, cuando: 'fechas', presupuesto: +qs.get('presupuesto') || 1000, pax: +qs.get('pax') || 2, ida: qs.get('ida') || '2026-12-26', vuelta: qs.get('vuelta') || '2027-01-02',
    mes: -1, noches: '5-7', err: '', modo: 'todos', abierto: null, modoDet: 'auto', cargando: false, error: '', n: 6 };
  var IDA = S.ida, VUELTA = S.vuelta, PAX = S.pax;   /* lo que se consulto de verdad (se fija al continuar) */
  var NOCHES_N = { '5-7': 6, '7-10': 8, '10+': 11 };
  /* Proximos seis meses, a partir del mes que viene (hay que poder reservar con anticipacion). */
  function mesesOfrecidos() {
    var d = new Date(), l = [];
    for (var i = 1; i <= 6; i++) { var m = new Date(d.getFullYear(), d.getMonth() + i, 1); l.push({ i: m.getMonth(), y: m.getFullYear() }); }
    return l;
  }
  /* "Soy flexible": un viaje de ejemplo en ese mes. "Me da igual": en seis semanas. Las fechas exactas las elige la persona despues. */
  function fechasDe() {
    if (S.cuando === 'fechas') return { ida: S.ida, vuelta: S.vuelta };
    var n = NOCHES_N[S.noches], ida;
    if (S.cuando === 'flexible') { var m = mesesOfrecidos().filter(function (x) { return x.i === S.mes; })[0]; ida = iso(new Date(m.y, m.i, 12)); }
    else ida = sumarDias(HOY, 45);
    return { ida: ida, vuelta: sumarDias(ida, n) };
  }
  var track = function (n, p) { window.mockTrack(n, Object.assign({ fuente: fuente, presupuesto: S.presupuesto, modo: S.modo }, p || {})); };

  /* Un pedido por medio de transporte; el presupuesto que recibe el servidor es el del grupo entero. */
  function cargar() {
    S.cargando = true; S.error = ''; pintar();
    var ped = Object.keys(TRANSPORTE).map(function (m) {
      var q = new URLSearchParams({ dep: IDA, ret: VUELTA, pax: PAX, budget: Math.round(S.presupuesto * PAX), style: 'eq', transport: TRANSPORTE[m] });
      return fetch('/api/cotizar-todos?' + q.toString()).then(function (r) { return r.json().then(function (j) { if (!r.ok) throw new Error(j.error || 'error'); return j; }); })
        .then(function (j) { return { m: m, options: j.options || [] }; })
        .catch(function (e) { return { m: m, options: [], error: e.message }; });
    });
    return Promise.all(ped).then(function (rs) {
      DESTS = {};
      rs.forEach(function (r) {
        r.options.forEach(function (o) {
          var d = DESTS[o.dest.key] = DESTS[o.dest.key] || { nom: o.dest.name, precios: {} };
          d.precios[r.m] = { pp: o.pp, total: o.total, parts: o.parts };
        });
      });
      if (!Object.keys(DESTS).length) S.error = (rs[0] && rs[0].error) || 'No pudimos consultar los destinos ahora.';
      S.cargando = false; S.n = 6; pintar();
      track('presupuesto_cargado', { destinos: Object.keys(DESTS).length, error: S.error ? 1 : 0 });
    });
  }

  /* Una fila por destino y medio. Los que entran en el presupuesto van primero, del mas cercano
     al tope hacia abajo; los que lo superan, despues, del mas barato al mas caro. */
  function filas() {
    var l = [];
    Object.keys(DESTS).forEach(function (k) {
      Object.keys(DESTS[k].precios).forEach(function (m) { if (S.modo === 'todos' || S.modo === m) l.push({ k: k, m: m, p: DESTS[k].precios[m].pp }); });
    });
    var dentro = l.filter(function (x) { return x.p <= S.presupuesto; }).sort(function (a, b) { return b.p - a.p; });
    var fuera = l.filter(function (x) { return x.p > S.presupuesto; }).sort(function (a, b) { return a.p - b.p; });
    return dentro.concat(fuera);
  }
  var barra = function () { return '<div class="p-bar"><button type="button" class="p-back" id="atras" aria-label="Volver">' + ic(I.back, 22) + '</button><div class="p-logo">CuántoSale' + ic(I.plane, 24) + '<small>Tu viaje, sin sorpresas</small></div><span style="width:32px"></span></div>'; };
  var iCal = '<rect x="3.5" y="5" width="17" height="15" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/>';
  var iPers = '<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/>';
  var iMezcla = '<path d="M3 7h3c4 0 5 10 9 10h6M3 17h3c1.5 0 2.600-1 3.500-2.500M15 7h6M18 4l3 3-3 3M18 14l3 3-3 3"/>';
  var CUANDO = [['fechas', 'Tengo fechas', iCal], ['flexible', 'Soy flexible', iCal], ['igual', 'Me da igual', iMezcla]];
  var ayuda = function () { return S.err ? '<p class="g-err p-err" role="alert">' + esc(S.err) + '</p>' : ''; };
  var personas = function () {
    return '<h2 class="p-h2">¿Cuántas personas?</h2><div class="p-pers">' + ic(iPers, 22) + '<b>' + S.pax + (S.pax === 1 ? ' persona' : ' personas') + '</b>' +
      '<span><button type="button" data-pax="-1" aria-label="Menos personas"' + (S.pax <= 1 ? ' disabled' : '') + '>−</button><button type="button" data-pax="1" aria-label="Más personas"' + (S.pax >= 9 ? ' disabled' : '') + '>+</button></span></div>';
  };
  /* Paso 1: cuanto quiere gastar y si tiene fechas. */
  function pintarPaso1() {
    $('main').innerHTML = '<div class="p-step">' + barra() +
      '<h1 class="p-h">¿Cuánto querés gastar<br>en tu próximo viaje?</h1><p class="p-sub">Ingresá un monto estimado por persona para que te mostremos las mejores opciones.</p>' +
      '<div class="p-budget"><label for="pres">US$ <input id="pres" type="number" inputmode="numeric" min="100" max="9999" step="50" value="' + S.presupuesto + '"></label><span>por persona</span></div>' + ayuda() +
      '<h2 class="p-h2">¿Cuándo querés viajar?</h2>' +
      CUANDO.map(function (c) {
        return '<button type="button" class="p-opt' + (S.cuando === c[0] ? ' is-on' : '') + '" data-cuando="' + c[0] + '" aria-pressed="' + (S.cuando === c[0]) + '"><span class="p-opt__i">' + ic(c[2], 22) + '</span>' + c[1] + '</button>';
      }).join('') + '</div><div class="p-cta"><button type="button" class="p-go" data-sig="1" data-evento="presupuesto_paso1_continuar">Continuar →</button></div>';
  }
  /* Paso 2: segun lo elegido, fechas exactas, mes y noches, o solo noches. */
  function pintarPaso2() {
    var tabs = '<div class="p-tabs" role="group" aria-label="Cuándo viajar">' + CUANDO.map(function (c) {
      return '<button type="button" class="p-chip' + (S.cuando === c[0] ? ' is-on' : '') + '" data-cuando2="' + c[0] + '" aria-pressed="' + (S.cuando === c[0]) + '">' + c[1] + '</button>';
    }).join('') + '</div>';
    var noches = '<h2 class="p-h2">¿Cuántas noches?</h2><div class="p-grid3">' + ['5-7', '7-10', '10+'].map(function (n) {
      return '<button type="button" class="p-opt p-opt--c' + (S.noches === n ? ' is-on' : '') + '" data-noches="' + n + '" aria-pressed="' + (S.noches === n) + '">' + n.replace('-', ' – ') .replace('10+', '10+') + '</button>';
    }).join('') + '</div>';
    var cuerpo;
    if (S.cuando === 'fechas') {
      cuerpo = '<p class="p-sub">Seleccioná las fechas de tu viaje.</p>' +
        '<label class="p-fl" for="ida">Desde</label><div class="p-date">' + ic(iCal, 22) + '<input id="ida" type="date" min="' + sumarDias(HOY, 1) + '" value="' + S.ida + '"></div>' +
        '<label class="p-fl" for="vuelta">Hasta</label><div class="p-date">' + ic(iCal, 22) + '<input id="vuelta" type="date" min="' + sumarDias(S.ida, 1) + '" value="' + S.vuelta + '"></div>';
    } else if (S.cuando === 'flexible') {
      cuerpo = '<p class="p-sub">Elegí el mes y la duración aproximada de tu viaje.</p><h2 class="p-h2">¿Qué mes te gustaría?</h2><div class="p-grid3">' + mesesOfrecidos().map(function (m) {
        return '<button type="button" class="p-opt p-opt--c' + (S.mes === m.i ? ' is-on' : '') + '" data-mes="' + m.i + '" aria-pressed="' + (S.mes === m.i) + '">' + MESES_L[m.i] + '</button>';
      }).join('') + '</div>' + noches;
    } else {
      cuerpo = '<p class="p-sub">Si no tenés una fecha específica, podemos buscarte las mejores opciones según tu presupuesto.</p>' + noches;
    }
    $('main').innerHTML = '<div class="p-step">' + barra() + '<h1 class="p-h">¿Cuándo querés viajar?</h1>' + tabs + cuerpo + personas() + ayuda() + '</div>' +
      '<div class="p-cta"><button type="button" class="p-go" data-buscar="1" data-evento="presupuesto_paso2_continuar" data-tipo_fechas="' + S.cuando + '">Continuar →</button></div>';
  }
  function pintar() {
    if (S.paso === 1) return pintarPaso1();
    if (S.paso === 2) return pintarPaso2();
    return pintarResultados();
  }
  function pintarResultados() {
    var chips = [['todos', 'Todos'], ['auto', 'Auto'], ['avion', 'Avión'], ['bus', 'Bus']].map(function (c) {
      return '<button type="button" class="p-chip' + (S.modo === c[0] ? ' is-on' : '') + '" data-modo="' + c[0] + '" aria-pressed="' + (S.modo === c[0]) + '">' + (MODOS[c[0]] ? ic(MODOS[c[0]][1], 16) : '') + c[1] + '</button>';
    }).join('');
    var todas = filas(), l = todas.slice(0, S.n);
    var lista = S.cargando ? '<p class="p-vacio" role="status">Buscando destinos para tu presupuesto…</p>'
      : (S.error ? '<p class="p-vacio" role="alert">' + esc(S.error) + '<br><button type="button" class="p-chip" data-reintentar="1" style="margin:10px auto 0">Reintentar</button></p>' : null);
    var dentro = todas.filter(function (x) { return x.p <= S.presupuesto; }).length;
    var titulo = S.cargando ? 'Buscando opciones…' : (dentro ? 'Encontramos ' + dentro + (dentro === 1 ? ' opción dentro de tu presupuesto' : ' opciones dentro de tu presupuesto') : 'No encontramos opciones dentro de tu presupuesto');
    $('main').innerHTML = barra() +
      '<div class="p-res"><span class="p-res__i">' + ic(I.plane, 28) + '</span><div><h1>' + titulo + '</h1><p>' + ic('<path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.4"/>', 14) + 'Montevideo → Brasil · ' + f(S.presupuesto) + ' por persona</p></div></div>' +
      '<p class="p-fechas">' + ic(iCal, 14) + fdc(IDA) + ' → ' + fdc(VUELTA) + ' · ' + PAX + (PAX === 1 ? ' persona' : ' personas') + ' <button type="button" class="p-link" data-editar="1">Cambiar</button></p>' +
      '<div class="p-chips" role="group" aria-label="Forma de llegar">' + chips + '</div>' +
      '<div class="p-list">' + (lista !== null ? lista : (l.length ? l.map(function (x) {
        var over = x.p > S.presupuesto;
        return '<button type="button" class="p-row' + (over ? ' is-over' : '') + '" data-dest="' + x.k + '" data-m="' + x.m + '" data-evento="presupuesto_destino" data-destino="' + x.k + '" data-medio="' + x.m + '" data-precio="' + x.p + '">' +
          '<span class="p-row__img" style="background-image:url(\'../fotos/' + x.k + '.jpg\')" aria-hidden="true"></span>' +
          '<span class="p-row__t"><b>' + esc(DESTS[x.k].nom) + '</b><strong class="p-row__pr">' + f(x.p) + '</strong><small>' + ic(MODOS[x.m][1], 16) + MODOS[x.m][0] + (over ? ' · Supera tu presupuesto' : '') + '</small></span>' + ic('<path d="m9 5 7 7-7 7"/>', 16) + '</button>';
      }).join('') + (todas.length > l.length ? '<button type="button" class="p-chip" data-mas="1" style="align-self:center;margin-top:4px">Ver más destinos</button>' : '') : '<p class="p-vacio">No hay destinos para esa combinación.</p>')) + '</div>' +
      '<p class="p-ej">Estimación por persona para ' + fdc(IDA) + ' → ' + fdc(VUELTA) + ' (' + PAX + (PAX === 1 ? ' persona' : ' personas') + '), con el modelo de costos de CuántoSale.</p>';
  }
  function pintarDetalle() {
    var k = S.abierto, d = DESTS[k], m = S.modoDet, pr = d.precios[m], p = pr.pp;
    var mejor = Object.keys(d.precios).length > 1 && Object.keys(d.precios).every(function (o) { return d.precios[o].pp >= p; });
    var seg = Object.keys(d.precios).map(function (o) {
      return '<button type="button" class="' + (o === m ? 'is-on' : '') + '" data-det-modo="' + o + '" aria-pressed="' + (o === m) + '">' + MODOS[o][0] + '</button>';
    }).join('');
    $('detalle').innerHTML = '<div class="scroll"><div class="p-bar"><button type="button" class="p-back" id="cerrar" aria-label="Volver a la lista">' + ic(I.back, 22) + '</button><div class="p-logo">CuántoSale' + ic(I.plane, 24) + '<small>Tu viaje, sin sorpresas</small></div><span style="width:32px"></span></div>' +
      '<h2 class="d-dest">' + esc(d.nom) + '</h2><p class="d-meta">' + fdc(IDA) + ' → ' + fdc(VUELTA) + ' · ' + PAX + (PAX === 1 ? ' persona' : ' personas') + '</p>' +
      '<div class="d-seg" role="group" aria-label="Forma de llegar">' + seg + '</div>' +
      '<div class="d-card"><div class="d-photo" style="background-image:url(\'../fotos/' + k + '.jpg\')" role="img" aria-label="' + esc(d.nom) + '"></div><div class="d-body">' +
      '<div class="d-price"><div><b>' + f(p) + '</b><small>por persona</small></div>' + (mejor ? '<span class="d-best">' + ic(I.ok, 16) + 'Mejor opción</span>' : '') + '</div>' +
      '<h3 class="d-inc">Incluye</h3><ul class="d-list">' + incluye(d.nom, pr.parts).map(function (t) { return '<li>' + ic(I.ok, 20) + esc(t) + '</li>'; }).join('') + '</ul></div></div></div>' +
      '<div class="p-foot"><a class="p-go" id="ver" href="' + irFlujo(k, m) + '" data-evento="presupuesto_ver_detalle" data-destino="' + k + '" data-medio="' + m + '" data-precio="' + p + '">Ver detalle del viaje ' + ic(I.arrow, 18) + '</a></div>';
  }
  /* El flujo ya sabe armar el viaje de un destino: se le pasa destino, personas y fechas. */
  function irFlujo(k, m) {
    var q = new URLSearchParams({ destino: k, nombre: DESTS[k].nom, pax: PAX, ida: IDA, vuelta: VUELTA, modo: m, fuente: 'presupuesto_detalle', origen_home: fuente });
    return 'home-flujo.html?' + q.toString() + (debug ? '&debug=1' : '');
  }
  function abrir(k, m) { S.abierto = k; S.modoDet = m; pintarDetalle(); $('detalle').hidden = false; $('cerrar').focus(); track('presupuesto_detalle_vista', { destino: k, medio: m, precio: DESTS[k].precios[m].pp }); }
  function cerrar() { $('detalle').hidden = true; S.abierto = null; var r = $('main').querySelector('.p-row'); if (r) r.focus(); }

  document.addEventListener('click', function (e) {
    var t = e.target.closest('button'); if (!t) return;
    if (t.id === 'atras') {
      if (S.paso === 1) location.href = 'home-dos-caminos.html' + (debug ? '?debug=1' : '');
      else { S.paso--; S.err = ''; pintar(); }
      return;
    }
    if (t.dataset.cuando) {
      var m0 = Math.round(+($('pres') || {}).value); if (m0 >= 100 && m0 <= 9999) S.presupuesto = m0;
      S.cuando = t.dataset.cuando; S.err = ''; pintar(); return;
    }
    if (t.dataset.cuando2) { S.cuando = t.dataset.cuando2; S.err = ''; track('presupuesto_cuando', { cuando: S.cuando }); pintar(); return; }
    if (t.dataset.mes) { S.mes = +t.dataset.mes; S.err = ''; pintar(); return; }
    if (t.dataset.noches) { S.noches = t.dataset.noches; pintar(); return; }
    if (t.dataset.pax) { S.pax = Math.max(1, Math.min(9, S.pax + (+t.dataset.pax))); pintar(); return; }
    if (t.dataset.editar) { S.paso = 2; S.abierto = null; pintar(); return; }
    if (t.dataset.sig) {
      var v = Math.round(+($('pres') || {}).value);
      if (!(v >= 100 && v <= 9999)) { S.err = 'Escribí un monto entre US$ 100 y US$ 9.999 por persona.'; pintar(); return; }
      S.presupuesto = v; S.err = ''; S.paso = 2; track('presupuesto_monto', { monto: v, cuando: S.cuando }); pintar(); return;
    }
    if (t.dataset.buscar) {
      if (S.cuando === 'fechas') {
        if (!S.ida || !S.vuelta || S.ida < sumarDias(HOY, 1)) S.err = 'Elegí una fecha de ida a partir de mañana.';
        else if (S.vuelta <= S.ida) S.err = 'La vuelta tiene que ser posterior a la ida.';
      } else if (S.cuando === 'flexible' && S.mes < 0) S.err = 'Elegí el mes en que te gustaría viajar.';
      if (S.err) { pintar(); return; }
      var fe = fechasDe(); IDA = fe.ida; VUELTA = fe.vuelta; PAX = S.pax; S.paso = 3; S.modo = 'todos';
      track('presupuesto_buscar', { cuando: S.cuando, noches: S.cuando === 'fechas' ? Math.round((new Date(VUELTA) - new Date(IDA)) / 864e5) : NOCHES_N[S.noches], personas: PAX });
      cargar(); return;
    }
    if (t.id === 'cerrar') { cerrar(); return; }
    if (t.dataset.modo) { S.modo = t.dataset.modo; track('presupuesto_filtro_medio', { medio: S.modo }); pintar(); return; }
    if (t.dataset.mas) { S.n += 6; pintar(); return; }
    if (t.dataset.reintentar) { cargar(); return; }
    if (t.dataset.dest) { abrir(t.dataset.dest, t.dataset.m); return; }
    if (t.dataset.detModo) { S.modoDet = t.dataset.detModo; track('presupuesto_cambiar_medio', { destino: S.abierto, medio: S.modoDet }); pintarDetalle(); var s = document.querySelector('.d-seg .is-on'); if (s) s.focus(); }
  });
  /* Las fechas se guardan al cambiar, sin volver a pintar: pintar cerraria el selector de fechas. */
  document.addEventListener('change', function (e) {
    if (e.target.id === 'ida') { S.ida = e.target.value; if (S.vuelta <= S.ida) S.vuelta = sumarDias(S.ida, 7); S.err = ''; pintar(); }
    else if (e.target.id === 'vuelta') { S.vuelta = e.target.value; S.err = ''; }
  });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && S.abierto) cerrar(); });
  pintar();
})();
</script>
</body>
