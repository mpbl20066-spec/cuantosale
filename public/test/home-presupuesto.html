<!doctype html>
<html lang="es" data-theme="light" data-pagina="presupuesto">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Destinos por presupuesto · CuántoSale</title>
<script src="tema.js"></script>
<link rel="stylesheet" href="../style.css">
<link rel="stylesheet" href="cuenta.css">
<style>
  /* "No sé dónde ir": la persona dice cuánto quiere gastar y ve los destinos que entran.
     Un toque en un destino abre el detalle; de ahi se sigue al flujo del viaje. Cifras de ejemplo. */
  body{background:#E9EDF3;margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 12px;font-family:var(--fb)}
  [data-theme="night"] body{background:#05080D}
  .phone{position:relative;width:390px;max-width:100%;height:800px;max-height:calc(100vh - 32px);background:var(--bg);border:10px solid #0A101A;border-radius:48px;box-shadow:0 24px 60px rgba(10,16,26,.28);overflow:hidden;display:flex;flex-direction:column}
  .status{flex:0 0 auto;display:flex;justify-content:space-between;padding:14px 26px 4px;font-size:14px;font-weight:700;color:var(--ink)}
  /* La barra con la flecha y el logo: hermano del contenedor que scrollea, asi que
     no se mueve nunca. Por eso no lleva position: sticky ni absolute. */
  .p-top{flex:0 0 auto;padding:4px 16px 10px;background:var(--bg)}
  .scroll{flex:1;overflow-y:auto;padding:4px 16px 20px;scrollbar-width:none}
  .scroll::-webkit-scrollbar{display:none}
  .p-bar{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
  .p-back__t{display:none}
  .p-back{width:40px;height:40px;margin-left:-8px;display:grid;place-items:center;border:0;background:transparent;color:var(--ink);cursor:pointer}
  .p-logo{text-align:center;font-family:var(--fh);font-weight:800;font-size:24px;line-height:1.05;color:var(--ink)}
  .p-logo svg{vertical-align:-4px;margin-left:5px;color:var(--azul)}
  .p-logo small{display:block;font-family:var(--fb);font-weight:500;font-size:11px;color:var(--ink2)}
  h1.p-h{margin:6px 0 4px;font-family:var(--fh);font-size:24px;font-weight:800;line-height:1.15;color:var(--azul)}
  .p-sub{margin:0 0 14px;font-size:14px;font-weight:600;color:var(--ink2);line-height:1.4}
  .p-budget{display:flex;align-items:center;gap:10px;padding:10px 14px;border:1.5px solid var(--control-border);border-radius:14px;background:var(--surface);color:var(--azul)}
  .p-budget label{display:flex;flex:1;align-items:center;gap:6px;font-size:16px;font-weight:800;color:var(--ink)}
  .p-budget input{flex:1;min-width:0;width:100%;border:0;background:transparent;font:800 16px var(--fb);color:var(--ink)}
  .p-budget input:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:6px}
  .p-budget span{font-size:13px;font-weight:600;color:var(--ink2);white-space:nowrap}
  /* Los filtros por medio y por tipo de destino vivieron en la pantalla de
     resultados. El paso 3 ahora muestra solo los destinos que entran en el
     presupuesto, con el medio ya elegido en el paso 2, asi que las pastillas
     quedaron sin uso y se fueron con ellas. */
  .p-chips{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 14px}
  .p-chip{display:flex;align-items:center;justify-content:center;gap:6px;padding:9px 14px;border:1.5px solid var(--line);border-radius:99px;background:var(--surface);color:var(--ink);font-family:var(--fb);font-size:13.5px;font-weight:700;cursor:pointer}
  .p-chip.is-on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
  .p-chip:focus-visible,.p-go:focus-visible,.p-back:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
  .p-vacio{padding:24px 8px;text-align:center;font-size:14px;font-weight:600;color:var(--ink2)}
  .p-ej{margin:14px 0 0;font-size:11.5px;font-weight:600;color:var(--ink2);text-align:center}
  /* Asistente: pasos 1 y 2 */
  .p-step{min-height:calc(100% - 72px)}
  /* la tarjeta nunca se sale del ancho disponible: border-box en todo y los hijos flex pueden encogerse */
  .p-card,.p-card *{box-sizing:border-box;min-width:0}
  .p-card{width:100%;max-width:100%}
  .p-chip{flex:0 1 auto}
  .p-card .p-opt__i,.p-card svg{flex-shrink:0}
  .p-h2{margin:18px 0 8px;font-family:var(--fh);font-size:16px;font-weight:800;color:var(--azul)}
  .p-opt{display:flex;align-items:center;gap:12px;width:100%;box-sizing:border-box;margin-bottom:8px;padding:14px;border:1.5px solid var(--line);border-radius:14px;background:var(--surface);color:var(--ink);font-family:var(--fb);font-size:14.5px;font-weight:700;text-align:left;cursor:pointer}
  /* El paso del medio de transporte muestra nombre y bajada en dos lineas. */
  .p-opt>span:not(.p-opt__i){flex:1;min-width:0}
  .p-opt b{display:block;font-size:15px;line-height:1.2}
  .p-opt small{display:block;margin-top:3px;font-size:12.5px;font-weight:600;color:var(--ink2);line-height:1.35}
  .p-opt__i{display:grid;place-items:center;width:38px;height:38px;border-radius:50%;background:var(--cel-soft);color:var(--azul)}
  .p-opt.is-on{border-color:var(--accent);background:var(--cel-soft);box-shadow:0 0 0 3px rgba(247,195,37,.22)}
  .p-opt--c{justify-content:center;margin:0;padding:11px 6px;border-radius:99px;font-size:13.5px;text-align:center}
  .p-opt--c.is-on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);box-shadow:none}
  .p-opt:focus-visible,.p-pers button:focus-visible,.p-link:focus-visible,.p-date input:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
  .p-grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .p-tabs{display:flex;gap:8px;margin:2px 0 14px;overflow-x:auto;scrollbar-width:none}
  .p-tabs .p-chip{white-space:nowrap}
  .p-fl{display:block;margin:10px 0 4px;font-size:12.5px;font-weight:700;color:var(--ink2)}
  .p-date{display:flex;align-items:center;gap:10px;padding:12px 14px;border:1px solid var(--line);border-radius:14px;background:var(--surface);color:var(--azul)}
  .p-date input{flex:1;min-width:0;border:0;background:transparent;font:700 15px var(--fb);color:var(--ink)}
  .p-pers{display:flex;align-items:center;gap:10px;padding:12px 14px;border:1px solid var(--line);border-radius:14px;background:var(--surface);color:var(--azul)}
  .p-pers b{flex:1;font-size:15px;color:var(--ink)}
  .p-pers span{display:flex;gap:6px}
  .p-pers button{width:34px;height:34px;border:1.5px solid var(--line);border-radius:50%;background:var(--bg);color:var(--ink);font-size:18px;font-weight:700;cursor:pointer}
  .p-pers button:disabled{opacity:.35;cursor:default}
  .p-err{margin:10px 0 0}
  /* El boton de "Continuar" queda fijo abajo mientras el paso es mas largo que la
   pantalla. Antes el fondo era un degradado que arrancaba transparente: las
   tarjetas de "Como preferis viajar?" se veian a traves del boton y parecian
   rotas. Ahora es opaco, con una sombra arriba que separa el boton del contenido
   sin taparlo. El degradado sigue, pero solo en los 14px de arriba. */
  .p-cta{position:sticky;bottom:0;z-index:3;margin:14px -16px -20px;padding:14px 16px 22px;background:var(--bg);box-shadow:0 -18px 14px -6px var(--bg)}
  /* Un boton pegado abajo pisa el contenido que le llega justo debajo. Por eso, SOLO
     en los pasos que tienen boton, el contenedor de scroll deja abajo el alto del
     boton: asi la ultima tarjeta se puede leer completa con el scroll al fondo. Sin
     esto, elegir medio de transporte tapaba la ultima opcion. El paso 3 no lleva
     boton, asi que no necesita (ni debe tener) ese espacio. */
  [data-pagina="presupuesto"] #main:has(.p-cta){padding-bottom:104px}
  /* El paso deja aire abajo para que la ultima fila se pueda leer por encima del
     boton: sin esto, con scroll al fondo, la ultima tarjeta queda debajo. */
  .p-step{padding-bottom:10px}
  /* Paso 3: fechas de la búsqueda y pie de ejemplo */
  .p-fechas{display:flex;align-items:center;gap:6px;margin:10px 0 0;font-size:12.5px;font-weight:700;color:var(--ink2)}
  .p-link{border:0;background:transparent;color:var(--azul);font:800 12.5px var(--fb);text-decoration:underline;cursor:pointer}
  /* Detalle del destino: hoja que cubre la pantalla. */
  .p-over{position:absolute;inset:0;z-index:20;display:flex;flex-direction:column;background:var(--bg);padding-top:34px}
  .p-over[hidden]{display:none}
  .p-over .scroll{padding-top:0}
  .d-dest{margin:2px 0 0;font-family:var(--fh);font-size:28px;font-weight:800;color:var(--ink);line-height:1.1}
  .d-meta{margin:2px 0 12px;font-size:14px;font-weight:600;color:var(--ink2)}
  .d-seg{display:inline-flex;gap:4px;margin-bottom:12px;padding:3px;border-radius:99px;background:var(--cel-soft)}
  .d-seg button{padding:8px 18px;border:0;border-radius:99px;background:transparent;color:var(--ink);font-family:var(--fb);font-size:13.5px;font-weight:700;cursor:pointer}
  .d-seg button.is-on{background:var(--accent);color:var(--accent-ink)}
  .d-seg button:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
  .d-card{overflow:hidden;border:1px solid var(--line);border-radius:18px;background:var(--surface)}
  .d-photo{height:190px;background:var(--cel-soft) center/cover}
  .d-body{padding:14px 16px 16px}
  .d-price{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
  .d-price b{display:block;font-family:var(--fh);font-size:32px;line-height:1.05;color:var(--ink)}
  .d-price small{font-size:13px;font-weight:600;color:var(--ink2)}
  .d-best{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:99px;background:var(--good-soft);color:var(--good);font-size:12.5px;font-weight:800;white-space:nowrap}
  .d-inc{margin:14px 0 6px;font-family:var(--fh);font-size:16px;font-weight:800;color:var(--azul)}
  .d-list{list-style:none;margin:0;padding:0}
  .d-list li{display:flex;align-items:center;gap:10px;padding:6px 0;font-size:14.5px;font-weight:600;color:var(--ink)}
  .d-list svg{flex:0 0 20px;color:var(--good)}
  .p-foot{flex:0 0 auto;padding:10px 14px calc(28px + env(safe-area-inset-bottom));background:var(--bg);border-top:1px solid var(--line)}
  .p-go{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;box-sizing:border-box;padding:15px 16px;border:0;border-radius:14px;background:var(--accent);color:var(--accent-ink);font-family:var(--fb);font-size:14px;font-weight:800;letter-spacing:.02em;text-decoration:none;cursor:pointer}
  @media (max-width:520px){
    body{display:block;padding:0;background:var(--bg)}
    .phone{width:100%;height:100vh;height:100dvh;max-height:none;border:0;border-radius:0;box-shadow:none}
    .status{display:none}
  }
  .p-card{padding:18px 16px 4px;border:1px solid var(--line);border-radius:18px;background:var(--surface)}
  /* Tarjeta de destino del paso 3. La foto va arriba y el texto debajo, como las
     tarjetas de la portada: en una columna angosta la foto al lado recortaba el
     nombre y el precio quedaban pegados. */
  .p-dsts{display:flex;flex-direction:column;gap:14px;margin:14px 0 6px}
  .p-dst{border:1px solid var(--line);border-radius:16px;background:var(--bg);overflow:hidden}
  .p-dst__f{display:block;height:120px;background:var(--cel-soft) center/cover}
  .p-dst__b{padding:12px 14px 14px}
  .p-dst__b h3{margin:0;font-family:var(--fh);font-size:18px;font-weight:800;line-height:1.15;color:var(--ink)}
  .p-dst__m{display:flex;align-items:center;gap:6px;margin:4px 0 0;font-size:12.5px;font-weight:600;color:var(--ink2)}
  .p-dst__m svg{flex:0 0 14px;color:var(--azul)}
  .p-dst__f2{display:flex;align-items:baseline;gap:10px;margin-top:10px}
  .p-dst__f2 b{font-family:var(--fh);font-size:22px;font-weight:800;line-height:1;color:var(--ink)}
  .p-dst__q{font-size:12.5px;font-weight:800;color:var(--good)}
  .p-dst__q.is-over{color:var(--coral)}
  .p-dst__go{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;box-sizing:border-box;margin-top:12px;padding:12px 14px;border:0;border-radius:12px;background:var(--action-bg);color:var(--action-ink);font-family:var(--fb);font-size:14.5px;font-weight:800;cursor:pointer}
  .p-dst__go svg{margin-left:auto}
  .p-dst__go:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
  .p-dst.is-over .p-dst__f2 b{color:var(--ink2)}
  .p-eyebrow{margin:0 0 6px;font-size:11.5px;font-weight:800;letter-spacing:.06em;color:var(--azul)}
  .p-opt__i{width:44px;height:44px}.p-opt__i svg{width:26px;height:26px}
  [data-theme="night"] .p-card{background:#1A2B4A;border-color:#2C4468}
  [data-theme="night"] .p-eyebrow{color:var(--accent)}
  .p-card h1.p-h{margin:0 0 6px;font-size:22px;color:var(--ink)}
  .p-card .p-h2{margin:14px 0 8px;font-size:14px;color:var(--ink)}
  .p-card .p-h2--c{margin-top:20px}
  .p-montos{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
  .p-monto{padding:6px 12px;border:0;border-radius:99px;background:var(--cel-soft);color:var(--ink);font-family:var(--fb);font-size:12.5px;font-weight:700;cursor:pointer}
  .p-monto.is-on{background:var(--accent);color:var(--accent-ink)}
  .p-monto:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
  .p-opt--d{align-items:flex-start;padding:12px 14px;margin-bottom:10px;text-align:left}
  .p-opt--d .p-opt__i{flex:0 0 32px;width:32px;height:32px;background:transparent}
  .p-opt--d b{font-size:14.5px}
  /* El paso va en una tarjeta de 600px centrada, y el boton al mismo ancho.
     Antes esta regla arrancaba en 880px mientras que web.css pone el paso en grilla
     de dos columnas desde 768px. Entre 768 y 880 no aplicaba ninguna de las dos
     Composiciones bien: la tarjeta (mas alta que la fila de la grilla) desbordaba y
     el boton de "Continuar" se le montaba encima, tapando la ultima opcion de
     transporte. Se arranca en 768px, que es donde empieza la composicion de
     escritorio, y no queda el hueco. */
  @media (min-width:768px){
    [data-pagina="presupuesto"] #main:not(:has(>.p-form))>.p-step:has(.p-card){display:block;max-width:700px;margin:0 auto;flex:0 0 auto}
    /* la flecha de volver va dentro de la misma columna de 700px que la tarjeta, con la palabra "Volver" al lado */
    html[data-pagina="presupuesto"] .phone>.p-top{width:100%;max-width:700px;margin:0 auto;padding:12px 24px 0;box-sizing:border-box}
    html[data-pagina="presupuesto"] .phone>.p-top .p-bar{margin-bottom:12px;padding:0;justify-content:flex-start}
    html[data-pagina="presupuesto"] .p-top .p-bar>span{display:none}
    .p-top .p-back{width:auto;height:44px;margin-left:-8px;padding:0 12px 0 8px;gap:6px;display:inline-flex;align-items:center;font-family:var(--fb);font-size:14px;font-weight:600;color:var(--ink2)}
    .p-top .p-back:hover{color:var(--ink)}
    .p-top .p-back__t{display:inline}
    html.cs-hdr[data-pagina="presupuesto"] .p-top .p-back{transform:none}
    [data-pagina="presupuesto"] #main:not(:has(>.p-form))>.p-step:has(.p-card){padding-left:24px;padding-right:24px;box-sizing:border-box}
    [data-pagina="presupuesto"] .p-card{padding:32px;box-shadow:0 4px 20px rgba(0,0,0,.3)}
    [data-pagina="presupuesto"] #main:not(:has(>.p-form))>.p-cta:has(.p-go[data-sig],.p-go[data-paso2]){max-width:700px;margin:0 auto;padding:16px 24px 0;box-sizing:border-box}
  }
  /* El azul de la pagina pasa al amarillo de la marca: --cel es amarillo en oscuro y dorado oscuro (legible) en claro. */
  html[data-pagina="presupuesto"]{--azul:var(--cel)}
  /* Escritorio: que el formulario entre en la pantalla sin scroll (laptops de 768px de alto incluidas). */
  @media (min-width:768px){
    [data-pagina="presupuesto"] .p-card{padding:24px 28px 20px}
    [data-pagina="presupuesto"] .p-card h1.p-h{font-size:24px;margin-bottom:4px}
    [data-pagina="presupuesto"] .p-card .p-sub{margin-bottom:10px}
    [data-pagina="presupuesto"] .p-card .p-h2{margin:10px 0 6px;font-size:16px}
    [data-pagina="presupuesto"] .p-card .p-h2--c{margin-top:14px}
    [data-pagina="presupuesto"] .p-card .p-chips{margin:8px 0 6px}
    [data-pagina="presupuesto"] .p-card .p-chip{padding:8px 14px}
    [data-pagina="presupuesto"] .p-card .p-budget{padding:10px 16px}
    [data-pagina="presupuesto"] .p-card .p-opt{margin-bottom:6px;padding:10px 14px}
    [data-pagina="presupuesto"] #main:not(:has(>.p-form))>.p-cta:has(.p-go[data-sig],.p-go[data-paso2]){padding-top:12px}
    html[data-pagina="presupuesto"] .phone>.p-top{padding-top:4px}
    html[data-pagina="presupuesto"] .phone>.p-top .p-bar{margin-bottom:4px}
    html[data-pagina="presupuesto"] #main:has(.p-cta){padding-top:4px;padding-bottom:16px}
  }
  .p-card__h{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
  .p-card__h .p-eyebrow{margin:0}
  .p-badge{padding:3px 10px;border-radius:99px;background:var(--cel-soft);font-size:11px;font-weight:800;color:var(--ink2)}
  h1.p-h--paso{margin:4px 2px 10px;font-size:20px;color:var(--ink)}
  .p-resumen{padding:12px 14px;border-radius:12px;background:var(--bg);line-height:1.4}
  .p-resumen small{display:block;font-size:12px;font-weight:600;color:var(--azul)}
  .p-resumen b{display:block;font-family:var(--fh);font-size:17px;color:var(--ink)}
  .p-resumen span{font-size:12.5px;font-weight:600;color:var(--ink2)}
  .p-sel{position:relative;display:flex;align-items:center;gap:8px;padding:0 12px;border:1.5px solid var(--control-border);border-radius:14px;background:var(--surface);color:var(--azul)}
  .p-sel select{flex:1;min-width:0;padding:14px 0;border:0;background:transparent;color:var(--ink);font:700 14.5px var(--fb)}
  .p-card .p-pers{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border:1.5px solid var(--control-border);border-radius:14px;background:var(--surface)}
  .p-card .p-pers b{display:block;font-size:14.5px;color:var(--ink)}
  .p-card .p-pers small{display:block;font-size:12px;font-weight:600;color:var(--ink2)}
  .p-pers__s{display:flex;align-items:center;gap:10px}
  .p-pers__s output{min-width:18px;text-align:center;font-weight:800}
  .p-pers__s button{width:30px;height:30px;border:1.5px solid var(--control-border);border-radius:50%;background:var(--surface);color:var(--ink);font-size:17px;cursor:pointer}
  .p-pers__s button:disabled{opacity:.35}
  .p-sub--s{margin:-4px 0 8px;font-size:12.5px;color:var(--azul)}
  .p-medios{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
  .p-medio{display:block;padding:12px;border:1.5px solid var(--line);border-radius:14px;background:var(--surface);color:var(--ink);text-align:left;font-family:var(--fb);cursor:pointer}
  .p-medio__i{display:block;margin-bottom:6px;color:var(--azul)}
  .p-medio b{display:block;font-size:14.5px}
  .p-medio small{display:block;margin-top:2px;font-size:11.5px;font-weight:600;color:var(--ink2)}
  .p-medio.is-on{border-color:var(--ink);box-shadow:0 0 0 2px var(--ink) inset}
  .p-medio:focus-visible,.p-sel select:focus-visible,.p-pers__s button:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
  [data-pagina="presupuesto"] h1.p-h.p-h--paso{margin:2px 2px 10px;font-family:var(--fb);font-size:15px;font-weight:700;line-height:1.3;color:var(--ink2)}
  .p-card .p-pers>span:first-child{display:block}
  .p-card .p-pers>span:first-child b,.p-card .p-pers>span:first-child small{display:block}
  .p-card{margin-bottom:6px}
</style>
<link rel="stylesheet" href="web.css">
<link rel="stylesheet" href="layout.css">
</head>
<body>
<div class="phone">
  <div class="status"><span>9:41</span><span aria-hidden="true">●●●● ▭</span></div>
  <!-- La barra con la flecha y el logo va FUERA del contenedor que scrollea. Antes
       se dibujaba dentro de #main, asi que se iba al hacer scroll y en un paso largo

    var cuerpo;
    if (S.cargando) cuerpo = '<p class="p-vacio" role="status">Buscando destinos para tu presupuesto…</p>';
    else if (S.error) cuerpo = '<p class="p-vacio" role="alert">' + esc(S.error) + '<br><button type="button" class="p-chip" data-reintentar="1" style="margin:10px auto 0">Reintentar</button></p>';
    else if (!dentro.length) cuerpo = '<p class="p-vacio">Con ' + f(S.presupuesto) + ' por persona no encontramos destinos que entren. Probá subiendo el monto o comparando todos los medios.</p>';
    else cuerpo = '<div class="p-dsts">' + l.map(function (x) { return tarjetaDest(x, noches); }).join('') +
      (dentro.length > l.length ? '<button type="button" class="p-chip" data-mas="1" style="align-self:center;margin-top:4px">Ver más destinos</button>' : '') + '</div>';
    var sub = S.cargando ? 'Buscando opciones para tu presupuesto…'
      : S.error ? 'No pudimos completar la búsqueda para ' + f(S.presupuesto) + ' por persona.'
      : (dentro.length ? 'Encontramos ' + dentro.length + (dentro.length === 1 ? ' opción que se ajusta' : ' opciones que se ajustan') + ' a tu presupuesto de ' + f(S.presupuesto) + ' por persona.'
        : 'No encontramos destinos para ' + f(S.presupuesto) + ' por persona.');
    $('main').innerHTML = '<div class="p-step">' +
      '<div class="p-card"><div class="p-card__h"><p class="p-eyebrow">BUSCAR POR PRESUPUESTO</p><span class="p-badge">3 de 4</span></div>' +
      '<h1 class="p-h">Estos destinos pueden ser para vos</h1><p class="p-sub">' + esc(sub) + '</p>' +
      '<p class="p-fechas">' + ic(iCal, 14) + fdc(IDA) + ' → ' + fdc(VUELTA) + ' · ' + PAX + (PAX === 1 ? ' persona' : ' personas') + ' <button type="button" class="p-link" data-editar="1">Cambiar</button></p>' +
      cuerpo +
      '<p class="p-ej">Ejemplo ilustrativo. Los precios reales deben calcularse según origen, fechas, transporte y cantidad de personas.</p>' +
      '</div></div>';
  }
  function pintarDetalle() {
    var k = S.abierto, d = DESTS[k], m = S.modoDet, pr = d.precios[m], p = pr.pp;
    var mejor = Object.keys(d.precios).length > 1 && Object.keys(d.precios).every(function (o) { return d.precios[o].pp >= p; });
    var seg = Object.keys(d.precios).map(function (o) {
      return '<button type="button" class="' + (o === m ? 'is-on' : '') + '" data-det-modo="' + o + '" aria-pressed="' + (o === m) + '">' + MODOS[o][0] + '</button>';
    }).join('');
    $('detalle').innerHTML = '<div class="scroll"><div class="p-bar"><button type="button" class="p-back" id="cerrar" aria-label="Volver a la lista">' + ic(I.back, 22) + '</button><div class="p-logo">CuántoSale' + ic(I.plane, 24) + '<small>Tu viaje, sin sorpresas</small></div><span style="width:32px"></span></div>' +
      '<h2 class="d-dest">' + esc(d.nom) + '</h2><p class="d-meta">' + fdc(IDA) + ' → ' + fdc(VUELTA) + ' · ' + PAX + (PAX === 1 ? ' persona' : ' personas') + '</p>' +
      '<div class="d-seg" role="group" aria-label="Forma de llegar">' + seg + '</div>' +
      '<div class="d-card"><div class="d-photo" style="background-image:url(\'../fotos/' + k + '.jpg\')" role="img" aria-label="' + esc(d.nom) + '"></div><div class="d-body">' +
      '<div class="d-price"><div><b>' + f(p) + '</b><small>por persona</small></div>' + (mejor ? '<span class="d-best">' + ic(I.ok, 16) + 'Mejor opción</span>' : '') + '</div>' +
      '<h3 class="d-inc">Incluye</h3><ul class="d-list">' + incluye(d.nom, pr.parts).map(function (t) { return '<li>' + ic(I.ok, 20) + esc(t) + '</li>'; }).join('') + '</ul></div></div></div>' +
      '<div class="p-foot"><a class="p-go" id="ver" href="' + irFlujo(k, m) + '" data-evento="presupuesto_ver_detalle" data-destino="' + k + '" data-medio="' + m + '" data-precio="' + p + '">Ver detalle del viaje ' + ic(I.arrow, 18) + '</a></div>';
  }
  /* El flujo ya sabe armar el viaje de un destino: se le pasa destino, personas y fechas. */
  function irFlujo(k, m) {
    var q = new URLSearchParams({ destino: k, nombre: DESTS[k].nom, pax: PAX, ida: IDA, vuelta: VUELTA, modo: m, fuente: 'presupuesto_detalle', origen_home: fuente });
    /* En auto no se eligen pasajes: se pasa por los datos del auto, combustible, peajes y mapa de la ruta. */
    return (m === 'auto' ? 'home-calcular.html?' : 'home-flujo.html?') + q.toString() + (debug ? '&debug=1' : '');
  }
  function abrir(k, m) { S.abierto = k; S.modoDet = m; pintarDetalle(); $('detalle').hidden = false; $('cerrar').focus(); track('presupuesto_detalle_vista', { destino: k, medio: m, precio: DESTS[k].precios[m].pp }); }
  function cerrar() { $('detalle').hidden = true; S.abierto = null; var r = $('main').querySelector('.p-dst__go'); if (r) r.focus(); }

  document.addEventListener('click', function (e) {
    var t = e.target.closest('button'); if (!t) return;
    if (t.id === 'atras') {
      if (S.paso === 1) location.href = 'home-dos-caminos.html' + (debug ? '?debug=1' : '');
      else { S.paso--; S.err = ''; pintar(); }
      return;
    }
    if (t.dataset.monto) { S.presupuesto = +t.dataset.monto; S.err = ''; track('presupuesto_monto_sugerido', { monto: S.presupuesto }); pintar(); return; }
    if (t.dataset.cuando) {
      var m0 = Math.round(+($('pres') || {}).value); if (m0 >= 100 && m0 <= 9999) S.presupuesto = m0;
      S.cuando = t.dataset.cuando; S.err = ''; pintar(); return;
    }
    if (t.dataset.cuando2) { S.cuando = t.dataset.cuando2; S.err = ''; track('presupuesto_cuando', { cuando: S.cuando }); pintar(); return; }
    if (t.dataset.mes) { S.mes = +t.dataset.mes; S.err = ''; pintar(); return; }
    if (t.dataset.noches) { S.noches = t.dataset.noches; pintar(); return; }
    if (t.dataset.pax) { S.pax = Math.max(1, Math.min(9, S.pax + (+t.dataset.pax))); pintar(); return; }
    if (t.dataset.editar) { S.paso = 2; S.abierto = null; pintar(); return; }
    if (t.dataset.sig) {
      var v = Math.round(+($('pres') || {}).value);
      if (!(v >= 100 && v <= 9999)) { S.err = 'Escribí un monto entre US$ 100 y US$ 9.999 por persona.'; pintar(); return; }
      S.presupuesto = v; S.err = ''; S.paso = 2; track('presupuesto_monto', { monto: v, cuando: S.cuando }); pintar(); return;
    }
    if (t.dataset.medio2) { S.medio = t.dataset.medio2; S.err = ''; track('presupuesto_medio', { medio: S.medio }); pintar(); return; }
    if (t.dataset.paso2) {
      if (!S.medio) { S.err = 'Elegí cómo preferís viajar o comparar todas las opciones.'; pintar(); return; }
      /* Las fechas se validan aca porque esta pantalla las pide: el paso 2 es el
         ultimo antes de buscar. Mismas reglas que tenia el paso de fechas. */
      if (S.cuando === 'fechas') {
        if (!S.ida || !S.vuelta || S.ida < sumarDias(HOY, 1)) S.err = 'Elegí una fecha de ida a partir de mañana.';
        else if (S.vuelta <= S.ida) S.err = 'La vuelta tiene que ser posterior a la ida.';
      } else if (S.cuando === 'flexible' && S.mes < 0) S.err = 'Elegí el mes en que te gustaría viajar.';
      if (S.err) { pintar(); return; }
      PAX = S.pax; track('presupuesto_paso2', { origen: S.origen, personas: S.pax, medio: S.medio, cuando: S.cuando });
      irAResultados(); return;
    }
    if (t.dataset.buscar) {
      if (S.cuando === 'fechas') {
        if (!S.ida || !S.vuelta || S.ida < sumarDias(HOY, 1)) S.err = 'Elegí una fecha de ida a partir de mañana.';
        else if (S.vuelta <= S.ida) S.err = 'La vuelta tiene que ser posterior a la ida.';
      } else if (S.cuando === 'flexible' && S.mes < 0) S.err = 'Elegí el mes en que te gustaría viajar.';
      if (S.err) { pintar(); return; }
      irAResultados(); return;
    }
    if (t.id === 'cerrar') { cerrar(); return; }
    if (t.dataset.mas) { S.n += 6; pintar(); return; }
    if (t.dataset.reintentar) { cargar(); return; }
    if (t.dataset.dest) { abrir(t.dataset.dest, t.dataset.m); return; }
    if (t.dataset.detModo) { S.modoDet = t.dataset.detModo; track('presupuesto_cambiar_medio', { destino: S.abierto, medio: S.modoDet }); pintarDetalle(); var s = document.querySelector('.d-seg .is-on'); if (s) s.focus(); }
  });
  /* Las fechas se guardan al cambiar, sin volver a pintar: pintar cerraria el selector de fechas. */
  document.addEventListener('change', function (e) {
    if (e.target.id === 'origen') { S.origen = e.target.value; track('presupuesto_origen', { origen: S.origen }); return; }
    if (e.target.id === 'ida') { S.ida = e.target.value; if (S.vuelta <= S.ida) S.vuelta = sumarDias(S.ida, 7); S.err = ''; pintar(); }
    else if (e.target.id === 'vuelta') { S.vuelta = e.target.value; S.err = ''; }
  });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && S.abierto) cerrar(); });
  pintar();
})();
</script>
<script src="cuenta.js"></script>
<script src="cabecera.js"></script>
</body>
</html>
