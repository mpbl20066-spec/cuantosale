<!doctype html>
<html lang="es" data-theme="light" data-pagina="flujo">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Maqueta — Armá tu viaje por etapas</title>
<script src="tema.js"></script>
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<script src="instalar.js" defer></script>
<script src="moneda.js"></script>
<script src="/daily-costs.js"></script>
<link rel="stylesheet" href="../style.css">
<link rel="stylesheet" href="cuenta.css">
<style>
  /* Flujo por etapas: Vuelos + Traslados, Alojamiento, Extras, Tu presupuesto.
     Colores, tipografia y tarjetas salen de los tokens de la app. Cifras de ejemplo. */
  body{background:#E9EDF3;margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 12px;font-family:var(--fb)}
  [data-theme="night"] body{background:#05080D}
  .phone{position:relative;width:390px;max-width:100%;height:800px;max-height:calc(100vh - 32px);background:var(--bg);border:10px solid #0A101A;border-radius:48px;box-shadow:0 24px 60px rgba(10,16,26,.28);overflow:hidden;display:flex;flex-direction:column}
  .status{flex:0 0 auto;display:flex;justify-content:space-between;padding:14px 26px 4px;font-size:14px;font-weight:700;color:var(--ink)}
  button{font-family:var(--fb)}

  .f-bar{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;padding:0 16px}
  .f-back{width:40px;height:40px;margin-left:-8px;border:0;background:transparent;color:var(--ink);display:grid;place-items:center;cursor:pointer}
  .f-logo{text-align:center;font-family:var(--fh);font-weight:800;font-size:22px;line-height:1.05;color:var(--ink)}
  
  .f-logo small{display:block;font-family:var(--fb);font-weight:500;font-size:10.5px;color:var(--ink2)}

  /* Indicador de progreso */
  .f-steps{flex:0 0 auto;display:flex;padding:8px 14px 6px;margin:0;list-style:none}
  .f-step{flex:1;position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;border:0;background:transparent;padding:0;color:var(--ink2);font-size:10.5px;font-weight:600;text-align:center;line-height:1.15;cursor:default}
  .f-step::before{content:"";position:absolute;top:13px;right:50%;width:100%;height:2px;background:var(--line)}
  .f-step:first-child::before{display:none}
  .f-step.is-done::before,.f-step.is-on::before{background:var(--ink)}
  .f-dot{position:relative;z-index:1;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;border:2px solid var(--line);background:var(--bg);font-size:13px;font-weight:800;color:var(--ink2)}
  .f-step.is-on .f-dot{background:var(--action-bg);border-color:var(--action-bg);color:var(--action-ink)}
  .f-step.is-on{color:var(--ink);font-weight:800}
  .f-step.is-link{cursor:pointer}
  .f-step.is-link:hover .f-dot{border-color:var(--ink)}
  .f-step.is-done{color:var(--ink)}
  .f-step.is-done .f-dot{background:var(--ink);border-color:var(--ink);color:var(--bg)}

  /* Total acumulado */
  .f-total{flex:0 0 auto;display:flex;align-items:center;gap:10px;margin:6px 16px 0;padding:9px 12px;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
  .f-total svg{flex:0 0 auto;color:var(--azul)}
  .f-total svg:last-child{color:var(--ink2)}
  .f-total div{flex:1;min-width:0;font-size:13px;font-weight:700;color:var(--ink)}
  .f-total small{display:block;font-size:11.5px;font-weight:600;color:var(--ink2)}
  .f-total div b{font-family:var(--fh);font-size:15px;color:var(--ink);font-variant-numeric:tabular-nums}
  .f-total.is-bump b{animation:bump .35s ease}
  @keyframes bump{40%{transform:scale(1.12)}}

  .f-scroll{flex:1;overflow-y:auto;padding:12px 16px 16px;scrollbar-width:none}
  .f-scroll::-webkit-scrollbar{display:none}
  .f-h{font-family:var(--fh);font-size:22px;font-weight:800;margin:4px 0 0;color:var(--ink)}
  .f-sub{margin:2px 0 10px;color:var(--ink2);font-size:13px;font-weight:600}
  .f-sort{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 12px}
  .f-sort::-webkit-scrollbar{display:none}
  .f-chip{flex:0 0 auto;padding:8px 11px;white-space:nowrap;border:1.5px solid var(--control-border);border-radius:99px;background:var(--surface);color:var(--ink);font-size:12.5px;font-weight:700;cursor:pointer}
  .f-chip.is-on{background:var(--action-bg);border-color:var(--action-bg);color:var(--action-ink)}

  /* Tarjetas elegibles: borde y sombra amarillos al elegir, como en la app. */
  .opt{position:relative;display:block;width:100%;box-sizing:border-box;margin:0 0 10px;padding:14px;text-align:left;border:1.5px solid var(--card-border,var(--line));border-radius:var(--card-radius,18px);background:var(--card-bg,var(--surface));color:var(--ink);cursor:pointer;box-shadow:0 3px 10px rgba(16,35,62,.08)}
  .opt.is-sel{background:var(--card-sel-bg,var(--surface));border:2px solid var(--card-sel-border);padding:13.5px;box-shadow:var(--card-sel-glow)}
  .opt__tick{position:absolute;top:10px;right:10px;width:24px;height:24px;border-radius:50%;background:var(--action-bg);color:var(--action-ink);display:grid;place-items:center;font-size:13px;font-weight:800;opacity:0;transform:scale(.6);transition:.15s}
  .opt.is-sel .opt__tick{opacity:1;transform:none}
  .opt:focus-visible,.f-chip:focus-visible,.f-cta:focus-visible,.f-back:focus-visible,.f-step:focus-visible,.f-more:focus-visible,.f-add:focus-visible,.f-book:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
  .tagok{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:99px;background:var(--good-soft);color:var(--good);font-size:11.5px;font-weight:800}

  .fl__air{display:flex;align-items:center;gap:8px;font-weight:800;font-size:14px;margin-bottom:8px;padding-right:30px}
  .fl__logo{width:22px;height:22px;border-radius:6px;background:var(--selected-bg);display:grid;place-items:center;font-size:10px;font-weight:800}
  .fl__row{display:flex;align-items:center;gap:10px}
  .fl__t{font-family:var(--fh);font-size:19px;font-weight:800;line-height:1}
  .fl__t small{display:block;margin-top:3px;font-family:var(--fb);font-size:11px;font-weight:700;color:var(--ink2)}
  .fl__mid{flex:1;text-align:center;font-size:11px;font-weight:600;color:var(--ink2)}
  .fl__mid i{display:block;height:2px;margin:4px 0;border-radius:2px;background:var(--line)}
  .fl__price{margin-left:6px;text-align:right}
  .fl__price b{display:block;font-family:var(--fh);font-size:19px}
  .fl__price small{font-size:11px;font-weight:600;color:var(--ink2)}
  .fl__foot{margin-top:8px}

  .tr{display:flex;gap:12px;align-items:center}
  .tr__ico{flex:0 0 52px;height:52px;border-radius:12px;background:var(--cel-soft);display:grid;place-items:center;color:var(--ink)}
  .tr b,.tr strong{display:block;font-size:14px}
  .tr small{display:block;color:var(--ink2);font-size:12px;font-weight:600;line-height:1.35}
  .tr__p{margin-left:auto;font-family:var(--fh);font-weight:800;font-size:16px;white-space:nowrap;padding-right:22px}
  .f-h3{display:flex;align-items:center;gap:8px;font-family:var(--fh);font-size:17px;font-weight:800;margin:18px 0 2px;color:var(--ink)}
  .f-h3 svg{color:var(--azul)}
  .f-h3+.f-sub{margin-bottom:8px}
  .ho-mas{display:flex;justify-content:center;gap:4px 18px;flex-wrap:wrap}
  .ho-mas .f-more{margin:2px 0 0}
  .f-more{display:block;margin:2px auto 0;padding:8px 14px;border:0;background:transparent;color:var(--ink);font-size:13px;font-weight:700;text-decoration:underline;text-underline-offset:3px;cursor:pointer}

  .trc:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
  .trc{display:grid;grid-template-columns:104px minmax(0,1fr);grid-template-rows:1fr auto;gap:8px 12px;padding:12px;cursor:pointer;overflow:hidden}
  /* Las dos tarjetas de transfer, lado a lado, con el mismo alto: se estiran a la fila y el precio queda abajo en las dos. */
  html[data-pagina="flujo"] .f-scroll[data-paso="1"]>.opt.trc{align-self:stretch;margin-bottom:12px;min-height:172px}
  .trc__rec{position:absolute;top:12px;left:12px;z-index:1;padding:3px 9px;border-radius:99px;background:var(--action-bg);color:var(--action-ink);font-size:11px;font-weight:800}
  .trc__img{position:relative;grid-row:1/3;align-self:stretch;min-height:140px;border-radius:12px;background:#EEF0F3 center/contain no-repeat}
  .trc__b b{display:block;font-size:15px;line-height:1.2}
  .trc__b>small{display:block;color:var(--ink2);font-size:12px;font-weight:600;margin:1px 0 4px}
  .trc__b ul{list-style:none;margin:0;padding:0}
  .trc__b li{display:flex;align-items:flex-start;gap:6px;font-size:12px;font-weight:600;color:var(--ink);line-height:1.3;padding:1px 0}
  .trc__b li svg{flex:0 0 16px;margin-top:1px;color:var(--azul)}
  .trc__p{grid-column:2;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;padding-top:8px;border-top:1px solid var(--line)}
  .trc__p b{font-family:var(--fh);font-size:22px;line-height:1;color:var(--ink)}
  .trc__p small{color:var(--ink2);font-size:11.5px;font-weight:600}

  .ho__head{display:flex;align-items:center;gap:12px}
  .ho__headico{flex:0 0 52px;height:52px;border-radius:50%;background:var(--cel-soft);display:grid;place-items:center;color:var(--azul)}
  .f-n{margin-left:3px;padding:0 6px;border-radius:99px;background:rgba(0,0,0,.08);font-size:11px}
  .f-chip.is-on .f-n{background:rgba(0,0,0,.16)}
  .f-zchips,.f-orden{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 10px;align-items:center}
  .f-orden{gap:8px}
  .f-orden>span{font-size:12.5px;font-weight:700;color:var(--ink)}
  .f-orden .f-sort{margin:0}
  /* Filtros de alojamiento: categoria y zona o playa en una tarjeta */
  .hc{margin:12px 0 14px;padding:14px;border:1px solid var(--card-border,var(--line));border-radius:16px;background:var(--card-bg,var(--surface))}
  .hc-cat{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px}
  .hc-zona{margin-top:12px;padding-top:12px;border-top:1px dashed var(--line)}
  .hc-cat:only-child,.hc-zona:only-child{margin:0;padding:0;border:0}
  .hc-l{font-size:12.5px;font-weight:700;color:var(--azul,var(--ink2))}
  .hc-l--up{display:block;margin-bottom:8px;font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2)}
  .hc-chips{display:flex;flex-wrap:wrap;gap:8px}
  .hc-chip{display:inline-flex;align-items:center;gap:4px;min-height:38px;padding:0 14px;border:1.5px solid var(--line);border-radius:99px;background:transparent;color:var(--ink);font:700 13px var(--fb);cursor:pointer}
  .hc-chip:hover{border-color:var(--ink2)}
  .hc-chip.is-on{border:2px solid #F5C518;padding:0 13.5px;font-weight:800}
  .hc-chip:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
  .hp-vacio{margin:6px 0 12px;padding:14px;border-radius:12px;background:var(--cel-soft);text-align:center;font-size:13.5px;font-weight:600;color:var(--ink)}
  .hp-vacio p{margin:0}
  .ho{display:grid;grid-template-columns:104px minmax(0,1fr);gap:8px 12px;padding:10px;cursor:pointer}
  .ho.is-sel{padding:9.5px}
  .ho:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
  .ho__img{position:relative;align-self:stretch;min-height:128px;border-radius:14px;background:var(--selected-bg) center/cover}
  .ho__on,.ho__ins{position:absolute;left:6px;display:inline-flex;align-items:center;gap:5px;padding:3px 8px;border-radius:99px;font-size:10.5px;font-weight:800;line-height:1.2;max-width:calc(100% - 12px)}
  .ho__on{bottom:6px;background:var(--good);color:#fff}
  /* Etiqueta oscura como en la app ("Mejor precio", "Recomendado", "Mas popular"): sobre la foto del hotel y arriba del nombre del tour */
  .cs-pill{display:inline-flex;align-items:center;padding:4px 10px;border-radius:99px;background:rgba(11,22,40,.82);color:#fff;font-size:11px;font-weight:800;line-height:1.2;white-space:nowrap;box-shadow:0 1px 4px rgba(0,0,0,.25)}
  .ho__img .cs-pill{position:absolute;top:6px;left:6px;max-width:calc(100% - 12px);overflow:hidden;text-overflow:ellipsis}
  .ho__ins{bottom:6px;background:rgba(10,16,26,.72);color:#fff}
  .ho__b{min-width:0;padding-right:26px}
  .ho__n{font-weight:800;font-size:14.5px;line-height:1.25;color:var(--ink);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
  .ho__c{margin:5px 0 3px;font-size:12px;font-weight:600;color:var(--ink2)}
  .ho__r{display:inline-block;padding:1px 7px;border-radius:7px;background:var(--good-soft);color:var(--good);font-weight:800}
  .ho__u{display:flex;align-items:flex-start;gap:4px;font-size:12px;font-weight:600;color:var(--ink2);line-height:1.3}
  .ho__u svg{flex:0 0 14px;margin-top:1px;color:var(--azul)}
  .ho__f{list-style:none;margin:5px 0 0;padding:0;font-size:11.5px;font-weight:600;color:var(--ink);line-height:1.4}
  .ho__f li{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ho__p{grid-column:1/-1;display:flex;align-items:flex-end;justify-content:space-between;gap:10px;padding-top:8px;border-top:1px solid var(--line)}
  .ho__p b{display:block;font-family:var(--fh);font-size:24px;line-height:1;color:var(--ink)}
  .ho__p small{display:block;margin-top:3px;font-size:11px;font-weight:600;color:var(--ink2)}
  .ho__por{display:inline-block;align-self:flex-start;margin-bottom:4px;padding:2px 9px;border-radius:99px;background:rgba(245,197,24,.16);color:#B8860B;font-size:11.5px;font-weight:800}
  [data-theme="night"] .ho__por{color:#F5C518}
  .ho__ver{flex:0 0 auto;padding:9px 14px;border:0;border-radius:99px;background:#F5C518;color:#0B1F3A;font-size:12.5px;font-weight:800;text-decoration:none;white-space:nowrap}
  .ho__ver:focus-visible,.ho__masbtn:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
  .ho__mas{display:flex;align-items:center;gap:10px;margin-top:4px;padding:12px;border-radius:14px;background:var(--good-soft);font-size:12px;line-height:1.35;color:var(--ink)}
  .ho__mas>svg{flex:0 0 26px;color:var(--good)}
  .ho__mas span{flex:1;font-weight:600}
  .ho__mas b{display:block;font-size:13px;color:var(--ink)}
  .ho__masbtn{flex:0 0 auto;padding:9px 11px;border:1.5px solid var(--ink);border-radius:99px;background:transparent;color:var(--ink);font-size:12px;font-weight:800;cursor:pointer;max-width:92px;line-height:1.15}
  .x-h3{align-items:center;gap:10px;margin:18px 0 8px}
  .x-h3 span:last-child{display:block;line-height:1.2}
  .x-h3 small,.x-otros__h small{display:block;font-family:var(--fb);font-size:12px;font-weight:600;color:var(--ink2)}
  .x-ico{flex:0 0 38px;height:38px;border-radius:50%;background:var(--cel-soft);display:grid;place-items:center;color:var(--azul)}
  .x-car{display:flex;gap:10px;overflow-x:auto;margin:0 -16px;padding:2px 16px 8px;scroll-snap-type:x proximity;scrollbar-width:none}
  .x-car::-webkit-scrollbar{display:none}
  .x-car>div{flex:0 0 172px;scroll-snap-align:start}
  .xt{display:flex;flex-direction:column;height:100%;margin:0;padding:8px;cursor:default}
  .xt.is-sel{padding:7.5px}
  .xt__img{height:98px;border-radius:12px;background:var(--cel-soft) center/cover;display:grid;place-items:center;color:var(--ink2)}
  .xt__n{margin:8px 2px 4px;font-weight:800;font-size:13.5px;line-height:1.25;color:var(--ink);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
  .xt__f{list-style:none;margin:0 2px 8px;padding:0;font-size:11.5px;font-weight:600;color:var(--ink2);line-height:1.35}
  .xt__f li{display:flex;align-items:flex-start;gap:5px;padding:1px 0}
  .xt__f svg{flex:0 0 14px;margin-top:1px;color:var(--azul)}
  .xt__b{margin-top:auto;display:flex;align-items:flex-end;justify-content:space-between;gap:4px;padding:0 2px 2px}
  .x-p{display:flex;align-items:baseline;gap:4px;white-space:nowrap}
  .x-p b{display:block;font-family:var(--fh);font-size:19px;line-height:1;color:var(--ink)}
  .x-p small{display:block;font-size:10.5px;font-weight:600;color:var(--ink2)}
  .x-add{flex:0 0 auto;padding:8px 10px;border:1.5px solid var(--control-border);border-radius:99px;background:var(--surface);color:var(--ink);font-size:12px;font-weight:800;cursor:pointer;white-space:nowrap}
  .x-add.is-on{background:var(--action-bg);border-color:var(--action-bg);color:var(--action-ink)}
  .x-add:focus-visible,.x-otros__h:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
  .x-note{margin:0 0 4px;font-size:11px;font-weight:600;color:var(--ink2)}
  .x-ej{display:inline-block;margin-top:4px;padding:1px 8px;border-radius:99px;background:var(--cel-soft);color:var(--ink2);font-size:10.5px;font-weight:700}
  .xf{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px}
  .xf.is-sel{padding:11.5px}
  .xf__b{min-width:0;padding-right:20px}
  .xf__b b{display:block;font-size:14px;line-height:1.25;color:var(--ink)}
  .xf__b small{display:block;margin-top:2px;font-size:12px;font-weight:600;color:var(--ink2)}
  .xf__r{flex:0 0 auto;text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:6px}
  .x-otros{margin-top:18px;border:1px solid var(--line);border-radius:16px;background:var(--surface);padding:4px 10px 6px}
  .x-otros__h{display:flex;align-items:center;gap:10px;width:100%;padding:8px 0;border:0;background:transparent;color:var(--ink);text-align:left;font-family:var(--fh);font-size:16px;font-weight:800;cursor:pointer}
  .x-otros__h>span:nth-child(2){flex:1}
  .x-otros .opt{margin-top:6px}
  .ho__hab{margin-top:4px;font-size:11.5px;font-weight:700;color:var(--good);line-height:1.3}
  button.ho__ver{font-family:var(--fb);cursor:pointer}
  .f-modal{position:absolute;inset:0;z-index:20;display:flex;flex-direction:column;justify-content:flex-end}
  .f-modal[hidden]{display:none}
  .f-modal__bg{position:absolute;inset:0;background:rgba(10,16,26,.5)}
  .f-modal__sheet{position:relative;max-height:88%;overflow-y:auto;padding:16px 16px 22px;border-radius:22px 22px 0 0;background:var(--bg);box-shadow:0 -10px 30px rgba(0,0,0,.25)}
  .f-modal__top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
  .f-modal__top small{display:block;font-size:10.5px;font-weight:800;letter-spacing:.08em;color:var(--ink2)}
  .f-modal__top h2{margin:2px 0 0;font-family:var(--fh);font-size:21px;font-weight:800;line-height:1.15;color:var(--ink)}
  .f-modal__x{flex:0 0 36px;height:36px;border:1px solid var(--line);border-radius:50%;background:var(--surface);color:var(--ink);font-size:15px;cursor:pointer}
  .f-modal__x:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
  .f-modal__note{margin:12px 0;padding:10px 12px;border:1.5px dashed var(--line);border-radius:12px;color:var(--ink2);font-size:12.5px;font-weight:600;line-height:1.4;text-align:center}
  .hb{display:grid;grid-template-columns:76px minmax(0,1fr) auto;gap:10px;align-items:start;padding:10px;margin-bottom:8px;cursor:pointer}
  .hb.is-sel{padding:9.5px}
  .hb__img{width:76px;height:64px;border-radius:10px;background:var(--selected-bg) center/cover}
  .hb__b{min-width:0;padding-right:4px}
  .hb__b b{display:block;font-size:13px;line-height:1.25;color:var(--ink)}
  .hb__b small{display:block;margin:2px 0;font-size:11px;font-weight:600;color:var(--ink2)}
  .hb__ok,.hb__no{display:block;font-size:11px;font-weight:700;line-height:1.3}
  .hb__ok{color:var(--good)}
  .hb__no{color:var(--ink2)}
  .hb__p{text-align:right;padding-right:22px}
  .hb__p b{display:block;font-family:var(--fh);font-size:17px;line-height:1.1;color:var(--ink)}
  .hb__p small{display:block;font-size:10.5px;font-weight:600;color:var(--ink2)}

  /* Paso 5 "Tu viaje quedo guardado". Siempre en azul noche, con la paleta de la marca (no depende del tema):
     fondo #0F1B2D, tarjetas #1A2B4A, acento amarillo #F5C518 y verde #4CAF50 solo para "operacion completada".
     Jerarquia: confirmacion -> resumen del viaje -> accion principal -> accesos -> codigo. */
  .ls{--ls-card:#1A2B4A;--ls-card2:#22375C;--ls-y:#F5C518;--ls-ok:#4CAF50;--ls-t:#fff;--ls-t2:#C5CDD8;--ls-t3:#9FADBF;--ls-line:rgba(255,255,255,.12);color:var(--ls-t);display:grid;gap:16px;padding-top:6px}
  .ls-ok{display:flex;align-items:center;gap:14px}
  .ls-ok__i{flex:0 0 auto;display:grid;place-items:center;width:44px;height:44px;border-radius:50%;background:var(--ls-ok);color:#fff;box-shadow:0 0 0 6px rgba(76,175,80,.16)}
  .ls-h{margin:0;font-family:var(--fh);font-size:26px;line-height:1.15;font-weight:800;letter-spacing:-.01em;color:var(--ls-t)}
  .ls-p{margin:3px 0 0;font-size:15px;font-weight:500;color:var(--ls-t2);line-height:1.45}
  .ls-card{display:grid;grid-template-columns:116px minmax(0,1fr) auto;align-items:stretch;gap:16px;width:100%;box-sizing:border-box;margin:0;padding:12px;border:1px solid var(--ls-line);border-radius:18px;background:var(--ls-card);box-shadow:0 8px 24px rgba(0,0,0,.22);color:var(--ls-t);text-align:left;font-family:var(--fb);cursor:pointer;transition:background .15s,border-color .15s}
  .ls-card:hover{background:var(--ls-card2);border-color:rgba(255,255,255,.22)}
  .ls-card--fija{grid-template-columns:116px minmax(0,1fr);cursor:default}
  .ls-card--fija:hover{background:var(--ls-card);border-color:var(--ls-line)}
  .ls-act>:only-child{grid-column:1/-1}
  .ls-card__img{align-self:stretch;min-height:116px;border-radius:12px;background:#0F1B2D center/cover}
  .ls-card__t{display:flex;flex-direction:column;justify-content:center;gap:8px;min-width:0;padding:2px 0}
  .ls-card__d{margin:0;font-family:var(--fh);font-size:21px;line-height:1.15;font-weight:800;color:var(--ls-t)}
  .ls-card__m{display:flex;flex-wrap:wrap;gap:6px 8px}
  .ls-card__m span{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:99px;background:rgba(255,255,255,.08);font-size:13px;font-weight:600;color:var(--ls-t2)}

  .ls-card__p{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 12px}
  .ls-card__p small{display:block;width:100%;font-size:12px;font-weight:600;color:var(--ls-t3);letter-spacing:.02em}
  .ls-card__p strong{font-family:var(--fh);font-size:28px;line-height:1.05;font-weight:800;color:var(--ls-t)}
  .ls-card__n{display:block;margin:0;font-size:12px;line-height:1.4;color:var(--ls-t3)}

  .ls-act{display:grid;grid-template-columns:minmax(0,1fr);gap:10px}
  .ls-cta{display:flex;align-items:center;justify-content:center;gap:12px;width:100%;box-sizing:border-box;min-height:60px;padding:10px 20px;border:0;border-radius:14px;background:var(--ls-y);color:#0F1B2D;font-family:var(--fb);text-align:left;cursor:pointer;box-shadow:0 8px 20px rgba(245,197,24,.22);transition:filter .15s,transform .15s}
  .ls-cta:hover{filter:brightness(1.05);transform:translateY(-1px)}
  /* el color de los iconos lo define --ico (regla global de /test): se fija por componente */
  .ls-ok__i{--ico:#fff}
  .ls-cta{--ico:#0F1B2D}
  .ls-cta svg{flex:0 0 auto}
  .ls-acc__i,.ls-card__m,.ls-sec,.ls-foot,.ls-ilu{--ico:#F5C518}

  .ls-sec{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;box-sizing:border-box;min-height:60px;margin:0;padding:0 16px;border:1.5px solid rgba(255,255,255,.32);border-radius:14px;background:transparent;color:var(--ls-t);font-family:var(--fb);font-size:15px;font-weight:700;cursor:pointer;transition:background .15s,border-color .15s}

  .ls-accs{display:grid;grid-template-columns:minmax(0,1fr);gap:10px}
  /* Con el viaje guardado queda solo "Guias de viaje": ocupa todo el ancho, alineada con los dos botones de arriba */
  .ls-accs>.ls-acc:only-child{grid-column:1/-1}
  /* Aire abajo para que el cierre ("¡El mundo te espera!") no quede cortado ni debajo del borde */
  .ls{padding-bottom:32px}

  .ls-ilu{flex:0 0 auto;width:150px;height:48px;color:var(--ls-y)}
  .ls-foot{display:flex;align-items:center;gap:10px;margin:0;font-family:'Segoe Script','Brush Script MT','Lucida Handwriting',cursive;font-size:18px;line-height:1.3;color:var(--ls-t);transform:rotate(-3deg)}

  .ls-foot svg{flex:0 0 auto;color:var(--ls-y)}
  /* Cierre animado: la ruta punteada avanza, el avion entra volando y queda flotando, el subrayado se dibuja y el pin salta */
  .ls-foot span::after{content:"";position:absolute;left:0;right:0;bottom:0;height:2px;border-radius:2px;background:var(--ls-y);transform-origin:left;animation:ls-raya .9s .5s cubic-bezier(.3,.7,.3,1) both}
  .ls-ruta{animation:ls-hormiga 1.1s linear infinite}
  .ls-avion{transform-box:fill-box;transform-origin:center;animation:ls-entra 1.1s cubic-bezier(.2,.8,.3,1) both,ls-flota 2.6s 1.1s ease-in-out infinite}
  .ls-foot svg{animation:ls-pin 1.8s 1.2s ease-in-out infinite}
  @keyframes ls-raya{from{transform:scaleX(0)}to{transform:scaleX(1)}}
  @keyframes ls-hormiga{to{stroke-dashoffset:-9}}
  @keyframes ls-entra{from{opacity:0;transform:translate(-70px,26px) rotate(-14deg)}to{opacity:1;transform:none}}
  @keyframes ls-flota{0%,100%{transform:translate(0,0) rotate(0)}50%{transform:translate(4px,-4px) rotate(-5deg)}}
  @keyframes ls-pin{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-6px)}45%{transform:translateY(0)}52%{transform:translateY(-2px)}}
  @media (prefers-reduced-motion:reduce){.ls-ruta,.ls-avion,.ls-foot svg,.ls-foot span::after{animation:none}}
