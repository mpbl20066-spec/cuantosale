<!doctype html>
<html lang="es" data-theme="light" data-pagina="destino">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Elegí tu destino · CuántoSale</title>
<script src="tema.js"></script>
<link rel="stylesheet" href="../style.css">
<link rel="stylesheet" href="cuenta.css">
<style>
  /* Camino "buscar por destino", dos pantallas:
     1 ¿A dónde querés ir?  (buscador + destinos populares)
     2 ¿Cuándo querés viajar? (desde, hasta y cuántas personas)
     Los destinos son los mismos 13 que ofrece el resto de /test, con las mismas
     fotos de ../fotos, para que no haya dos listas distintas de lugares. */
  body{background:#E9EDF3;margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 12px;font-family:var(--fb)}
  [data-theme="night"] body{background:#05080D}
  .phone{position:relative;width:390px;max-width:100%;height:800px;max-height:calc(100vh - 32px);background:var(--bg);border:10px solid #0A101A;border-radius:48px;box-shadow:0 24px 60px rgba(10,16,26,.28);overflow:hidden;display:flex;flex-direction:column}
  .status{flex:0 0 auto;display:flex;justify-content:space-between;padding:14px 26px 4px;font-size:14px;font-weight:700;color:var(--ink)}
  button,input{font-family:var(--fb)}
  .d-bar{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;padding:0 16px}
  .d-back{width:40px;height:40px;margin-left:-8px;border:0;background:transparent;color:var(--ink);display:grid;place-items:center;cursor:pointer}
  .d-back:focus-visible,.d-bus:focus-visible,.d-card:focus-visible,.d-mas:focus-visible,.d-opt:focus-visible,.d-pers button:focus-visible,.d-btn:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
  .d-logo{text-align:center;font-family:var(--fh);font-weight:800;font-size:21px;line-height:1.05;color:var(--ink)}
  .d-logo small{display:block;font-family:var(--fb);font-weight:500;font-size:10.5px;color:var(--ink2)}
  .d-main{flex:1;overflow-y:auto;padding:10px 18px 14px;scrollbar-width:none}
  .d-main::-webkit-scrollbar{display:none}
  h1{margin:6px 0 4px;font-family:var(--fh);font-size:27px;font-weight:800;line-height:1.15;color:var(--ink)}
  .d-sub{margin:0 0 14px;font-size:14.5px;font-weight:600;color:var(--ink2);line-height:1.45}
  .d-bus{display:flex;align-items:center;gap:10px;padding:13px 14px;border:1.5px solid var(--control-border);border-radius:14px;background:var(--surface);color:var(--ink)}
  .d-bus svg{flex:0 0 22px;color:#1F6FB5}
  .d-bus input{flex:1;min-width:0;border:0;background:transparent;color:var(--ink);font-size:16px;font-weight:600}
  .d-bus input::placeholder{color:var(--ink2)}
  .d-bus input,.d-bus input:focus,.d-bus input:focus-visible{outline:0;box-shadow:none;-webkit-appearance:none;appearance:none;border-radius:0}
  .d-bus input::-webkit-search-cancel-button,.d-bus input::-webkit-search-decoration{-webkit-appearance:none;display:none}
  .d-bus:focus-within{border-color:#1F6FB5;box-shadow:0 0 0 3px rgba(31,111,181,.28)}
  .d-h2{display:flex;align-items:baseline;justify-content:space-between;margin:22px 0 10px}
  .d-h2 h2{margin:0;font-family:var(--fh);font-size:18px;font-weight:800;color:var(--ink)}
  .d-mas{border:0;background:transparent;color:#1F6FB5;font:800 13px var(--fb);text-decoration:underline;text-underline-offset:3px;cursor:pointer;padding:4px}
  /* Grilla de destinos: dos columnas en celular, con la foto de arriba y el nombre
     debajo, igual que en la maqueta. */
  .d-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .d-card{display:block;padding:0;border:1px solid var(--line);border-radius:16px;background:var(--surface);color:var(--ink);text-align:left;overflow:hidden;cursor:pointer}
  .d-card:hover{border-color:var(--ink2)}
  .d-card.is-on{border-color:#1F6FB5;box-shadow:0 0 0 2px rgba(31,111,181,.35)}
  .d-card__f{position:relative;height:96px;background:var(--cel-soft) center/cover}
  .d-card__f::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 55%,rgba(10,16,26,.5))}
  .d-card__t{padding:9px 11px 11px}
  .d-card__t b{display:block;font-family:var(--fh);font-size:15px;font-weight:700;line-height:1.2}
  .d-card__t small{display:block;margin-top:2px;font-size:11.5px;font-weight:600;color:var(--ink2)}
  .d-vacio{padding:22px 4px;text-align:center;font-size:14px;font-weight:600;color:var(--ink2)}
  /* Pantalla 2: fechas y personas */

  .d-lbl{display:block;margin:14px 0 6px;font-size:13px;font-weight:700;color:var(--ink)}
  .d-fecha{display:flex;align-items:center;gap:10px;padding:13px 14px;border:1px solid var(--line);border-radius:14px;background:var(--surface);color:#1F6FB5}
  .d-fecha input{flex:1;min-width:0;border:0;background:transparent;color:var(--ink);font-size:16px;font-weight:700}
  .d-pers{display:flex;align-items:center;gap:12px;padding:13px 14px;border:1px solid var(--line);border-radius:14px;background:var(--surface);color:#1F6FB5}
  .d-pers b{flex:1;color:var(--ink);font-size:16px}
  .d-pers button{width:36px;height:36px;border:1.5px solid var(--line);border-radius:50%;background:var(--bg);color:var(--ink);font-size:19px;font-weight:700;cursor:pointer}
  .d-pers button:disabled{opacity:.35;cursor:default}
  .d-elegido{display:flex;align-items:center;gap:10px;margin:0 0 6px;padding:11px 13px;border:1.5px solid #1F6FB5;border-radius:14px;background:var(--cel-soft);color:var(--ink)}
  .d-elegido b{font-family:var(--fh);font-size:16px;font-weight:700}
  .d-elegido span{margin-left:auto;font-size:12.5px;font-weight:700;color:#1F6FB5}
  /* la tarjeta del destino es un boton: toda ella lleva a elegir otro destino */
  button.d-elegido{width:100%;box-sizing:border-box;text-align:left;font-family:var(--fb);cursor:pointer}
  button.d-elegido:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
  .d-elegido__f{display:block;flex:0 0 clamp(90px,26vw,120px);height:72px;border-radius:10px;background:var(--cel-soft) center/cover}
  .d-elegido__t{flex:1;min-width:0}
  .d-elegido__t small{display:block;margin-top:2px;font-size:12.5px;font-weight:600;color:var(--ink2)}
  .d-elegido .d-elegido__c{margin-left:auto;display:inline-flex;align-items:center;gap:4px;font-size:13.5px;font-weight:800;color:#1F6FB5;white-space:nowrap}
  .d-noches{margin:12px 0 0;padding:10px 14px;border-radius:12px;background:var(--good-soft);color:var(--ink);font-size:14.5px;font-weight:700}
  .d-noches.is-err{background:var(--coral-soft);color:var(--coral)}
  h2.d-h2{font-family:var(--fh);font-size:18px;font-weight:800;color:var(--ink)}   /* el titulo "cuantas personas" salia con el tamano por defecto del navegador */
  .d-pers + .d-pers{margin-top:8px}
  .d-pers__s{display:block;font-size:12px;font-weight:600;color:var(--ink2)}
  .d-pers output{min-width:22px;text-align:center;font-weight:800;font-size:16px;color:var(--ink)}
  .d-limite{margin:8px 2px 0;font-size:12.5px;font-weight:600;color:var(--ink2)}
  .d-foot{flex:0 0 auto;padding:10px 18px 22px;background:var(--bg)}
  .d-btn{display:flex;align-items:center;justify-content:center;width:100%;box-sizing:border-box;padding:15px 16px;border:0;border-radius:14px;background:var(--action-bg);color:var(--action-ink);font-size:15px;font-weight:800;cursor:pointer}
  .lg-pin{vertical-align:-3px;margin:0 5px 0 0}

  /* Desktop (>= 1024px): misma estructura que el celular, repartida en dos columnas.
     En celular y tablet estos bloques no existen (display:none) y la pantalla queda igual. */
  .d-crumb,.d-prev,.d-sug,.d-cont,.d-x,.d-foto{display:none}
  .d-split{display:block}
  .d-left{display:block}
  .d-bus{position:relative}
  @media (min-width:1024px){
    html[data-pagina="destino"] .phone{justify-content:flex-start;padding-top:0}
    html[data-pagina="destino"] .d-bar{position:static;padding:6px 24px 0;max-width:1200px;width:100%;margin:0 auto;box-sizing:border-box}
    html[data-pagina="destino"] .d-logo{display:none}
    html[data-pagina="destino"] .d-main{flex:0 0 auto;max-width:1200px;padding:0 24px 40px;overflow:visible}
    .d-crumb{display:block;margin:4px 0 0}
    .d-crumb ol{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;margin:0;padding:0;list-style:none}
    .d-crumb li{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600;color:var(--ink2)}
    .d-crumb li+li::before{content:"›";margin-right:4px;color:var(--ink2);font-size:18px}
    .d-crumb li span{display:grid;place-items:center;width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line);font-size:13px;font-weight:800;color:var(--ink2)}
    .d-crumb li.is-on{color:var(--ink);font-weight:800}
    .d-crumb li.is-on span{border-color:var(--ink);background:var(--ink);color:#fff}
    .d-split{display:grid;grid-template-columns:1.5fr 1fr;gap:40px;align-items:stretch;margin-top:32px}
    .d-left{display:flex;flex-direction:column;min-width:0}
    html[data-pagina="destino"] h1{margin:0 0 6px}
    .d-x{display:grid;place-items:center;width:30px;height:30px;border:0;border-radius:50%;background:var(--cel-soft);color:var(--ink2);cursor:pointer}
    .d-x:hover{background:var(--line)}
    .d-sug{display:block;margin-top:22px}
    .d-sug h2{margin:0 0 10px;font-family:var(--fh);font-size:16px;font-weight:800;color:var(--ink)}
    .d-chips{display:flex;flex-wrap:wrap;gap:10px}
    .d-chip{padding:9px 16px;border:1.5px solid var(--line);border-radius:99px;background:#fff;color:var(--ink);font-size:14.5px;font-weight:700;cursor:pointer;transition:background-color .15s,border-color .15s}
    .d-chip:hover{background:#EAF2FB;border-color:#B9D3F0}
    .d-chip.is-on{background:#EAF2FB;border-color:#1F6FB5}
    .d-chip:focus-visible,.d-x:focus-visible,.d-cont:focus-visible,.d-prev:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
    .d-cont{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;box-sizing:border-box;margin-top:auto;padding:18px 20px;border:0;border-radius:14px;background:var(--action-bg);color:var(--action-ink);font-family:var(--fb);font-size:17px;font-weight:800;cursor:pointer}
    .d-cont:disabled{opacity:.5;cursor:default}
    .d-sug+.d-cont{margin-top:26px}
    .d-prev{display:block;position:relative;min-height:340px;padding:0;border:0;border-radius:20px;overflow:hidden;background:var(--cel-soft) center/cover;text-align:left;cursor:pointer;box-shadow:0 8px 28px rgba(10,30,70,.12)}
    .d-prev::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 45%,rgba(10,16,26,.78))}
    .d-prev span{position:absolute;left:22px;right:22px;bottom:20px;z-index:1;color:#fff}
    .d-prev b{display:block;font-family:var(--fh);font-size:26px;font-weight:800;line-height:1.15;text-shadow:0 1px 6px rgba(0,0,0,.4)}
    .d-prev small{display:block;margin-top:2px;font-size:14px;font-weight:600;color:rgba(255,255,255,.85)}

    /* ---- Pantalla 2 (fechas y personas) en dos columnas: formulario 60 % / foto vertical 40 % ---- */
    .d-split--f{margin-top:24px}
    .d-split--f .d-sub{margin-bottom:16px}
    html.cs-hdr[data-pagina="destino"] .d-back{transform:none;margin-left:0}   /* el contenedor ya esta centrado: la flecha queda alineada con el contenido */
    html[data-pagina="destino"] .d-foot{display:none}                 /* el boton Continuar va dentro de la columna */
    .d-split--f button.d-elegido{width:fit-content;max-width:100%;margin:0;padding:8px 12px}
    .d-split--f .d-elegido__f{flex:0 0 64px;height:48px}
    .d-split--f .d-elegido .d-elegido__c{margin-left:18px}
    .d-fechas{display:grid;grid-template-columns:1fr 1fr;gap:16px}
    .d-split--f .d-lbl{margin:16px 0 6px}
    .d-split--f .d-fecha{padding:12px 14px}
    .d-split--f .d-noches{width:fit-content;margin:12px 0 0;padding:8px 14px}
    .d-split--f h2.d-h2{margin:20px 0 10px}
    .d-quien{display:grid;grid-template-columns:1fr 1fr;gap:16px}
    .d-quien .d-pers{padding:10px 14px}
    .d-quien .d-pers+.d-pers{margin-top:0}
    .d-split--f .d-limite{margin:10px 2px 0}
    .d-split--f .d-cont{margin-top:20px;background:#F5C518;color:#1A2B4A}
    .d-foto{display:block;position:relative;min-height:440px;border-radius:20px;overflow:hidden;background:var(--cel-soft);box-shadow:0 8px 28px rgba(10,30,70,.12)}
    .d-foto img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center}
    .d-foto::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 55%,rgba(10,16,26,.8))}
    .d-foto span{position:absolute;left:24px;right:24px;bottom:22px;z-index:1;color:#fff}
    .d-foto b{display:block;font-family:var(--fh);font-size:28px;font-weight:800;line-height:1.15;text-shadow:0 1px 6px rgba(0,0,0,.4)}
    .d-foto small{display:block;margin-top:2px;font-size:15px;font-weight:600;color:rgba(255,255,255,.88)}
    /* destinos populares: 4 tarjetas 4:3, nombre y pais encima de un degradado */
    html[data-pagina="destino"] .d-h2{margin:36px 0 14px}
    html[data-pagina="destino"] .d-grid{grid-template-columns:repeat(4,minmax(0,1fr));gap:20px}
    html[data-pagina="destino"] .d-card{position:relative;border:0;border-radius:16px;background:var(--cel-soft)}
    html[data-pagina="destino"] .d-card__f{height:auto;aspect-ratio:4/3;background-size:cover;background-position:center}
    html[data-pagina="destino"] .d-card__f::after{background:linear-gradient(180deg,transparent 40%,rgba(10,16,26,.82))}
    html[data-pagina="destino"] .d-card__t{position:absolute;left:0;right:0;bottom:0;padding:14px 16px;color:#fff}
    html[data-pagina="destino"] .d-card__t b{color:#fff;font-size:18px;text-shadow:0 1px 5px rgba(0,0,0,.45)}
    html[data-pagina="destino"] .d-card__t small{color:rgba(255,255,255,.85);font-size:13px}
  }
  @media (max-width:520px){
    body{display:block;padding:0;background:var(--bg)}
    .phone{width:100%;height:100vh;height:100dvh;max-height:none;border:0;border-radius:0;box-shadow:none}
    .status{display:none}
  }
</style>

<script>
(function () {
  var qs = new URLSearchParams(location.search), fuente = qs.get('fuente') || 'directo', debug = /[?&]debug=1/.test(location.search);
  var $ = function (id) { return document.getElementById(id); };
  var esc = function (s) { return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };
  var ic = function (p, s) { return '<svg width="' + (s || 22) + '" height="' + (s || 22) + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + p + '</svg>'; };
  var I = {
    lupa: '<circle cx="11" cy="11" r="7"/><path d="m20 20-3.6-3.6"/>',
    pin: '<path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.4"/>',
    cal: '<rect x="3.5" y="5" width="17" height="15" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/>',
    ppl: '<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/>',
    chev: '<path d="m9 5 7 7-7 7"/>',
    avion: '<path d="M17.8 19.2 16 11l3.5-3.5C21 6 21.5 4 21 3c-1-.5-3 0-4.5 1.5L13 8 4.8 6.2c-.5-.1-.9.1-1.1.5l-.3.5c-.2.5-.1 1 .3 1.3L9 12l-2 3H4l-1 1 3 2 2 3 1-1v-3l3-2 3.5 5.3c.3.4.8.5 1.3.3l.5-.2c.4-.3.6-.7.5-1.2z"/>',
    auto: '<path d="M5 16l1.5-6h11L19 16M3 16h18v3H3zM7 19v2M17 19v2"/>',
    bus: '<rect x="4" y="3" width="16" height="14" rx="3"/><path d="M4 11h16M7 21v-4M17 21v-4"/>',
    cmp: '<rect x="3" y="4" width="8" height="8" rx="1.5"/><rect x="13" y="12" width="8" height="8" rx="1.5"/><path d="M11 8h2a2 2 0 0 1 2 2v2"/>'
  };
  /* Los 40 destinos de la app (destinos-datos.js, copia de lib/model.js). La distancia por tierra sale de
     ruta-datos.js, el mismo snapshot del roadtrip que usa el calculador: si un destino no esta ahi, no
     tiene ruta por carretera y no se muestra km. `medios` es lo que el sistema puede cotizar de verdad
     para ese destino (lo genera scripts/build-destinos-datos.js desde DEST.modes).
     d = [clave, nombre, pais, km, region, medios] */
  var DESTS = (window.CS_DESTS || []).map(function (d) {
    var rt = (window.RT_DATA || {})[d.k];
    return [d.k, d.name, 'Brasil', rt ? rt.distanceKm : 0, d.region, d.medios || []];
  });
  var POPULARES = ['rio', 'fln', 'buz', 'bcm'];
  var HOY = new Date();
  var iso = function (d) { return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2); };
  var sumarDias = function (s, n) { var d = new Date(s + 'T12:00:00'); d.setDate(d.getDate() + n); return iso(d); };
  var MESES = ['ene.', 'feb.', 'mar.', 'abr.', 'may.', 'jun.', 'jul.', 'ago.', 'sep.', 'oct.', 'nov.', 'dic.'];
  var fdc = function (d) { var q = String(d || '').split('-'); return q.length < 3 ? '' : (+q[2] + ' ' + MESES[+q[1] - 1]); };
  /* Fechas por defecto: a partir de la semana que viene, una semana de viaje. */
  var S = { pant: 1, dest: qs.get('destino') || '', sel: '', q: '', todos: false, err: '', medio: qs.get('modo') || 'avion',
    ida: qs.get('ida') || sumarDias(iso(HOY), 10), vuelta: qs.get('vuelta') || sumarDias(iso(HOY), 17), pax: +qs.get('pax') || 2, ninos: Math.max(0, +qs.get('ninos') || 0) };
  if (S.ninos >= S.pax) S.ninos = 0;   // siempre viaja al menos un adulto
  var track = function (n, p) { window.mockTrack(n, Object.assign({ pantalla: S.pant, fuente: fuente }, p || {})); };
  var destInfo = function () { return DESTS.filter(function (d) { return d[0] === S.dest; })[0]; };
  var debugQ = debug ? '&debug=1' : '';

  /* Sin tildes ni mayusculas: "bu" tiene que encontrar "Búzios". */
  var norm = function (t) { return String(t).normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase(); };
  var coincide = function (d, q) { return norm(d[1] + ' ' + d[4]).indexOf(norm(q)) >= 0; };
  function grilla() {
    /* Con texto escrito se busca en los 40 destinos; sin texto, solo los populares (o todos si se pidio). */
    var lista = DESTS.filter(function (d) {
      if (S.q) return coincide(d, S.q);
      return S.todos || POPULARES.indexOf(d[0]) >= 0;
    });
    lista.sort(function (a, b) { return S.todos ? a[1].localeCompare(b[1], 'es') : POPULARES.indexOf(a[0]) - POPULARES.indexOf(b[0]); });
    if (!lista.length) return '<p class="d-vacio">No encontramos destinos con ese nombre.<br>Probá con otro.</p>';
    return '<div class="d-grid">' + lista.map(function (d) {
      return '<button type="button" class="d-card" data-dest="' + d[0] + '" data-evento="destino_elegido" data-destino="' + d[0] + '">' +
        '<span class="d-card__f" style="background-image:url(' + fotoDe(d[0]) + ')" aria-hidden="true"></span>' +
        '<span class="d-card__t"><b>' + esc(d[1]) + '</b><small>' + esc(d[2]) + '</small></span></button>';
    }).join('') + '</div>';
  }

  /* Destino que se muestra en la tarjeta grande (solo desktop): el que se toco en las sugerencias, o el primero
     que coincide con lo que se escribe. Por defecto, el primero de los populares. */
  function destPrevia() {
    var hit = S.q ? DESTS.filter(function (d) { return coincide(d, S.q); })[0] : null;
    if (hit) return hit;
    return DESTS.filter(function (d) { return d[0] === S.sel; })[0] || DESTS.filter(function (d) { return d[0] === POPULARES[0]; })[0] || null;
  }
  var PASOS = ['Destino', 'Fechas y personas', 'Resultados', 'Detalle', 'Presupuesto'];
  function migas(activo) {
    return '<nav class="d-crumb" aria-label="Pasos del viaje"><ol>' + PASOS.map(function (n, i) {
      return '<li' + (i === activo ? ' class="is-on" aria-current="step"' : '') + '><span>' + (i + 1) + '</span>' + n + '</li>';
    }).join('') + '</ol></nav>';
  }
  function pant1() {
    $('main').dataset.pant = '1';
    var prev = destPrevia();
    var chips = POPULARES.map(function (k) {
      var d = DESTS.filter(function (x) { return x[0] === k; })[0]; if (!d) return '';
      return '<button type="button" class="d-chip' + (prev && prev[0] === k ? ' is-on' : '') + '" data-sel="' + k + '" aria-pressed="' + !!(prev && prev[0] === k) + '">' + esc(d[1]) + '</button>';
    }).join('');
    $('main').innerHTML = migas(0) +
      '<div class="d-split"><div class="d-left"><h1>¿A dónde querés ir?</h1><p class="d-sub">Buscá tu destino, elegí las fechas y las personas.</p>' +
      '<label class="d-bus" for="bus">' + ic(I.lupa) + '<input id="bus" type="search" placeholder="¿A dónde querés ir?" value="' + esc(S.q) + '" autocomplete="off">' +
      (S.q ? '<button type="button" class="d-x" data-limpiar="1" aria-label="Borrar búsqueda">' + ic('<path d="M6 6l12 12M18 6 6 18"/>', 16) + '</button>' : '') + '</label>' +
      '<div class="d-sug"><h2>Sugerencias populares</h2><div class="d-chips">' + chips + '</div></div>' +
      '<button type="button" class="d-cont" data-continuar="1" data-evento="destino_continuar_desde_busqueda"' + (prev ? '' : ' disabled') + '>Continuar ' + ic('<path d="M5 12h14M13 6l6 6-6 6"/>', 20) + '</button></div>' +
      (prev ? '<button type="button" class="d-prev" data-continuar="1" style="background-image:url(' + fotoDe(prev[0]) + ')" aria-label="Elegir ' + esc(prev[1]) + '"><span><b>' + esc(prev[1]) + '</b><small>' + esc(prev[2]) + '</small></span></button>' : '') +
      '</div>' +
      '<div class="d-h2"><h2>' + (S.q ? 'Resultados' : (S.todos ? 'Todos los destinos' : 'Destinos populares')) + '</h2>' +
      (S.q ? '' : '<button type="button" class="d-mas" data-todos="1" data-evento="destino_ver_todos">' + (S.todos ? 'Ver solo los populares' : 'Ver todos los destinos') + ' ›</button>') + '</div>' +
      grilla();
    $('foot').innerHTML = '';
    $('foot').hidden = true;
    document.title = 'Elegí tu destino · CuántoSale';
    window.mockTrack('page_view', { page_path: '/viaje/destino', page_title: 'Elegí tu destino · CuántoSale', motivo: 'elegir_destino' });
  }

  /* Foto del destino: las de Búzios, Bombinhas y Camboriú son las reducidas de dest/; el resto, las de fotos/. */
  function fotoDe(k) { return (['buz', 'bombinhas', 'bcm'].indexOf(k) >= 0 ? 'dest/' : '../fotos/') + k + '.jpg'; }
  var plural = function (n, a, b) { return n + " " + (n === 1 ? a : b); };
  /* Noches entre ida y vuelta: se recalcula al tocar las fechas, sin volver a pintar (si no, se cerraria el selector). */
  function textoNoches() {
    var n = Math.round((new Date(S.vuelta + "T12:00:00") - new Date(S.ida + "T12:00:00")) / 864e5);
    if (!(n >= 1)) return { ok: false, t: "La vuelta tiene que ser posterior a la ida." };
    return { ok: true, t: plural(n, "noche", "noches") };   /* las personas ya se ven mas abajo: no se repiten aca */
  }
  /* Una fila de personas: nombre, aclaracion de edad y el selector - n +. Los limites los pone el que la llama. */
  function fila(nombre, sub, clave, n, sinMenos, sinMas) {
    return "<div class=\"d-pers\">" + ic(I.ppl, 22) + "<b>" + nombre + "<small class=\"d-pers__s\">" + sub + "</small></b>" +
      "<span style=\"display:flex;align-items:center;gap:8px\"><button type=\"button\" data-" + clave + "=\"-1\" aria-label=\"Menos " + nombre.toLowerCase() + "\"" + (sinMenos ? " disabled" : "") + ">−</button>" +
      "<output aria-label=\"" + nombre + ": " + n + "\">" + n + "</output>" +
      "<button type=\"button\" data-" + clave + "=\"1\" aria-label=\"Más " + nombre.toLowerCase() + "\"" + (sinMas ? " disabled" : "") + ">+</button></span></div>";
  }
  function pant2() {
    var d = destInfo(), nn = textoNoches();
    $("main").dataset.pant = "2";
    var fv = d ? (d[0] === 'rio' ? 'dest/rio-vertical.jpg' : fotoDe(d[0])) : '';   /* foto vertical del destino (solo Rio tiene una propia) */
    $("main").innerHTML = migas(1) + "<div class=\"d-split d-split--f\"><div class=\"d-left\"><h1>¿Cuándo querés viajar?</h1><p class=\"d-sub\">Elegí tus fechas y quiénes viajan.</p>" +
      "<button type=\"button\" class=\"d-elegido\" data-cambiar=\"1\" data-evento=\"destino_cambiar\" aria-label=\"Cambiar destino: " + esc(d ? d[1] : "") + "\">" + (d ? "<span class=\"d-elegido__f\" style=\"background-image:url(" + fotoDe(d[0]) + ")\" aria-hidden=\"true\"></span>" : ic(I.pin, 20)) +
      "<span class=\"d-elegido__t\"><b>" + esc(d ? d[1] + ", " + d[2] : "") + "</b><small>Origen: Montevideo, Uruguay</small></span>" +
      "<span class=\"d-elegido__c\">Cambiar " + ic(I.chev, 14) + "</span></button>" +
      "<div class=\"d-fechas\"><div><label class=\"d-lbl\" for=\"ida\">Ida</label><div class=\"d-fecha\">" + ic(I.cal, 22) + "<input id=\"ida\" type=\"date\" min=\"" + sumarDias(iso(HOY), 1) + "\" value=\"" + S.ida + "\" aria-label=\"Fecha de ida\"></div></div>" +
      "<div><label class=\"d-lbl\" for=\"vuelta\">Vuelta</label><div class=\"d-fecha\">" + ic(I.cal, 22) + "<input id=\"vuelta\" type=\"date\" min=\"" + sumarDias(S.ida, 1) + "\" value=\"" + S.vuelta + "\" aria-label=\"Fecha de vuelta\"></div></div></div>" +
      "<p class=\"d-noches" + (nn.ok ? "" : " is-err") + "\" id=\"noches\" role=\"status\">" + esc(nn.t) + "</p>" +
      "<h2 class=\"d-h2\" style=\"margin-top:22px\">¿Quiénes viajan?</h2>" +
      "<div class=\"d-quien\">" + fila("Adultos", "Desde 12 años", "ad", S.pax - S.ninos, S.pax - S.ninos <= 1, S.pax >= 9) +
      fila("Niños", "De 2 a 11 años", "ni", S.ninos, S.ninos <= 0, S.pax >= 9) + "</div>" +
      "<p class=\"d-limite\">" + (S.pax >= 9 ? "Máximo 9 personas por reserva. Para grupos más grandes, escribinos por WhatsApp. " : "") + "Los bebés menores de 2 años viajan en brazos y no se cuentan. Con niños, el alojamiento se cotiza para habitación familiar; vuelos y actividades se cotizan como pasajero y la tarifa de niño se confirma al reservar.</p>" +
      (S.err ? "<p class=\"d-vacio\" role=\"alert\" style=\"text-align:left;color:var(--coral)\">" + esc(S.err) + "</p>" : "") +
      "<button type=\"button\" class=\"d-cont\" data-seguir=\"1\" data-evento=\"destino_continuar\" data-destino=\"" + S.dest + "\">Continuar " + ic('<path d="M5 12h14M13 6l6 6-6 6"/>', 20) + "</button></div>" +
      (d ? "<div class=\"d-foto\" aria-hidden=\"true\"><img src=\"" + fv + "\" alt=\"\"><span><b>" + esc(d[1]) + "</b><small>" + esc(d[2]) + "</small></span></div>" : "") + "</div>";
    $('foot').hidden = false;
    $('foot').innerHTML = '<button type="button" class="d-btn" data-seguir="1" data-evento="destino_continuar" data-destino="' + S.dest + '">Continuar →</button>';
    document.title = '¿Cuándo querés viajar? · CuántoSale';
  }

  /* Aqui no se pregunta el medio de transporte.
     El destino se elige primero y el medio se decide solo con lo que el sistema
     puede cotizar para ese destino (lo mismo que hace el calculador de ruta). Una
     pantalla de eleccion de medio con un solo avion al lado no era una decision:
     era una pantalla mas entre el destino y el resultado.
     Si el medio llegara pedido (?modo=) se respeta; si no, el sistema elige. */
  function pintar() { if (S.pant === 1) pant1(); else pant2(); }
  function ir(n) { S.pant = n; pintar(); $('main').scrollTop = 0; }
  /* De las fechas se va derecho a resultados. */
  function irA() { aResultados(); }
  /* Ir a los resultados pasando destino, fechas, personas y medio de transporte. */
  function aResultados() {
    var q = new URLSearchParams({ destino: S.dest, pax: S.pax, ninos: S.ninos, ida: S.ida, vuelta: S.vuelta, modo: S.medio, fuente: 'destino_' + S.medio, origen_home: fuente });
    location.href = 'home-resultado.html?' + q.toString() + debugQ;
  }

  document.addEventListener('click', function (e) {
    var t = e.target.closest('button,a'); if (!t) return;
    if (t.id === 'atras') {
      if (S.pant === 1) location.href = 'home-dos-caminos.html' + debugQ;
      else ir(S.pant - 1);
      return;
    }
    if (t.dataset.sel) { S.sel = t.dataset.sel; S.q = ''; track('destino_sugerencia', { destino: S.sel }); pant1(); return; }
    if (t.dataset.limpiar) { S.q = ''; pant1(); var b0 = document.getElementById('bus'); if (b0) b0.focus(); return; }
    if (t.dataset.continuar) { var pv = destPrevia(); if (!pv) return; S.dest = pv[0]; track('destino_pasa_a_fechas', { destino: S.dest, via: 'continuar' }); ir(2); return; }
    if (t.dataset.todos) { S.todos = !S.todos; track('destino_ver_todos_toggle', { todos: S.todos }); pintar(); return; }
    /* El click en la tarjeta ya dispara el evento data-evento="destino_elegido"
       (ver home-track.js); acá solo se registra el paso a la pantalla de fechas. */
    if (t.dataset.dest) { S.dest = t.dataset.dest; track('destino_pasa_a_fechas', { destino: S.dest }); ir(2); return; }
    if (t.dataset.cambiar) { track('destino_cambiar_destino', { destino: S.dest }); ir(1); return; }
    if (t.dataset.ad || t.dataset.ni) {
      var ad = S.pax - S.ninos, ni = S.ninos;
      if (t.dataset.ad) ad = Math.max(1, Math.min(9 - ni, ad + (+t.dataset.ad)));
      else ni = Math.max(0, Math.min(9 - ad, ni + (+t.dataset.ni)));
      S.pax = ad + ni; S.ninos = ni; S.err = '';
      track('destino_personas', { personas: S.pax, adultos: ad, ninos: ni });
      pant2(); return;
    }
    if (t.dataset.seguir) {
      var ida = ($('ida') || {}).value || S.ida, vuelta = ($('vuelta') || {}).value || S.vuelta;
      S.ida = ida; S.vuelta = vuelta; S.err = '';
      if (!(S.ida >= sumarDias(iso(HOY), 1))) { S.err = 'Elegí una fecha a partir de mañana.'; pant2(); return; }
      if (!(S.vuelta > S.ida)) { S.err = 'La fecha de vuelta tiene que ser posterior a la de ida.'; pant2(); return; }
      track('destino_continuar', { destino: S.dest, personas: S.pax });
      irA();
      return;
    }
  });
  /* Fechas: se guardan al cambiar y las noches se actualizan en el momento. */
  function alCambiarFecha(e) {
    if (e.target.id !== 'ida' && e.target.id !== 'vuelta') return;
    if (e.target.id === 'ida') { S.ida = e.target.value; var v = $('vuelta'); if (v) { v.min = sumarDias(S.ida, 1); if (S.vuelta <= S.ida) { S.vuelta = sumarDias(S.ida, 7); v.value = S.vuelta; } } }
    else S.vuelta = e.target.value;
    S.err = '';
    var n = $('noches'), nn = textoNoches();
    if (n) { n.textContent = nn.t; n.classList.toggle('is-err', !nn.ok); }
  }
  $('main').addEventListener('change', alCambiarFecha);
  $('main').addEventListener('input', alCambiarFecha);
  $('main').addEventListener('input', function (e) {
    if (e.target.id === 'bus') { S.q = e.target.value.trim(); var sel = document.getElementById('bus').selectionStart; pintar(); var b = document.getElementById('bus'); if (b) { b.focus(); try { b.setSelectionRange(sel, sel); } catch (x) { /* no todos los navegadores dejan */ } } }
  });
  /* Si entran con ?destino= y ?pax=, son datos que la pantalla anterior ya recogio:
     se va derecho a resultados. Con solo ?destino=, todavia hay que elegir fechas. */
  if (S.dest && destInfo() && qs.get('pax')) { aResultados(); }
  else if (S.dest && destInfo()) { S.pant = 2; }
  pintar();
})();
</script>
<script src="cuenta.js"></script>
<script src="cabecera.js"></script>
</body>
