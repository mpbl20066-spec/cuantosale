<!doctype html>
<html lang="es" data-theme="light" data-pagina="home">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CuántoSale · Tu viaje, sin sorpresas</title>
<script src="tema.js"></script>
<link rel="stylesheet" href="../style.css">
<link rel="stylesheet" href="cuenta.css">
<style>
  /* Maqueta de la home con dos caminos: "ya sé dónde" y "no sé dónde".
     Todo el color sale de los tokens de la app (claro/oscuro), no de un navy
     y teal propios: botones en --action-bg, textos en --ink / --ink2. */
  body{background:#E9EDF3;margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 12px;font-family:var(--fb)}
  [data-theme="night"] body{background:#05080D}

  .phone{width:390px;max-width:100%;height:800px;max-height:calc(100vh - 32px);background:var(--bg);border:10px solid #0A101A;border-radius:48px;box-shadow:0 24px 60px rgba(10,16,26,.28);overflow:hidden;display:flex;flex-direction:column;position:relative}
  .status{flex:0 0 auto;display:flex;justify-content:space-between;align-items:center;padding:14px 26px 4px;font-size:14px;font-weight:700;color:var(--ink)}
  .status__icons{display:flex;gap:6px;align-items:center}
  .scroll{flex:1;overflow-y:auto;padding:0 18px 28px;scrollbar-width:none}
  .scroll::-webkit-scrollbar{display:none}

  /* Portada con la foto de Niteroi (public/test/home-portada.jpg, convertida de
     portada.png). Es 16:9 y muy colorida, asi que el degradado va solo del lado
     izquierdo, donde se apila el texto, y la foto se ve entera del lado derecho.
     El alto sube para que la imagen tenga presencia en vez de quedar de franja. */
  .m-top{position:relative;margin:0 -18px;padding:0 18px 26px;min-height:440px;background:url(home-portada.jpg) 74% 46%/cover}
  /* Velo suave para que el texto blanco se lea: la foto tiene lomas oscuras arriba y
     agua clara abajo, y sin esto el titulo se pierde. No es un degradado de lado:
     ese tapaba la foto entera. */
  .m-top::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,16,26,.55) 0%,rgba(10,16,26,.30) 26%,rgba(10,16,26,.10) 52%,rgba(10,16,26,.34) 100%),linear-gradient(90deg,rgba(10,16,26,.72) 0%,rgba(10,16,26,.52) 28%,rgba(10,16,26,.16) 52%,transparent 72%)}
  /* Sobre la foto el texto va en blanco, no en el color de ink. */
  .m-top .m-logo{color:#fff}
  .m-top .m-tag{color:rgba(255,255,255,.9)}
  .m-top .m-menu{color:#fff}
  .m-top .m-hero h1{color:#fff}
  .m-top .m-hero p{color:rgba(255,255,255,.94)}
  .m-top>*{position:relative}
  .m-head{display:flex;align-items:center;justify-content:space-between;padding:10px 0 4px}
  .m-logo{display:flex;align-items:center;gap:8px;font-family:var(--fh);font-weight:800;font-size:22px;color:var(--ink);letter-spacing:-.01em}
  .m-tag{margin:2px 0 0;color:var(--ink2);font-size:12.5px}
  .m-menu{width:40px;height:40px;border:0;background:transparent;display:grid;place-content:center;gap:5px;cursor:pointer}
  .m-menu span{display:block;width:22px;height:2.5px;border-radius:2px;background:var(--ink)}

  .m-hero{margin:22px 0 0}
  .m-hero h1{font-family:var(--fh);font-size:30px;line-height:1.1;font-weight:800;margin:0 0 8px;color:var(--ink)}
  .m-hero p{margin:0;color:var(--ink2);font-size:14.5px;line-height:1.45}

  /* Las dos tarjetas son links enteros. En celular van una al lado de la otra y
     compactas, que es como las muestra la maqueta: asi el carrusel de destinos
     entra en pantalla sin bajar. */
  /* Distintivo del icono: rectángulo ámbar claro con el ícono oscuro, como en la
     maqueta. El de la tarjeta pintada es un ámbar más fuerte para que se recorte. */
  :root{--m-badge:#FBE7B0;--m-badge-ink:#3A2C05;--m-badge-2:#F0C33C;--m-main:#F7C325;--m-main-ink:#3A2C05;--m-main-ink2:#6B551A}
  /* Las dos tarjetas van ENCIMA de la foto, centradas, como en la maqueta: por eso el
     margen negativo. Sin esto quedaban abajo de la foto y el encuadre se pierde. */
  .m-cards{position:relative;z-index:2;display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:-120px 0 22px}
  /* Icono a la izquierda y texto al lado, como en la maqueta. La tarjeta es angosta
     (van dos por fila), asi que el distintivo y los textos van chicos: con el
     tamaño de escritorio el titulo se parte en tres lineas. */
  .m-card{display:flex;flex-direction:row;align-items:center;gap:9px;box-sizing:border-box;padding:11px 10px;border:1px solid var(--line);border-radius:18px;background:var(--surface);color:var(--ink);text-decoration:none;box-shadow:0 4px 14px rgba(16,24,40,.06)}
  .m-card:hover{border-color:var(--ink2)}
  .m-card:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
  .m-card__icon{flex:none;width:38px;height:38px;border-radius:11px;background:var(--m-badge);color:var(--m-badge-ink);display:grid;place-items:center}
  .m-card__icon svg{width:20px;height:20px}
  .m-card__txt{display:block;flex:1;min-width:0}
  .m-card__txt b{display:block;font-family:var(--fh);font-size:13.5px;font-weight:700;line-height:1.2;color:var(--ink)}
  .m-card__txt small{display:block;margin-top:3px;font-size:11px;font-weight:600;color:var(--ink2);line-height:1.3}
  /* La de presupuesto es la que diferencia a CuantoSale: va pintada de amarillo
     fuerte, sin borde, con el mismo contenido que la otra. */
  .m-card--main{border-color:transparent;background:var(--m-main);box-shadow:0 6px 18px rgba(180,140,20,.28)}
  .m-card--main .m-card__icon{background:var(--m-badge-2);color:var(--m-main-ink)}
  .m-card--main .m-card__txt b{color:var(--m-main-ink)}
  .m-card--main .m-card__txt small{color:var(--m-main-ink2)}

  .m-btn:focus-visible,.m-menu:focus-visible,.m-more:focus-visible,.m-dest:focus-visible{outline:3px solid var(--focus);outline-offset:2px}

  /* Opcion aparte: el camino en auto. Es un link, no un camino de los dos, asi que
     va mas chico y sin el boton enorme de las tarjetas. */
  .m-auto{display:flex;align-items:center;gap:12px;box-sizing:border-box;padding:14px 16px;border:1px solid var(--line);border-radius:18px;background:var(--surface);color:var(--ink);text-decoration:none}
  .m-auto__i{flex:0 0 44px;height:44px;border-radius:50%;background:var(--cel-soft);color:var(--ink);display:grid;place-items:center}
  .m-auto__t{flex:1;min-width:0}
  .m-auto__t b{display:block;font-family:var(--fh);font-size:15.5px;font-weight:700}
  .m-auto__t small{display:block;margin-top:2px;font-size:12.5px;font-weight:600;color:var(--ink2);line-height:1.35}
  .m-auto__c{flex:0 0 18px;color:var(--ink2)}
  .m-auto:hover{border-color:var(--ink2)}
  .m-auto:focus-visible{outline:3px solid var(--focus);outline-offset:2px}

  .m-sec{display:flex;align-items:baseline;justify-content:space-between;margin:24px 0 12px}
  .m-sec h2{font-family:var(--fh);font-size:19px;font-weight:700;margin:0;color:var(--ink)}
  .m-more{border:0;background:transparent;color:var(--ink);font-family:var(--fb);font-size:13px;font-weight:700;text-decoration:underline;text-underline-offset:3px;cursor:pointer;padding:4px}

  /* Carrusel: scroll-snap nativo; el quinto circulo asoma por el borde
     derecho para que se entienda que se desliza. */
  .m-car{display:flex;gap:14px;margin:0 -18px;padding:0 18px 4px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
  .m-car::-webkit-scrollbar{display:none}
  .m-dest{flex:0 0 132px;height:168px;border:0;padding:0;border-radius:16px;position:relative;overflow:hidden;scroll-snap-align:start;cursor:pointer;background:var(--surface)}
  .m-dest img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .m-dest::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,16,26,0) 50%,rgba(10,16,26,.7))}
  .m-dest span{position:absolute;left:10px;right:10px;bottom:10px;z-index:1;color:#fff;font-size:13px;font-weight:700;text-align:left;line-height:1.15;text-shadow:0 1px 3px rgba(0,0,0,.5)}

  .tabs{flex:0 0 auto;position:relative;display:flex;justify-content:space-around;padding:8px 8px 22px;background:var(--surface);border-top:1px solid var(--line)}
  .tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0 7px;border:0;background:transparent;color:var(--ink2);font-family:var(--fb);font-size:11.5px;font-weight:600;cursor:pointer;position:relative}
  .tab svg{width:24px;height:24px}
  .tab.is-on{color:var(--ink)}
  .tab.is-on::after{content:"";position:absolute;bottom:0;width:28px;height:3px;border-radius:2px;background:var(--accent)}
  .tab:focus-visible{outline:3px solid var(--focus);outline-offset:-3px;border-radius:10px}
  .home-bar{position:absolute;bottom:7px;left:50%;width:120px;height:4px;margin-left:-60px;border-radius:2px;background:var(--ink)}

  /* En un celular real no hay marco: la pantalla ocupa todo el alto. */
  @media (max-width:520px){
    body{display:block;padding:0;background:var(--bg)}
    .phone{width:100%;height:100vh;height:100dvh;max-height:none;border:0;border-radius:0;box-shadow:none}
    .status{display:none}
  }
</style>
<link rel="stylesheet" href="web.css">
</head>
<body>
<div class="phone">
  <div class="status"><span>9:41</span>
    <span class="status__icons" aria-hidden="true">
      <svg width="18" height="12" viewBox="0 0 18 12" fill="currentColor"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5" width="3" height="7" rx="1"/><rect x="10" y="2" width="3" height="10" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg>
      <svg width="26" height="12" viewBox="0 0 26 12" fill="none" stroke="currentColor"><rect x=".5" y=".5" width="22" height="11" rx="3.5"/><rect x="2.5" y="2.5" width="18" height="7" rx="2" fill="currentColor" stroke="none"/><path d="M24.5 4v4" stroke-linecap="round"/></svg>
    </span>
  </div>

  <div class="scroll">
    <div class="m-top">
    <header class="m-head">
      <div>
        <div class="m-logo">
          <svg width="22" height="28" viewBox="0 0 24 30" aria-hidden="true"><path d="M12 0C5.4 0 0 5.3 0 11.8 0 20 12 30 12 30s12-10 12-18.2C24 5.3 18.6 0 12 0z" fill="var(--ink)"/><circle cx="12" cy="11.5" r="4.6" fill="#F6B21B"/></svg>
          cuántosale
        </div>
        <p class="m-tag">Tu viaje, sin sorpresas</p>
      </div>
      <button type="button" class="m-menu" aria-label="Menú"><span></span><span></span><span></span></button>
    </header>

    <section class="m-hero">
      <h1>¿Qué querés hacer?</h1>
      <p>Elegí cómo querés empezar y armá tu próximo destino.</p>
    </section>
    </div>

    <!-- Las dos tarjetas son el link entero, no una tarjeta con un boton abajo: asi
         van lado a lado y compactas, como en la maqueta, y el carrusel de destinos
         entra en pantalla sin tener que bajar. El contenedor .m-cards es el que las
         pone en dos columnas, tambien en celular. -->
    <div class="m-cards">
    <a class="m-card" href="home-destino.html?fuente=home_card_destino" data-evento="home_camino" data-camino="ya_se_donde" data-fuente="home_card_destino">
      <span class="m-card__icon" aria-hidden="true">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0 4.993-5.539 10.193-7.399 11.799a1 1 0 0 1-1.202 0C9.539 20.193 4 14.993 4 10a8 8 0 0 1 16 0"/><circle cx="12" cy="10" r="3"/></svg>
      </span>
      <span class="m-card__txt"><b>Ya sé dónde quiero ir</b><small>Decí dónde y compará</small></span>
    </a>

    <a class="m-card m-card--main" href="home-presupuesto.html?fuente=home_card_presupuesto" data-evento="home_camino" data-camino="no_se_donde" data-fuente="home_card_presupuesto">
      <span class="m-card__icon" aria-hidden="true">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M16 8h-6a2 2 0 1 0 0 4h4a2 2 0 1 1 0 4H8"/><path d="M12 18V6"/></svg>
      </span>
      <span class="m-card__txt"><b>No sé dónde ir</b><small>Buscá por presupuesto</small></span>
    </a>
    </div>

    <div class="m-sec">
      <h2>Destinos populares</h2>
      <button type="button" class="m-more" data-evento="home_ver_todos">Ver todos ›</button>
    </div>
    <div class="m-car" role="list" aria-label="Destinos populares">
      <button type="button" class="m-dest" role="listitem" data-destino="rio" data-evento="home_destino_popular"><img src="../fotos/rio.jpg" alt=""><span>Río de Janeiro</span></button>
      <button type="button" class="m-dest" role="listitem" data-destino="fln" data-evento="home_destino_popular"><img src="../fotos/fln.jpg" alt=""><span>Florianópolis</span></button>
      <button type="button" class="m-dest" role="listitem" data-destino="buz" data-evento="home_destino_popular"><img src="../fotos/buz.jpg" alt=""><span>Búzios</span></button>
      <button type="button" class="m-dest" role="listitem" data-destino="bcm" data-evento="home_destino_popular"><img src="../fotos/bcm.jpg" alt=""><span>Camboriú</span></button>
      <button type="button" class="m-dest" role="listitem" data-destino="bombinhas" data-evento="home_destino_popular"><img src="../fotos/bombinhas.jpg" alt=""><span>Bombinhas</span></button>
    </div>
  </div>

  <nav class="tabs" aria-label="Navegación principal">
    <button type="button" class="tab is-on" data-evento="home_tab" data-tab="inicio" aria-current="page"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 3 3 10.5V21h6v-6h6v6h6V10.5z"/></svg>Inicio</button>
    <button type="button" class="tab" data-evento="home_tab" data-tab="destinos"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="m15.5 8.5-2 5-5 2 2-5z"/></svg>Destinos</button>
    <button type="button" class="tab" data-evento="home_tab" data-tab="guardados"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h12v18l-6-4.5L6 21z"/></svg>Guardados</button>
    <button type="button" class="tab" data-evento="home_tab" data-tab="perfil"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/></svg>Perfil</button>
    <span class="home-bar" aria-hidden="true"></span>
  </nav>
</div>
<script src="home-track.js"></script>
<script>
/* Los botones que antes solo mandaban el evento de Analytics y no hacian nada:
   el menu abre el panel de cuenta (lo maneja cuenta.js), las tarjetas del carrusel
   y "Ver todos" llevan a la pantalla de destinos. */
(function () {
  document.addEventListener('click', function (e) {
    var d = e.target.closest('.m-dest'); if (d) { location.href = 'home-destino.html?destino=' + encodeURIComponent(d.dataset.destino) + '&fuente=home_destino_popular'; return; }
    var m = e.target.closest('.m-more'); if (m) { location.href = 'home-destino.html?fuente=home_ver_todos'; return; }
    var u = e.target.closest('.m-menu'); if (u && window.CSCuenta) { window.CSCuenta.abrir('menu'); return; }
    /* Tabs "Inicio" y "Destinos". "Guardados" y "Perfil" los maneja cuenta.js por
       data-tab, asi que acá no se tocan para no abrir dos veces el panel. */
    var t = e.target.closest('.tab'); if (t && (t.dataset.tab === 'inicio' || t.dataset.tab === 'destinos')) {
      /* "Destinos" abre el menu de destinos, que es donde estan las guias; el
         buscador por nombre sigue en "Ver todos los destinos". */
      location.href = t.dataset.tab === 'inicio' ? 'home-dos-caminos.html' : 'home-guias.html?fuente=home_tab_destinos';
      return;
    }
  });
})();
</script>
<script src="cuenta.js"></script>
</body>
</html>
