<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sumate a la waitlist | CuántoSale</title>
<meta name="description" content="El lanzamiento oficial de CuántoSale está cerca. Anotate gratis a la lista de espera y sé el primero en usarla.">
<meta name="theme-color" content="#0B1330">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{--wl-bg:#0B1330;--wl-card:#12193A;--wl-line:#26305C;--wl-amber:#F2A93B;--wl-ink:#F3F6FC;--wl-ink2:#9AA6C7}
  *{box-sizing:border-box}
  body{margin:0;background:var(--wl-bg);color:var(--wl-ink);font-family:'Poppins',system-ui,sans-serif;min-height:100vh}
  .wl-wrap{max-width:460px;margin:0 auto;padding:40px 20px 60px;display:flex;flex-direction:column;justify-content:center;min-height:100vh}
  .wl-logo{display:flex;align-items:center;gap:8px;font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:22px;text-transform:lowercase;margin-bottom:28px}
  .wl-countdown{display:flex;justify-content:center;gap:10px;margin:0 0 22px}
  .wl-countdown__unit{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:54px;padding:10px 6px;border:1px solid var(--wl-line);border-radius:12px;background:#0E1533}
  .wl-countdown__unit b{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:26px;color:var(--wl-amber);line-height:1;font-variant-numeric:tabular-nums}
  .wl-countdown__unit span{font-size:10px;color:var(--wl-ink2);text-transform:uppercase;letter-spacing:.04em}
  .wl-countdown__label{text-align:center;color:var(--wl-ink2);font-size:12px;margin:0 0 20px;letter-spacing:.03em;text-transform:uppercase}
  .wl-reward{background:#0E1533;border:1px solid var(--wl-line);border-radius:14px;padding:16px;margin-top:16px}
  .wl-reward p{margin:0 0 10px;font-size:13px;color:var(--wl-ink2);line-height:1.5}
  .wl-reward p b{color:var(--wl-amber)}
  .wl-reward__track{height:8px;border-radius:99px;background:var(--wl-line);overflow:hidden}
  .wl-reward__fill{height:100%;background:var(--wl-amber);border-radius:99px;transition:width .4s ease}
  .wl-reward__steps{display:flex;justify-content:space-between;margin-top:6px;font-size:10px;color:var(--wl-ink2)}
  .wl-card{background:var(--wl-card);border:2px solid var(--wl-amber);border-radius:22px;padding:30px 26px;margin-bottom:16px;box-shadow:0 0 0 1px rgba(242,169,59,.15),0 24px 60px -20px rgba(242,169,59,.35)}
  h1{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:38px;line-height:1.03;margin:0 0 12px;text-wrap:balance}
  .wl-sub{color:var(--wl-ink2);font-size:16px;line-height:1.5;margin:0 0 24px}
  .wl-field{display:block;margin-bottom:14px}
  .wl-field input{display:block;width:100%;padding:16px;border:1px solid var(--wl-line);border-radius:12px;background:#0E1533;color:var(--wl-ink);font-size:17px}
  .wl-field input::placeholder{color:var(--wl-ink2)}
  .wl-btn{display:block;width:100%;border:0;border-radius:12px;background:var(--wl-amber);color:#1A1200;padding:16px;font-weight:800;font-size:17px;cursor:pointer;box-shadow:0 10px 24px -8px rgba(242,169,59,.55)}
  .wl-btn:disabled{opacity:.6;cursor:default;box-shadow:none}
  .wl-urgency{display:flex;align-items:flex-start;gap:8px;color:var(--wl-ink2);font-size:13px;line-height:1.45;text-align:left;margin-top:16px;padding-top:14px;border-top:1px solid var(--wl-line)}
  .wl-urgency b{color:var(--wl-amber)}
  .wl-count{color:var(--wl-ink2);font-size:13px;text-align:center;margin-top:14px}
  .wl-count b{color:var(--wl-amber)}
  .wl-error{color:#ff8a80;font-size:13px;margin:0 0 12px}
  .wl-confirm-position{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:56px;color:var(--wl-amber);line-height:1;text-align:center;margin:6px 0}
  .wl-confirm-label{text-align:center;color:var(--wl-ink2);font-size:13px;margin-bottom:22px}
  .wl-share{display:flex;gap:8px;align-items:center;background:#0E1533;border:1px solid var(--wl-line);border-radius:12px;padding:10px}
  .wl-share input{flex:1;border:0;background:transparent;color:var(--wl-ink);font-size:13px;min-width:0}
  .wl-share button{flex:none;border:0;border-radius:9px;background:var(--wl-amber);color:#1A1200;padding:9px 12px;font-weight:700;font-size:13px;cursor:pointer}
  .wl-stat{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-top:1px solid var(--wl-line);font-size:14px}
  .wl-stat:first-child{border-top:0}
  .wl-stat b{color:var(--wl-amber);font-size:18px}
  .wl-status{font-size:12px;color:var(--wl-ink2);margin:10px 0 0;text-align:center}
</style>
</head>
<body>
<div class="wl-wrap">
  <div class="wl-logo">
    <svg width="20" height="25" viewBox="0 0 24 30" aria-hidden="true"><path d="M12 0C5.4 0 0 5.3 0 11.8 0 20 12 30 12 30s12-10 12-18.2C24 5.3 18.6 0 12 0z" fill="#FFFFFF"/><circle cx="12" cy="11.5" r="4.6" fill="#F2A93B"/></svg>
    cuántosale
  </div>
  <p class="wl-countdown__label">Lanzamiento oficial en</p>
  <div class="wl-countdown" id="wl-countdown" aria-live="polite">
    <div class="wl-countdown__unit"><b id="wl-cd-d">–</b><span>días</span></div>
    <div class="wl-countdown__unit"><b id="wl-cd-h">–</b><span>hs</span></div>
    <div class="wl-countdown__unit"><b id="wl-cd-m">–</b><span>min</span></div>
    <div class="wl-countdown__unit"><b id="wl-cd-s">–</b><span>seg</span></div>
  </div>
  <div id="waitlist-app"><p class="wl-status">Cargando…</p></div>
</div>
<script src="/waitlist.js?v=2" defer></script>
</body>
</html>
