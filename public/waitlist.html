<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sumate a la waitlist | CuántoSale</title>
<meta name="description" content="El lanzamiento oficial de CuántoSale está cerca. Anotate gratis a la lista de espera y sé el primero en usarla.">
<meta name="theme-color" content="#0B1330">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{--wl-bg:#0B1330;--wl-card:#12193A;--wl-line:#26305C;--wl-amber:#F2A93B;--wl-ink:#F3F6FC;--wl-ink2:#9AA6C7}
  *{box-sizing:border-box}
  body{margin:0;background:var(--wl-bg);color:var(--wl-ink);font-family:'Poppins',system-ui,sans-serif;min-height:100vh}
  .wl-wrap{max-width:600px;margin:0 auto;padding:32px 20px;display:flex;flex-direction:column;justify-content:center;min-height:100vh}
  .wl-card{background:var(--wl-card);border:3px solid var(--wl-amber);border-radius:28px;padding:48px 40px;box-shadow:0 0 0 1px rgba(242,169,59,.18),0 32px 80px -24px rgba(242,169,59,.4)}
  .wl-logo{display:flex;align-items:center;justify-content:center;gap:10px;font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:26px;margin-bottom:26px}
  .wl-countdown__label{text-align:center;color:var(--wl-ink2);font-size:13px;margin:0 0 14px;letter-spacing:.06em;text-transform:uppercase;font-weight:600}
  .wl-countdown{display:flex;justify-content:center;gap:14px;margin:0 0 32px}
  .wl-countdown__unit{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:72px;padding:16px 10px;border:1px solid var(--wl-line);border-radius:16px;background:#0E1533}
  .wl-countdown__unit b{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:42px;color:var(--wl-amber);line-height:1;font-variant-numeric:tabular-nums}
  .wl-countdown__unit span{font-size:11px;color:var(--wl-ink2);text-transform:uppercase;letter-spacing:.05em;font-weight:600}
  h1{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:44px;line-height:1.04;margin:0 0 16px;text-wrap:balance;text-align:center}
  .wl-sub{color:var(--wl-ink2);font-size:17px;line-height:1.55;margin:0 0 30px;text-align:center}
  .wl-field{display:block;margin-bottom:14px}
  .wl-field input{display:block;width:100%;padding:18px;border:1px solid var(--wl-line);border-radius:14px;background:#0E1533;color:var(--wl-ink);font-size:17px}
  .wl-field input::placeholder{color:var(--wl-ink2)}
  .wl-btn{display:block;width:100%;border:0;border-radius:14px;background:var(--wl-amber);color:#1A1200;padding:19px;font-weight:800;font-size:18px;cursor:pointer;box-shadow:0 12px 28px -8px rgba(242,169,59,.6)}
  .wl-btn:disabled{opacity:.6;cursor:default;box-shadow:none}
  .wl-free-note{margin:10px 0 0;color:var(--wl-ink2);font-size:12px;text-align:center}
  .wl-urgency{display:flex;align-items:flex-start;gap:10px;color:var(--wl-ink);font-size:14px;font-weight:600;line-height:1.5;text-align:left;margin-top:22px;padding:14px 16px;border-radius:14px;background:rgba(242,169,59,.1);border:1px solid rgba(242,169,59,.3)}
  .wl-urgency b{color:var(--wl-amber)}
  .wl-error{color:#ff8a80;font-size:13px;margin:0 0 12px;text-align:center}
  .wl-reward{background:#0E1533;border:1px solid var(--wl-line);border-radius:14px;padding:16px;margin-top:16px}
  .wl-reward p{margin:0 0 10px;font-size:13px;color:var(--wl-ink2);line-height:1.5}
  .wl-reward p b{color:var(--wl-amber)}
  .wl-reward__track{height:8px;border-radius:99px;background:var(--wl-line);overflow:hidden}
  .wl-reward__fill{height:100%;background:var(--wl-amber);border-radius:99px;transition:width .4s ease}
  .wl-reward__steps{display:flex;justify-content:space-between;margin-top:6px;font-size:10px;color:var(--wl-ink2)}
  .wl-count{color:var(--wl-ink2);font-size:13px;text-align:center;margin-top:14px}
  .wl-count b{color:var(--wl-amber)}
  .wl-confirm-position{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:64px;color:var(--wl-amber);line-height:1;text-align:center;margin:6px 0}
  .wl-confirm-label{text-align:center;color:var(--wl-ink2);font-size:13px;margin-bottom:22px}
  .wl-share{display:flex;gap:8px;align-items:center;background:#0E1533;border:1px solid var(--wl-line);border-radius:12px;padding:10px}
  .wl-share input{flex:1;border:0;background:transparent;color:var(--wl-ink);font-size:13px;min-width:0}
  .wl-share button{flex:none;border:0;border-radius:9px;background:var(--wl-amber);color:#1A1200;padding:9px 12px;font-weight:700;font-size:13px;cursor:pointer}
  .wl-stat{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-top:1px solid var(--wl-line);font-size:14px}
  .wl-stat:first-child{border-top:0}
  .wl-stat b{color:var(--wl-amber);font-size:18px}
  .wl-status{font-size:12px;color:var(--wl-ink2);margin:10px 0 0;text-align:center}
  @media (max-width:560px){
    .wl-card{padding:32px 22px;border-radius:22px}
    h1{font-size:32px}
    .wl-countdown{gap:8px}
    .wl-countdown__unit{min-width:0;flex:1;padding:12px 4px}
    .wl-countdown__unit b{font-size:28px}
    .wl-confirm-position{font-size:48px}
  }
</style>
</head>
<body>
<div class="wl-wrap">
  <div id="waitlist-app"><p class="wl-status">cuántosale — cargando…</p></div>
</div>
<script src="/waitlist.js?v=6" defer></script>
</body>
</html>
