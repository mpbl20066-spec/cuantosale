<!doctype html>
<html lang="es" data-theme="light" data-pagina="guias">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Guías de viaje a Brasil desde Uruguay: 40 destinos · CuántoSale</title>
<meta name="description" content="Playas, qué hacer, dónde comer y cuándo ir en 40 destinos de Brasil, con cuánto cuesta viajar desde Uruguay.">
<script src="tema.js"></script>
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<script src="instalar.js" defer></script>
<script src="moneda.js"></script>
<link rel="stylesheet" href="../style.css">
<link rel="stylesheet" href="cuenta.css">
<style>
  /* Guías de destinos, en dos pantallas:
     1 el menu de Destinos, en oscuro, como en la maqueta
     2 la lista de destinos con su guía
     El contenido de la guía no vive acá: se pide a /api/guia con el token que firma
     el server, igual que en el sitio. Esta pantalla no abre la puerta: la pide. */
  body{background:#E9EDF3;margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 12px;font-family:var(--fb)}
  [data-theme="night"] body{background:#05080D}
  .phone{position:relative;width:390px;max-width:100%;height:800px;max-height:calc(100vh - 32px);background:var(--bg);border:10px solid #0A101A;border-radius:48px;box-shadow:0 24px 60px rgba(10,16,26,.28);overflow:hidden;display:flex;flex-direction:column}
  .status{flex:0 0 auto;display:flex;justify-content:space-between;padding:14px 26px 4px;font-size:14px;font-weight:700;color:var(--ink)}
  button,input{font-family:var(--fb)}
  .g-bar{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;padding:0 14px}
  .g-back{width:40px;height:40px;margin-left:-8px;border:0;background:transparent;color:var(--ink);display:grid;place-items:center;cursor:pointer}
  .g-main{flex:1;overflow-y:auto;padding:4px 18px 18px;scrollbar-width:none}
  .g-main::-webkit-scrollbar{display:none}
  /* Pantalla 1 (Destinos): pagina completa con populares, tarjetas de accion y cierre. Siempre en azul noche. */
  .g-menu{position:absolute;inset:0;z-index:5;--gm-bg:#0F1B2D;--gm-card:#1A2B4A;--gm-y:#F5C518;--gm-gris:#B0B8C4;--gm-gris2:#6A7A8A;background:var(--gm-bg);overflow-y:auto;padding:0;scrollbar-width:none}
  .g-menu[hidden]{display:none}
  .g-menu::-webkit-scrollbar{display:none}
  .gm{box-sizing:border-box;max-width:1200px;margin:0 auto;padding:20px 18px 28px}
  .gm button{font-family:var(--fb);cursor:pointer}
  .gm-titulo{display:flex;align-items:flex-start;gap:12px}
  .gm-pin{flex:0 0 auto;display:grid;place-items:center;width:44px;height:44px;border-radius:50%;background:var(--gm-y)}
  .gm-pin svg{width:20px;height:24px}
  .gm-titulo h1{margin:0;font-family:var(--fh);font-size:30px;line-height:1.1;font-weight:800;color:#fff}
  .gm-titulo p{margin:6px 0 0;font-size:14px;line-height:1.45;color:rgba(255,255,255,.7)}
  .gm-bus{display:flex;align-items:center;gap:12px;margin-top:18px;padding:14px 16px;border:1px solid rgba(255,255,255,.14);border-radius:12px;background:var(--gm-card);color:#fff}
  .gm-bus svg{flex:0 0 auto}
  .gm-bus input{flex:1;min-width:0;border:0;outline:0;background:transparent;color:#fff;font:600 15px var(--fb)}
  .gm-bus input::placeholder{color:var(--gm-gris)}
  .gm-bus:focus-within{border-color:var(--gm-y)}
  .gm-pop{margin-top:26px}
  .gm-pop__h{display:flex;align-items:center;justify-content:space-between;gap:12px}
  .gm-pop__h h2{display:flex;align-items:center;gap:10px;margin:0;font-family:var(--fh);font-size:20px;font-weight:800;color:#fff}
  .gm-link{display:inline-flex;align-items:center;gap:6px;padding:6px 0;border:0;background:transparent;color:var(--gm-y);font-size:14px;font-weight:700}
  .gm-pop__g{display:flex;gap:12px;margin:14px -18px 0;padding:0 18px 4px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
  .gm-pop__g::-webkit-scrollbar{display:none}
  .gm-dest{position:relative;flex:0 0 150px;height:170px;scroll-snap-align:start;display:flex;align-items:flex-end;justify-content:space-between;gap:6px;box-sizing:border-box;padding:12px;border:1px solid rgba(255,255,255,.18);border-radius:12px;background:#1A2B4A center/cover no-repeat;color:#fff;font-size:14px;font-weight:700;text-align:left;overflow:hidden}
  .gm-dest::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,16,26,0) 45%,rgba(10,16,26,.85))}
  .gm-dest>*{position:relative}
  .gm-dest span{display:flex;align-items:center;gap:6px;min-width:0}
  .gm-dest:focus-visible,.gm-card:focus-visible,.gm-link:focus-visible{outline:3px solid var(--gm-y);outline-offset:2px}
  .gm-card{position:relative;display:flex;align-items:center;gap:16px;width:100%;box-sizing:border-box;margin-top:16px;padding:20px;border:1px solid rgba(255,255,255,.1);border-radius:16px;background:var(--gm-card);color:#fff;text-align:left;overflow:hidden}
  .gm-card:hover{border-color:rgba(255,255,255,.24)}
  .gm-card__i{flex:0 0 auto;display:grid;place-items:center;width:64px;height:64px;border-radius:50%;background:rgba(255,255,255,.1)}
  .gm-card__t{flex:1;min-width:0;display:block}
  .gm-card__t b{display:block;font-family:var(--fh);font-size:20px;font-weight:800}
  .gm-card__t>span{display:block;margin-top:6px;max-width:44ch;font-size:14px;line-height:1.55;color:var(--gm-gris)}
  .gm-card__t em{display:inline-flex;align-items:center;gap:6px;margin-top:12px;font-style:normal;font-size:14px;font-weight:700;color:var(--gm-y)}
  .gm-card__ilu{display:none}
  .gm-card[data-accion="guias"] .gm-card__t b{padding-right:96px}
  .gm-badge{position:absolute;top:16px;right:16px;padding:5px 12px;border-radius:99px;background:var(--gm-y);color:#0F1B2D;font-size:12px;font-weight:800}
  .gm-nota{font-family:'Segoe Script','Brush Script MT','Lucida Handwriting',cursive;font-size:15px;line-height:1.25;color:#fff;transform:rotate(-6deg)}
  /* final de la pagina: olas que se mueven y un sol que sube. Sin movimiento si el sistema pide reducirlo. */
  .gm-fin{position:relative;height:150px;margin:34px -18px -28px;overflow:hidden}
  .gm-fin svg{position:absolute;left:0;bottom:0;width:200%;height:70px}
  .gm-fin .gm-sol{position:absolute;left:50%;bottom:30px;width:84px;height:84px;margin-left:-42px;border-radius:50%;background:radial-gradient(circle,#FFE27A 0 45%,#F5C518 46% 60%,rgba(245,197,24,.18) 61%);animation:gm-sol 6s ease-out both}
  .gm-fin .gm-o1 path{fill:#2C4468}.gm-fin .gm-o2 path{fill:#1F4E86}.gm-fin .gm-o3 path{fill:#1A2B4A}
  .gm-fin .gm-o1{animation:gm-ola 14s linear infinite;opacity:.55;bottom:18px}
  .gm-fin .gm-o2{animation:gm-ola 9s linear infinite reverse;opacity:.8;bottom:6px}
  .gm-fin .gm-o3{animation:gm-ola 6s linear infinite}
  @keyframes gm-ola{to{transform:translateX(-50%)}}
  @keyframes gm-sol{from{transform:translateY(70px)}to{transform:none}}
  @media (prefers-reduced-motion:reduce){.gm-fin *{animation:none!important}}
  @media (min-width:768px){
    .gm{padding:36px 24px 44px}
    .gm-pin{width:56px;height:56px}.gm-pin svg{width:24px;height:30px}
    .gm-titulo{align-items:center;gap:18px}
    .gm-titulo h1{font-size:34px}
    .gm-titulo p{font-size:16px}
    .gm-bus{padding:18px 22px}
    .gm-bus input{font-size:17px}
    .gm-pop{margin-top:34px}
    .gm-pop__h h2{font-size:24px}
    .gm-pop__g{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px;margin:16px 0 0;padding:0;overflow:visible}
    .gm-dest{flex:none;height:190px;font-size:15px}
    .gm-card{gap:26px;margin-top:20px;padding:28px}
    .gm-card__i{width:88px;height:88px}
    .gm-card__t b{font-size:24px}
    .gm-card[data-accion="guias"] .gm-card__t b{padding-right:0}
    .gm-card__t>span{font-size:16px}
    .gm-card__ilu{position:relative;flex:0 0 38%;display:block;align-self:stretch;min-height:110px}
    .gm-fin{height:190px;margin:44px -24px -44px}
    .gm-fin svg{height:90px}
  }
  /* ilustraciones: una guia abierta con la foto del Cristo, un corazon con flecha, un globo con avion */
  .gm-ilu-guia .gm-pag{position:absolute;bottom:-34px;width:118px;height:150px;border-radius:10px;background:#fff center/cover;box-shadow:0 8px 20px rgba(0,0,0,.35)}
  .gm-ilu-guia .gm-pag--a{left:6%;transform:rotate(7deg)}
  .gm-ilu-guia .gm-pag--b{left:22%;transform:rotate(14deg);background:#e8edf3}
  .gm-ilu-guia .gm-nota{position:absolute;right:4%;top:44px;text-align:center}
  .gm-ilu-guia .gm-flecha{position:absolute;right:16%;top:92px}
  .gm-ilu-fav{align-items:center;gap:8px;justify-content:center}
  @media (min-width:768px){.gm-ilu-fav{display:flex}}
  .gm-corazon{display:grid;place-items:center;width:62px;height:62px;border-radius:50%;background:rgba(255,255,255,.1);color:#fff}
  /* buscador: el icono de la derecha abre los filtros por tipo de lugar; el numero dice si hay uno puesto */
  .gm-bus__l{display:flex;color:#fff}
  .gm-bus__f{position:relative;display:grid;place-items:center;width:40px;height:40px;margin:-8px -8px -8px 0;border:0;border-radius:10px;background:transparent;color:#fff}
  .gm-bus__f[aria-expanded="true"]{background:rgba(255,255,255,.1);color:var(--gm-y)}
  .gm-bus__n{position:absolute;top:4px;right:4px;width:9px;height:9px;border-radius:50%;background:var(--gm-y)}
  .gm-bus__n[hidden]{display:none}
  .gm-bus__f:focus-visible,.gm-chip:focus-visible,.gm-fav:focus-visible,.gm-pin:focus-visible,.gm-mini:focus-visible{outline:3px solid var(--gm-y);outline-offset:2px}
  .gm-fil{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
  .gm-fil[hidden]{display:none}
  .gm-chip{padding:8px 14px;border:1px solid rgba(255,255,255,.18);border-radius:99px;background:transparent;color:#fff;font-size:14px;font-weight:700;white-space:nowrap}
  .gm-chip[aria-pressed="true"]{background:var(--gm-y);border-color:var(--gm-y);color:#0F1B2D}
  /* tarjeta de destino con corazon: el corazon es otro boton encima, no va adentro del boton de la tarjeta */
  .gm-dw{position:relative;flex:0 0 150px;scroll-snap-align:start;display:flex}
  .gm-dw .gm-dest{flex:1;width:100%}
  .gm-fav{position:absolute;top:8px;right:8px;z-index:1;display:grid;place-items:center;width:34px;height:34px;padding:0;border:0;border-radius:50%;background:rgba(10,16,26,.55);color:var(--gm-y)}
  .gm-fav svg,.g-fav svg{color:inherit}
  .gm-fav[aria-pressed="true"] path{fill:currentColor}
  .gm-vacio{flex:1;margin:0;padding:18px 0;font-size:14px;line-height:1.5;color:var(--gm-gris)}
  /* Cuando viajas: meses, mapa y recomendados */
  .gm-mes{margin-top:26px;padding:20px;border:1px solid rgba(255,255,255,.1);border-radius:16px;background:var(--gm-card);color:#fff}
  .gm-mes__h h2{margin:0;font-family:var(--fh);font-size:20px;font-weight:800;color:#fff}
  .gm-mes__h p{margin:6px 0 0;font-size:14px;line-height:1.5;color:var(--gm-gris)}
  .gm-meses{display:flex;gap:6px;margin:14px -20px 0;padding:0 20px 4px;overflow-x:auto;scrollbar-width:none}
  .gm-meses::-webkit-scrollbar{display:none}
  .gm-meses .gm-chip{flex:0 0 auto;padding:7px 12px}
  .gm-mes__c{display:flex;flex-direction:column;gap:18px;margin-top:16px}
  .gm-mapa{position:relative}
  .gm-mapa__v{position:relative;max-width:420px;margin:0 auto}
  .gm-mapa svg{display:block;width:100%;height:auto;margin:0 auto;touch-action:pan-y;user-select:none;-webkit-user-select:none}
  .gm-mapa svg.is-zoom{touch-action:none;cursor:grab;border-radius:12px;background:rgba(255,255,255,.03)}
  .gm-mapa svg.is-arrastre{cursor:grabbing}
  .gm-mapa__br,.gm-mapa__uy{vector-effect:non-scaling-stroke}
  /* zoom: botones arriba a la derecha del mapa; en el celular ademas se pellizca con dos dedos y, con zoom, se arrastra */
  .gm-zoom{position:absolute;top:4px;right:4px;z-index:2;display:flex;flex-direction:column;gap:6px}
  .gm-zoom button{display:grid;place-items:center;width:40px;height:40px;padding:0;border:1px solid rgba(255,255,255,.18);border-radius:10px;background:#0F1B2D;color:#fff;font:700 22px/1 var(--fb)}
  .gm-zoom button[hidden]{display:none}
  .gm-zoom button:disabled{opacity:.4;cursor:default}
  .gm-zoom button:focus-visible{outline:3px solid var(--gm-y);outline-offset:2px}
  .gm-mapa__br{fill:#25406A;stroke:#3C5A88;stroke-width:1.2;stroke-linejoin:round}
  .gm-mapa__uy{fill:#1F3352;stroke:#3C5A88;stroke-width:1;stroke-linejoin:round}
  .gm-pin{cursor:pointer}
  .gm-pin circle{fill:#7F8EA3;stroke:#0F1B2D;stroke-width:1.5;transition:r .15s}
  .gm-pin.is-rec circle{fill:var(--gm-y)}
  .gm-pin.is-off{display:none}
  .gm-pin.is-sel circle{stroke:#fff;stroke-width:2.5}
  .gm-pin:hover circle{stroke:#fff}
  .gm-pin text{font:800 11px var(--fb);fill:#fff;paint-order:stroke;stroke:#0F1B2D;stroke-width:3px;pointer-events:none}
  .gm-pin text.gm-pin__n{font:800 9.5px var(--fb);fill:#0F1B2D;stroke:none}
  .gm-mini i{position:absolute;top:8px;left:8px;display:grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--gm-y);color:#0F1B2D;font:800 12px var(--fb);font-style:normal}
  .gm-mvd circle{fill:#fff}
  .gm-guia{stroke:var(--gm-y);opacity:.75}
  .gm-guia__o{fill:var(--gm-y)}
  .gm-mvd text{font:700 10px var(--fb);fill:var(--gm-gris)}
  .gm-ley{display:flex;justify-content:center;gap:16px;margin:8px 0 0;padding:0;list-style:none;font-size:12px;color:var(--gm-gris)}
  .gm-ley li{display:flex;align-items:center;gap:6px}
  .gm-ley i{width:10px;height:10px;border-radius:50%;background:#7F8EA3}
  .gm-ley i.is-rec{background:var(--gm-y)}
  .gm-sel{display:flex;align-items:center;gap:12px;margin-top:12px;padding:10px;border-radius:12px;background:rgba(255,255,255,.07)}
  .gm-sel[hidden]{display:none}
  .gm-sel__f{flex:0 0 64px;height:64px;border-radius:10px;background:#0F1B2D center/cover}
  .gm-sel__t{flex:1;min-width:0;font-size:13px;line-height:1.4;color:var(--gm-gris)}
  .gm-sel__t b{display:block;font-family:var(--fh);font-size:16px;color:#fff}
  .gm-sel__t .gm-link{min-height:0;padding:6px 0 0;white-space:nowrap}
  .gm-sel__t .gm-link svg,.gm-rec .gm-link svg{flex:0 0 14px;width:14px;height:14px}
  .gm-sel .gm-fav{position:static;flex:0 0 auto;background:rgba(255,255,255,.1)}
  .gm-tabs{display:flex;gap:4px;margin-bottom:14px;padding:4px;border-radius:12px;background:rgba(255,255,255,.07)}
  .gm-tab{flex:1 1 0;min-width:0;min-height:40px;padding:6px 4px;border:0;border-radius:9px;background:transparent;color:var(--gm-gris);font-size:13.5px;font-weight:800;line-height:1.15;text-align:center}
  /* en el celular las tres pestanas entran en el ancho: letra mas chica y, si no alcanza, el texto baja a dos renglones */
  .gm-tab__c{display:none}
  @media (max-width:420px){.gm-tab{font-size:12.5px}.gm-tab__l{display:none}.gm-tab__c{display:inline}}
  .gm-tab[aria-pressed="true"]{background:var(--gm-y);color:#0F1B2D}
  .gm-tab:focus-visible{outline:3px solid var(--gm-y);outline-offset:2px}
  .gm-rec__nota{margin:10px 0 0;font-size:12.5px;line-height:1.5;color:var(--gm-gris)}
  .gm-rec__nota:empty{display:none}
  .gm-mini small.is-dato{color:#fff;font-weight:700}
  .gm-cargando{grid-column:1/-1;margin:0;padding:24px 0;font-size:14px;color:var(--gm-gris)}
  .gm-rec h3{margin:0;font-family:var(--fh);font-size:16px;font-weight:800;color:#fff}
  .gm-rec__l{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:12px}
  .gm-mini{position:relative;display:flex;flex-direction:column;justify-content:flex-end;min-height:110px;box-sizing:border-box;padding:10px;border:0;border-radius:12px;background:#0F1B2D center/cover no-repeat;color:#fff;text-align:left;overflow:hidden}
  .gm-mini::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,16,26,0) 25%,rgba(10,16,26,.9))}
  .gm-mini>*{position:relative}
  .gm-mini b{font-size:14px;line-height:1.2}
  .gm-mini small{margin-top:3px;font-size:11.5px;font-weight:700;color:#9FE3B4}
  .gm-mini small.is-alta{color:#FFC48A}
  .gm-rec .gm-link{margin-top:8px}
  @media (min-width:768px){
    .gm-mes{margin-top:34px;padding:28px}
    .gm-mes__h h2{font-size:24px}
    .gm-mes__h p{font-size:16px}
    .gm-meses{flex-wrap:wrap;margin:16px 0 0;padding:0;overflow:visible}
    .gm-mes__c{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:28px;align-items:start}
    .gm-rec__l{grid-template-columns:repeat(3,minmax(0,1fr))}
    .gm-dw{flex:none}
    .gm-pop__g.is-filtro{grid-template-columns:repeat(5,minmax(0,1fr))}
  }
  /* con un filtro puesto la grilla muestra todos los que coinciden, no una fila de 5 */
  @media (max-width:767px){.gm-pop__g.is-filtro{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));margin:14px 0 0;padding:0;overflow:visible}.gm-pop__g.is-filtro .gm-dest{height:140px}}
  /* lista (pantalla 2 y favoritos): el corazon va dentro de la tarjeta, antes de la flecha. Amarillo en modo
     oscuro, azul en modo claro; vacio si no esta guardado, lleno si esta. */
  .g-fila{position:relative;display:flex}
  .g-fila .g-dest{flex:1;min-width:0}
  .g-fila .g-dest__t{margin-right:44px}
  .g-fav{position:absolute;top:50%;right:34px;transform:translateY(-50%);display:grid;place-items:center;width:44px;height:44px;padding:0;border:0;border-radius:50%;background:transparent;color:var(--marca-navy,#0B2A55);cursor:pointer}
  [data-theme="night"] .g-fav{color:#F7C325}
  .g-fav[aria-pressed="true"] path{fill:currentColor}
  .g-fav:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
  /* celular y tablet: la barra de arriba (volver, moneda, menu) queda encima del menu, que es fixed desde el borde:
     el menu arranca debajo de ella, si no tapaba el titulo "Destinos". --gbar lo mide el script (44px en celular). */
  @media (max-width:1023px){html.cs-hdr[data-pagina="guias"] .g-menu{top:var(--gbar,44px)}}
  /* Modo claro: el menu de Destinos era siempre azul noche. Con el tema claro pasa a fondo claro, tarjetas blancas y
     texto oscuro; las fotos (populares, recomendados) siguen con texto blanco sobre el degrade. El dorado de los
     links se oscurece porque el amarillo sobre blanco no se lee; los botones amarillos quedan igual. */
  html[data-theme="light"] .g-menu{--gm-bg:#F3F6FA;--gm-card:#FFFFFF;--gm-gris:#4B5B70;--gm-gris2:#6A7A8A;--gm-ink:#0F1B2D;--gm-line:rgba(15,27,45,.14);--gm-suave:rgba(15,27,45,.06)}
  html[data-theme="light"] .g-menu :is(.gm-titulo h1,.gm-pop__h h2,.gm-mes__h h2,.gm-rec h3,.gm-sel__t b,.gm-card,.gm-mes,.gm-bus,.gm-bus input,.gm-bus__l,.gm-bus__f,.gm-chip,.gm-corazon,.gm-nota){color:var(--gm-ink)}
  html[data-theme="light"] .g-menu .gm-titulo p{color:var(--gm-gris)}
  html[data-theme="light"] .g-menu :is(.gm-bus,.gm-card,.gm-mes,.gm-chip,.gm-zoom button){border-color:var(--gm-line)}
  html[data-theme="light"] .g-menu :is(.gm-card,.gm-mes,.gm-bus){box-shadow:0 2px 10px rgba(15,27,45,.05)}
  html[data-theme="light"] .g-menu .gm-card:hover{border-color:rgba(15,27,45,.28)}
  html[data-theme="light"] .g-menu :is(.gm-card__i,.gm-corazon,.gm-sel,.gm-tabs,.gm-bus__f[aria-expanded="true"]){background:var(--gm-suave)}
  html[data-theme="light"] .g-menu :is(.gm-link,.gm-card__t em){color:#8A6100}
  html[data-theme="light"] .g-menu .gm-bus__f[aria-expanded="true"]{color:#8A6100}
  html[data-theme="light"] .g-menu .gm-tab{color:var(--gm-gris)}

  var CLAVES = Object.keys(C.Nombres).sort(function (a, b) { return C.Nombres[a].localeCompare(C.Nombres[b], 'es'); });
  var track = function (n, p) { window.mockTrack(n, Object.assign({ pantalla: S.pant }, p || {})); };
  var foto = function (k) { return '../fotos/' + k + '.jpg'; };
  var sinTilde = function (s) { return String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase(); };
  var enMes = function (d) { return d.meses.indexOf(S.mes) >= 0; };

  var FAV_KEY = 'cs_favoritos', favs = [];

  var esFav = function (k) { return favs.indexOf(k) >= 0; };

  }
  function grilla() {
    var g = $('gmGrid'), l;

  }

  /* ---- mapa: misma proyeccion que el contorno (equirectangular, 10 px por grado, corregida por cos 15°) */
  var K = Math.cos(15 * Math.PI / 180);
  var xy = function (lat, lon) { return [(lon + 74.2) * K * 10, (5.6 - lat) * 10]; };
  /* ---- "Mejor clima": puntaje de 0 a 1 con el clima promedio del mes (data/clima-destinos.json, 2015-2024).

     y las horas de sol. */
  function puntajeClima(d) {

  /* ---- "Mas baratos": vuelo + alojamiento por persona desde Montevideo, del mismo endpoint de la portada

     en avion: el mismo viaje que el "Desde" de la guia (estimado-guia.js) y que abre la app, asi el precio de la
     tarjeta y el de la guia coinciden cuando el mes es el mismo. */
  var PRECIOS = {}, PIDIENDO = {}, MEDIO = {}, FECHAS = {};
  var MODO_APP = { avion_mvd: 'avion', avion_ba: 'avion', auto: 'auto', bus: 'bus' };
  /* el mismo link que "Calculá tu viaje" de la guia, con las fechas del precio que se mostro (con mes=1 el servidor

    return 'home-destino.html?destino=' + k + '&ida=' + f.dep + '&vuelta=' + f.ret + '&pax=2' + (modo ? '&modo=' + modo : '') + '&fuente=guias_mas_baratos' + (debug ? '&debug=1' : '');
  }
  /* Salida el 15 del mes. Si para eso faltan menos de 10 dias: en el mes actual se sale en 10 dias si todavia entra

  function fechasMes(m) {
    var hoy = new Date(), dep = new Date(hoy.getFullYear(), m - 1, 15), pronto = new Date(hoy.getTime() + 10 * 864e5);
    if (dep < pronto) {
      var finMes = new Date(hoy.getFullYear(), m, 0).getDate();

      else dep.setFullYear(dep.getFullYear() + 1);

    return { dep: iso(dep), ret: iso(ret), anio: dep.getFullYear(), dia: dep.getDate() };
  }
  function pedirPrecios(m) {
    if (PRECIOS[m] || PIDIENDO[m]) return;
    PIDIENDO[m] = true;
    var f = fechasMes(m), items = DESTS.map(function (d) { return d.k + '~' + f.dep + '~' + f.ret + '~economico'; }).join(',');
    var ctl = window.AbortController ? new AbortController() : null, tm = setTimeout(function () { if (ctl) ctl.abort(); }, 15000);
    fetch('/api/destinos-destacados?' + new URLSearchParams({ pax: '2', style: 'ahorro', origin: 'MVD', transport: 'flight', mes: '1', items: items }).toString(), ctl ? { signal: ctl.signal } : {})
      .then(function (r) { if (!r.ok) throw new Error('http ' + r.status); return r.json(); })
      .then(function (j) { var por = {}; (j.items || []).forEach(function (it) { if (it.pp > 0) { por[it.key] = it.pp; MEDIO[m + it.key] = it.mode; FECHAS[m + it.key] = { dep: it.dep, ret: it.ret }; } }); PRECIOS[m] = por; })
      .catch(function () { PRECIOS[m] = null; })
      .then(function () { clearTimeout(tm); PIDIENDO[m] = false; if (S.mes === m && S.rank !== 'clima') { listaMes(); mapa(); } });
  }
  var fmtUsd = function (n) { return window.CSMoneda ? CSMoneda.fmt(n) : 'US$ ' + Math.round(n).toLocaleString('es-UY'); };

  /* Que los primeros no sean todos vecinos: con Arraial do Cabo arriba, Cabo Frio y Buzios (a 20-40 km) salian
     2.º y 3.º y la lista parecia la misma zona repetida. Se recorre el ranking en orden y el que queda a menos de
     SEPARACION_KM de uno ya elegido pasa al final (sigue en "Ver mas", en su orden). */
  var SEPARACION_KM = 120;

  /* ---- "Recomendados": el equilibrio entre las otras dos pestanas. Antes eran 5 por mes elegidos a mano, que no
     eran ni los de mejor clima ni los mas baratos y nadie entendia por que estaban. Ahora es un puntaje de 0 a 1:
     45 % el clima del mes (el mismo de "Mejor clima"), 35 % el precio (el mas barato del mes vale 1 y el mas caro 0,
     los mismos precios de "Mas baratos"), 10 % que el mes este entre los buenos de su guia y 10 % que no sea
     temporada alta. Un destino sin datos de clima cuenta 0,4 en esa parte. */
  function puntajeRec(d) {
    var pr = PRECIOS[S.mes] || {}, vals = Object.keys(pr).map(function (k) { return pr[k]; }).filter(function (n) { return n > 0; });
    var c = puntajeClima(d), p = 0;
    if (c < 0) c = 0.4;

      p = max > min ? 1 - (pr[d.k] - min) / (max - min) : 1;

    var resto = 0.45 * c + 0.1 * (enMes(d) ? 1 : 0) + 0.1 * (esAlta(d) ? 0 : 1);
    /* sin precios (todavia cargando, o el servidor no respondio) se ordena con clima y temporada, en la misma escala */
    return vals.length ? resto + 0.35 * p : resto / 0.65;
  }
  function rankRec(filtro) {
    return separar(DESTS.filter(filtro || function () { return true; }).map(function (d) { return { d: d, s: puntajeRec(d) }; })
      .sort(function (a, b) { return b.s - a.s; }).map(function (x) { return x.d; }));
  }
  /* Los 5 primeros del mes (para el cartel del mapa). */
  var esTop = function (d) { return rankRec().slice(0, 5).indexOf(d) >= 0; };
  function km(a, b) {
    var r = Math.PI / 180, dLat = (b.lat - a.lat) * r, dLon = (b.lon - a.lon) * r;
    var h = Math.sin(dLat / 2) * Math.sin(dLat / 2) + Math.cos(a.lat * r) * Math.cos(b.lat * r) * Math.sin(dLon / 2) * Math.sin(dLon / 2);
    return 12742 * Math.asin(Math.sqrt(h));

  function separar(l) {
    var elegidos = [], resto = [];
    l.forEach(function (d) { (elegidos.some(function (e) { return km(e, d) < SEPARACION_KM; }) ? resto : elegidos).push(d); });
    return elegidos.concat(resto);
  }

  function recomendados() {
    if (S.rank === 'clima') {
      /* la temperatura ideal de playa y la de ciudad o sierra no se comparan: sin filtro de tipo, solo playas (antes
         Sao Paulo salia 2.º en abril, al lado de Buzios) */
      return separar(DESTS.filter(function (d) { return coincide(d) && (S.tipo || d.group === 'beach') && puntajeClima(d) >= 0; })
        .sort(function (a, b) { return puntajeClima(b) - puntajeClima(a); }));
    }
    if (S.rank === 'precio') {
      var pr = PRECIOS[S.mes]; if (!pr) return [];
      return separar(DESTS.filter(function (d) { return coincide(d) && pr[d.k] > 0; })
        .sort(function (a, b) { return pr[a.k] - pr[b.k]; }));
    }
    return rankRec(coincide);
  }
  /* [12,1,2,3] -> "diciembre a marzo"; [1,2,7,8] -> "enero a febrero y julio a agosto" */
  function rangos(ms) {
    if (!ms.length) return 'otra época';
    if (ms.length === 12) return 'cualquier mes';
    var set = {}, tramos = [], ini = 1, i;
    ms.forEach(function (m) { set[m] = 1; });
    while (set[ini] && set[ini === 1 ? 12 : ini - 1]) ini++;   // arrancar donde empieza un tramo
    for (i = 0; i < 12; i++) {
      var m = ((ini - 1 + i) % 12) + 1, prev = m === 1 ? 12 : m - 1;
      if (!set[m]) continue;
      if (tramos.length && tramos[tramos.length - 1].fin === prev) tramos[tramos.length - 1].fin = m; else tramos.push({ ini: m, fin: m });
    }
    var t = tramos.map(function (r) { return r.ini === r.fin ? MESES[r.ini - 1] : MESES[r.ini - 1] + ' a ' + MESES[r.fin - 1]; });
    return t.length > 1 ? t.slice(0, -1).join(', ') + ' y ' + t[t.length - 1] : t[0];
  }
  var REC_MAX = 5;
  /* Los recomendados que se ven en la lista, en orden: el numero del pin es el de la tarjeta. */
  function visibles() { var l = recomendados(); return S.recTodos ? l : l.slice(0, REC_MAX); }
  /* ---- zoom del mapa: se achica el viewBox. Los pines se dibujan con scale(k) para que mantengan su tamaño en
     pantalla (con zoom x3 no se ven tres veces mas grandes, se separan). */
  var VB0 = { x: -6, y: -6, w: 396, h: 420 }, ZMAX = 6;
  S.vb = { x: VB0.x, y: VB0.y, w: VB0.w, h: VB0.h };
  var escalaPin = function () { return S.vb.w / VB0.w; };
  function encuadrar() {
    S.vb.x = Math.max(VB0.x, Math.min(VB0.x + VB0.w - S.vb.w, S.vb.x));
    S.vb.y = Math.max(VB0.y, Math.min(VB0.y + VB0.h - S.vb.h, S.vb.y));
    var svg = $('gmMapa'), z = S.vb.w < VB0.w - 0.5;
    svg.setAttribute('viewBox', [S.vb.x, S.vb.y, S.vb.w, S.vb.h].map(function (n) { return n.toFixed(2); }).join(' '));
    svg.classList.toggle('is-zoom', z);
    var b = function (k) { return document.querySelector('[data-zoom="' + k + '"]'); };
    b('in').disabled = S.vb.w <= VB0.w / ZMAX + 0.5; b('out').disabled = !z; b('reset').hidden = !z;
  }
  /* f > 1 acerca; (cx, cy) en unidades del mapa queda fijo en pantalla */
  function zoom(f, cx, cy) {
    var w = Math.max(VB0.w / ZMAX, Math.min(VB0.w, S.vb.w / f)), r = w / S.vb.w;
    /* con los botones: hacia el destino elegido; si no hay, desde Brasil entero hacia la costa (donde estan los 40,
       el centro del mapa es el interior vacio); con zoom ya puesto, sobre lo que se esta mirando */
    if (cx == null) {
      var c = POR[S.sel] ? xy(POR[S.sel].lat, POR[S.sel].lon) : S.vb.w >= VB0.w - 0.5 ? costa() : [S.vb.x + S.vb.w / 2, S.vb.y + S.vb.h / 2];
      cx = c[0]; cy = c[1];
      /* el punto elegido queda en el centro de la vista, no solo fijo */
      S.vb.x = cx - S.vb.w / 2; S.vb.y = cy - S.vb.h / 2;
    }
    S.vb.x = cx - (cx - S.vb.x) * r; S.vb.y = cy - (cy - S.vb.y) * r;
    S.vb.w = w; S.vb.h = VB0.h * w / VB0.w;

  function costa() {
    var ds = DESTS.filter(function (d) { return d.lat != null && coincide(d); }); if (!ds.length) ds = DESTS.filter(function (d) { return d.lat != null; });
    var ps = ds.map(function (d) { return xy(d.lat, d.lon); });
    var mx = function (i, f) { return f.apply(null, ps.map(function (q) { return q[i]; })); };
    var c = [(mx(0, Math.min) + mx(0, Math.max)) / 2, (mx(1, Math.min) + mx(1, Math.max)) / 2];
    /* el centro de la costa cae tierra adentro (la costa es curva): se usa el destino mas cercano a ese centro */
    return ps.reduce(function (m, q) { return Math.hypot(q[0] - c[0], q[1] - c[1]) < Math.hypot(m[0] - c[0], m[1] - c[1]) ? q : m; }, ps[0]);

  }
  /* gestos: con un dedo y zoom, arrastrar mueve el mapa; con dos dedos, pellizcar acerca o aleja. Sin zoom, un dedo

  var dedos = {}, gesto = null;
  function iniciarGestos() {
    var svg = $('gmMapa');
    svg.addEventListener('pointerdown', function (e) {
      dedos[e.pointerId] = { x: e.clientX, y: e.clientY };
      var ids = Object.keys(dedos);
      if (ids.length === 2) {
        var a = dedos[ids[0]], b = dedos[ids[1]];
        gesto = { tipo: 'pellizco', dist: Math.hypot(a.x - b.x, a.y - b.y), movio: true };
      } else if (ids.length === 1) gesto = { tipo: 'arrastre', x: e.clientX, y: e.clientY, movio: false };
      if (svg.classList.contains('is-zoom') || ids.length === 2) { try { svg.setPointerCapture(e.pointerId); } catch (x) { /* nada */ } }
    });

      if (!Object.keys(dedos).length) gesto = null;

  }

  function mapa() {
    var num = {}, k = escalaPin(), tr = function (p) { return ' transform="translate(' + p[0].toFixed(1) + ' ' + p[1].toFixed(1) + ') scale(' + k.toFixed(3) + ')"'; };
    visibles().forEach(function (d, i) { num[d.k] = i + 1; });
    /* Los numerados que se pisan (Pipa, Natal, Joao Pessoa y Recife quedan a pocos px sin zoom) se separan hasta que
       se lean, y una linea fina los une con su lugar real. Con zoom ya no se pisan y quedan en su lugar. */
    var pos = {}, guias = '';
    S.posPin = pos;
    (function () {
      var R = 8 * k, minD = 2 * R + 2 * k, pts = DESTS.filter(function (d) { return num[d.k] && d.lat != null; })
        .map(function (d, i) { var q = xy(d.lat, d.lon); return { k: d.k, x: q[0], y: q[1], ox: q[0], oy: q[1], i: i }; });
      for (var it = 0; it < 80; it++) {
        var movio = false;
        for (var a = 0; a < pts.length; a++) for (var b = a + 1; b < pts.length; b++) {

        }

        pts.forEach(function (q) {
          q.x = Math.max(S.vb.x + R + k, Math.min(S.vb.x + S.vb.w - R - k, q.x));

      }
      pts.forEach(function (q) {
        pos[q.k] = [q.x, q.y];
        if (Math.hypot(q.x - q.ox, q.y - q.oy) > R * 0.6) guias += '<line class="gm-guia" x1="' + q.ox.toFixed(1) + '" y1="' + q.oy.toFixed(1) + '" x2="' + q.x.toFixed(1) + '" y2="' + q.y.toFixed(1) + '" stroke-width="' + (1.2 * k).toFixed(2) + '"/><circle class="gm-guia__o" cx="' + q.ox.toFixed(1) + '" cy="' + q.oy.toFixed(1) + '" r="' + (2.2 * k).toFixed(2) + '"/>';
      });
    })();
    var m = xy(-34.88, -56.18);
    var h = '<g class="gm-mvd" aria-hidden="true"' + tr(m) + '><circle r="3"/><text x="6" y="4">Montevideo</text></g>';
    /* los recomendados y el elegido se dibujan al final para que queden arriba de los grises */
    var orden = DESTS.filter(function (d) { return d.lat != null; }).sort(function (a, b) { return (!!num[a.k] - !!num[b.k]) || ((num[b.k] || 0) - (num[a.k] || 0)) || ((a.k === S.sel) - (b.k === S.sel)); });
    h += '<g aria-hidden="true">' + guias + '</g>';
    h += orden.map(function (d) {
      var p = pos[d.k] || xy(d.lat, d.lon), n = num[d.k], rec = !!n, sel = d.k === S.sel, izq = p[0] > S.vb.x + S.vb.w * 0.72;
      var cls = 'gm-pin' + (rec ? ' is-rec' : '') + (sel ? ' is-sel' : '') + (coincide(d) ? '' : ' is-off');
      return '<g class="' + cls + '" data-pin="' + d.k + '" tabindex="' + (coincide(d) ? 0 : -1) + '" role="button" aria-label="' + esc(d.name) + (rec ? ', número ' + n + ' de los recomendados de ' + MESES[S.mes - 1] : '') + '"' + tr(p) + '>' +
        '<title>' + esc(d.name) + '</title><circle r="' + (rec ? 8 : sel ? 7 : 4.5) + '"/>' +
        (rec ? '<text class="gm-pin__n" y="3.4" text-anchor="middle">' + n + '</text>' : '') +
        (sel ? '<text x="' + (izq ? -11 : 11) + '" y="4"' + (izq ? ' text-anchor="end"' : '') + '>' + esc(d.name) + '</text>' : '') + '</g>';
    }).join('');
    $('gmPins').innerHTML = h;
    var d = POR[S.sel], box = $('gmSel');
    if (!d) { box.hidden = true; return; }
    var txt = esTop(d) ? 'Uno de los mejores para ir en ' + MESES[S.mes - 1] + '.' + (esAlta(d) ? ' Es temporada alta: más gente y precios más altos.' : '')
      : enMes(d) ? (esAlta(d) ? 'Buen mes para ir, pero es temporada alta: más gente y precios más altos.' : 'Buen mes para ir: buen clima y menos gente.')
      : 'En ' + MESES[S.mes - 1] + ' no es lo ideal. Mejor de ' + rangos(d.meses) + '.';
    box.hidden = false;
    box.innerHTML = '<span class="gm-sel__f" style="background-image:url(' + foto(d.k) + ')" aria-hidden="true"></span>' +
      '<span class="gm-sel__t"><b>' + esc(d.name) + '</b>' + esc(d.region) + ' · ' + esc(txt) +
      '<br><button type="button" class="gm-link" data-dest="' + d.k + '">Ver guía ' + ic(I.chev, 14) + '</button></span>' + botonFav(d.k, 'gm-fav');
  }
  function meses() {
    $('gmMeses').innerHTML = MESES.map(function (n, i) {
      return '<button type="button" class="gm-chip" data-mes="' + (i + 1) + '" aria-pressed="' + (S.mes === i + 1) + '" aria-label="' + n + '">' + n.charAt(0).toUpperCase() + n.slice(1, 3) + '</button>';
    }).join('');
  }
  function dato(d) {
    if (S.rank === 'clima') {
      var c = d.clima[S.mes - 1];
      return '<small class="is-dato">' + c[0] + '° · ' + (c[1] === 0 ? 'casi sin lluvia' : c[1] === 1 ? '1 día de lluvia' : c[1] + ' días de lluvia') + '</small>';
    }
    if (S.rank === 'precio') return '<small class="is-dato">' + fmtUsd(PRECIOS[S.mes][d.k]) + ' por persona</small>';
    /* Recomendados: los dos datos que lo ponen arriba, clima y precio por persona. */
    var cr = d.clima && d.clima[S.mes - 1], pp = PRECIOS[S.mes] && PRECIOS[S.mes][d.k];
    return '<small class="is-dato">' + [cr ? cr[0] + '°' : '', pp > 0 ? fmtUsd(pp) : ''].filter(Boolean).join(' · ') + '</small>' +
      (esAlta(d) ? '<small class="is-alta">Temporada alta</small>' : '');
  }
  function listaMes() {
    var mes = MESES[S.mes - 1], f = fechasMes(S.mes);
    [].forEach.call(document.querySelectorAll('.gm-tab'), function (b) { b.setAttribute('aria-pressed', String(b.dataset.rank === S.rank)); });
    $('gmRecT').textContent = S.rank === 'clima' ? 'Mejor clima en ' + mes : S.rank === 'precio' ? 'Más baratos en ' + mes : 'Los mejores para ir en ' + mes;
    $('gmRecNota').textContent = S.rank === 'clima' ? 'Playas ordenadas por sol, poca lluvia y calor de playa en ' + mes + ': máxima promedio y días con lluvia fuerte, según el clima de 2015 a 2024 (Open-Meteo).' + (S.tipo && S.tipo !== 'beach' ? '' : ' Para ciudad o sierra, filtrá por tipo en el buscador.')
      : S.rank === 'precio' ? 'Vuelo y alojamiento desde Montevideo, por persona, para 2 personas y 7 noches saliendo en ' + mes + ' de ' + f.anio + ', en la fecha más barata que encontramos. Tocá un destino para cotizarlo con esas fechas.'
        : 'Lo mejor de ' + mes + ' sumando todo: clima (temperatura, lluvia y sol), precio de vuelo y alojamiento por persona, y si es temporada alta.' +
          (PRECIOS[S.mes] === null ? ' Ahora no pudimos calcular los precios: están ordenados por clima y temporada.' : '');
    var mas = $('gmRecMas');
    /* Recomendados no espera a los precios: se muestra con clima y temporada y se reordena cuando llegan */
    if (S.rank === 'top' && PRECIOS[S.mes] === undefined) pedirPrecios(S.mes);
    if (S.rank === 'precio' && !PRECIOS[S.mes]) {
      var fallo = PRECIOS[S.mes] === null;
      $('gmRec').innerHTML = '<p class="gm-cargando">' + (fallo ? 'No pudimos calcular los precios ahora. Probá de nuevo en un rato.' : 'Calculando precios…') + '</p>';
      mas.hidden = true;
      if (fallo) delete PRECIOS[S.mes]; else pedirPrecios(S.mes);
      return;
    }
    var l = recomendados(), v = visibles();
    $('gmRec').innerHTML = l.length ? v.map(function (d, i) {
      var cot = S.rank === 'precio' ? ' data-cotizar="' + d.k + '"' : '';
      return '<button type="button" class="gm-mini" data-dest="' + d.k + '"' + cot + ' style="background-image:url(' + foto(d.k) + ')"><i aria-hidden="true">' + (i + 1) + '</i><b>' + esc(d.name) + '</b>' + dato(d) +
        (cot ? '<span class="gm-mini__cta">Cotizar con estas fechas →</span>' : '') + '</button>';
    }).join('') : '<p class="gm-vacio">' + (hayFiltro() ? 'Ninguno de los destinos que buscaste aparece en ' + mes + '. Probá con otro mes.' : 'No hay destinos para este mes.') + '</p>';
    mas.hidden = l.length <= REC_MAX;
    mas.innerHTML = (S.recTodos ? 'Ver menos' : 'Ver más') + ' ' + ic(I.chev, 14);
  }
  function favTxt() {
    $('gmFavTxt').textContent = favs.length ? (favs.length === 1 ? 'Tenés 1 destino guardado: ' : 'Tenés ' + favs.length + ' destinos guardados: ') + favs.slice(0, 3).map(function (k) { return C.Nombres[k]; }).join(', ') + (favs.length > 3 ? '...' : '.')
      : 'Tocá el corazón de cualquier destino para guardarlo. Con tu cuenta, los ves en cualquier celular.';
  }
  function filtrosUI() {
    [].forEach.call(document.querySelectorAll('#gmFil .gm-chip'), function (b) { b.setAttribute('aria-pressed', String(b.dataset.tipo === S.tipo)); });
    $('filN').hidden = !S.tipo;
  }
  function menu() { $('menu').hidden = false; grilla(); meses(); mapa(); listaMes(); favTxt(); filtrosUI(); }

  function lista() {
    $('menu').hidden = true;
    var fav = S.pant === 3, q = sinTilde(S.q);
    var l = fav ? CLAVES.filter(esFav) : CLAVES.filter(function (k) { return !q || sinTilde(C.Nombres[k]).indexOf(q) >= 0; });
    $('main').innerHTML = (fav ? '<h1 class="g-tit">Mis favoritos</h1><p class="g-sub">' + (window.CSCuenta && CSCuenta.usuario && CSCuenta.usuario() ? 'Guardados en tu cuenta: los ves en cualquier celular o compu, y también en Guardados.' : 'Guardados en este navegador. Iniciá sesión para verlos en cualquier celular o compu.') + '</p>'
      : '<h1 class="g-tit">Guías de viaje</h1>' +
        '<p class="g-sub">Qué hacer, dónde comer y los tips que ahorran plata.<br>Elegí un destino y leé la guía antes de armarte el viaje.</p>' +
        '<label class="g-bus" for="bus">' + ic(I.lupa) + '<input id="bus" type="search" placeholder="Buscar destino…" value="' + esc(S.q) + '" autocomplete="off"></label>') +
      (l.length ? '<div class="g-lista">' + l.map(function (k) {
        return '<div class="g-fila"><button type="button" class="g-dest" data-dest="' + k + '">' +
          '<span class="g-dest__f" style="background-image:url(' + foto(k) + ')" aria-hidden="true"></span>' +
          '<span class="g-dest__t"><b>' + esc(C.Nombres[k]) + '</b><small>Guía de viaje</small></span>' +
          ic(I.chev, 16) + '</button>' + botonFav(k, 'g-fav') + '</div>';
      }).join('') + '</div>' : fav ? '<p class="g-vacio">Todavía no guardaste destinos.<br>Tocá el corazón en cualquier destino y aparece acá.</p>'
        : '<p class="g-vacio">No encontramos ese destino.<br>Probá con otro nombre.</p>');
  }
  function pintar() { if (S.pant === 1) menu(); else lista(); }

  function pinCercano(svg, cx, cy) {
    var m = svg.getScreenCTM(); if (!m) return '';
    var pt = svg.createSVGPoint(); pt.x = cx; pt.y = cy; pt = pt.matrixTransform(m.inverse());
    var mejor = '', dmin = Math.pow(22 * escalaPin(), 2);   // hasta 22 unidades del mapa (unos 2 grados)
    DESTS.forEach(function (d) {
      if (d.lat == null || !coincide(d)) return;
      var p = (S.posPin && S.posPin[d.k]) || xy(d.lat, d.lon), dd = (p[0] - pt.x) * (p[0] - pt.x) + (p[1] - pt.y) * (p[1] - pt.y);
      if (dd < dmin) { dmin = dd; mejor = d.k; }
    });
    return mejor;
  }
  function elegirPin(k) {
    S.sel = S.sel === k ? '' : k;
    if (S.sel) track('guias_mapa_pin', { destino: k, mes: S.mes });
    mapa();
  }
  document.addEventListener('click', function (e) {
    /* en el mapa gana el destino mas cerca del toque, no el punto que quedo dibujado arriba: en Santa Catarina y
       en la costa de Rio hay varios pegados y con el dedo se elegia el vecino */
    var svg = e.target.closest('#gmMapa');
    if (svg) { if (S.ignorarClick) return; var k = pinCercano(svg, e.clientX, e.clientY); if (k) elegirPin(k); return; }
    var zb = e.target.closest('[data-zoom]');
    if (zb) {
      if (zb.dataset.zoom === 'reset') { S.vb = { x: VB0.x, y: VB0.y, w: VB0.w, h: VB0.h }; encuadrar(); mapa(); }
      else zoom(zb.dataset.zoom === 'in' ? 1.6 : 1 / 1.6);
      track('guias_mapa_zoom', { accion: zb.dataset.zoom }); return;
    }
    var t = e.target.closest('button'); if (!t) return;
    if (t.id === 'atras') {
      if (S.pant !== 1) { S.pant = 1; pintar(); return; }
      location.href = 'home-dos-caminos.html' + (debug ? '?debug=1' : ''); return;
    }
    if (t.dataset.fav) {
      var k = t.dataset.fav, zona = t.closest('#gmGrid') ? 'gmGrid' : t.closest('#gmSel') ? 'gmSel' : 'main';
      alternarFav(k);
      if (S.pant === 1) { grilla(); mapa(); favTxt(); } else lista();
      /* repintar cambia el boton: el foco vuelve al mismo corazon */
      var nb = $(zona) && $(zona).querySelector('[data-fav="' + k + '"]'); if (nb) nb.focus();
      return;
    }
    if (t.id === 'filtros') { var abrir = $('gmFil').hidden; $('gmFil').hidden = !abrir; t.setAttribute('aria-expanded', String(abrir)); return; }
    if (t.dataset.tipo != null) { S.tipo = t.dataset.tipo; track('guias_filtro_tipo', { tipo: S.tipo || 'todos' }); filtrosUI(); grilla(); mapa(); listaMes(); return; }
    if (t.dataset.mes) { S.mes = +t.dataset.mes; S.recTodos = false; track('guias_mes', { mes: S.mes }); meses(); mapa(); listaMes(); return; }
    if (t.dataset.rank) { S.rank = t.dataset.rank; S.recTodos = false; track('guias_ranking', { ranking: S.rank, mes: S.mes }); listaMes(); mapa(); return; }
    if (t.id === 'gmRecMas') { S.recTodos = !S.recTodos; listaMes(); mapa(); return; }
    if (t.dataset.accion === 'guias') { S.pant = 2; track('guias_ver_lista'); pintar(); $('bus').focus(); return; }
    if (t.dataset.accion === 'favoritos') { S.pant = 3; track('guias_ver_favoritos', { cantidad: favs.length }); pintar(); return; }
    if (t.dataset.cotizar) { track('guias_cotizar', { destino: t.dataset.cotizar, mes: S.mes }); location.href = linkCotizar(t.dataset.cotizar); return; }
    if (t.dataset.dest) { track('guias_abrir', { destino: t.dataset.dest }); location.href = 'home-guia.html?destino=' + t.dataset.dest + (debug ? '&debug=1' : ''); }
  });
  document.addEventListener('keydown', function (e) {
    var pin = e.target.closest && e.target.closest('[data-pin]');
    if (pin && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); var k = pin.dataset.pin; elegirPin(k); var np = $('gmPins').querySelector('[data-pin="' + k + '"]'); if (np) np.focus(); }
  });
  document.addEventListener('input', function (e) {
    if (e.target.id === 'bus') { S.q = e.target.value.trim(); lista(); var b = $('bus'); if (b) { var c = e.target.selectionStart; b.focus(); try { b.setSelectionRange(c, c); } catch (x) { /* no todos dejan */ } } }
    /* el buscador del menu filtra mientras se escribe: la grilla de fotos, el mapa y los recomendados del mes */
    if (e.target.id === 'busmenu') { S.q = e.target.value.trim(); grilla(); mapa(); listaMes(); }
  });
  $('busmenu').addEventListener('keydown', function (e) { if (e.key === 'Enter') { track('guias_buscar', { q: S.q }); var p = document.querySelector('#gmGrid [data-dest]'); if (p) p.focus(); } });
  function medirBarra() { var b = document.querySelector('.g-bar'); if (b) document.documentElement.style.setProperty('--gbar', Math.ceil(b.getBoundingClientRect().bottom) + 'px'); }
  medirBarra(); window.addEventListener('resize', medirBarra);
  iniciarGestos();
  /* cuenta.js carga despues de esta pagina: cuando esta, se escucha si al iniciar sesion llegan favoritos de la cuenta */
  document.addEventListener('DOMContentLoaded', function () {
    if (!favCuenta()) return;
    favCuenta().alCambiar(function (l) { favs = l.map(function (x) { return x.k; }).filter(function (x) { return C.Nombres[x]; }); pintar(); });
    if (CSCuenta.alCambiar) CSCuenta.alCambiar(function () { if (S.pant === 3) lista(); });
  });
  if (window.CSMoneda) CSMoneda.alCambiar(function () { if (S.pant === 1 && S.rank !== 'clima') listaMes(); });
  if (qs.get('ver') === 'favoritos') S.pant = 3;
  pintar();
})();
</script>
<script src="cuenta.js"></script>
<script src="cabecera.js"></script>
</body>
