<style>
  /* Guia de un destino. Las pestanas son Que hacer / Playas / Comida / Tips.
     El contenido no esta en esta pagina: se pide a /api/guia con el token que firma
     el server, igual que en el sitio principal. Si el server no tiene con que
     firmar, la guia queda cerrada y se dice, sin error raro. */
  body{background:#E9EDF3;margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 12px;font-family:var(--fb)}
  [data-theme="night"] body{background:#05080D}
  .phone{position:relative;width:390px;max-width:100%;height:800px;max-height:calc(100vh - 32px);background:var(--bg);border:10px solid #0A101A;border-radius:48px;box-shadow:0 24px 60px rgba(10,16,26,.28);overflow:hidden;display:flex;flex-direction:column}
  .status{flex:0 0 auto;display:flex;justify-content:space-between;padding:14px 26px 4px;font-size:14px;font-weight:700;color:var(--ink)}
  button{font-family:var(--fb)}
  .u-bar{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;padding:0 14px;position:absolute;top:0;left:0;right:0;z-index:4}
  .u-back{width:40px;height:40px;margin-left:-8px;border:0;background:transparent;color:var(--ink);display:grid;place-items:center;cursor:pointer}
  .u-back svg{filter:drop-shadow(0 1px 3px rgba(0,0,0,.5))}
  .u-main{flex:1;overflow-y:auto;scrollbar-width:none}
  .u-main::-webkit-scrollbar{display:none}
  /* Portada: la foto manda. Encima, el nombre con la promesa (descubri cuanto cuesta viajar), para que sirve la guia
     y el boton al presupuesto, asi nadie tiene que bajar hasta el final para calcular. */
  .u-hero{position:relative;min-height:390px;display:flex;align-items:flex-end;background:#0B1F3A center/cover}
  .u-hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,16,26,.5) 0,rgba(10,16,26,.1) 30%,rgba(10,16,26,.85) 100%)}
  .u-hero__t{position:relative;z-index:1;width:100%;box-sizing:border-box;padding:76px 18px 22px;color:#fff}
  .u-hero__eye{display:inline-block;margin-bottom:12px;padding:6px 12px;border-radius:99px;background:rgba(10,16,26,.55);font-size:13.5px;font-weight:700;letter-spacing:.02em}
  .u-hero__t h1{margin:0;font-family:var(--fh);font-size:33px;font-weight:800;line-height:1.12;text-shadow:0 2px 10px rgba(0,0,0,.5)}
  .u-hero__t h1 span{color:var(--accent)}
  .u-hero__p{margin:12px 0 0;max-width:580px;font-size:17px;font-weight:600;line-height:1.45;text-shadow:0 1px 6px rgba(0,0,0,.5)}
  .u-hero__val{display:flex;align-items:center;gap:8px;margin:12px 0 0;font-size:14.5px;font-weight:700;color:rgba(255,255,255,.92)}
  .u-hero__val svg{flex:0 0 auto;color:var(--accent)}
  .u-hero__cta{display:inline-flex;align-items:center;justify-content:center;gap:8px;margin-top:18px;min-height:54px;padding:0 26px;border-radius:14px;background:var(--action-bg);color:var(--action-ink);font-size:17px;font-weight:800;text-decoration:none;box-shadow:0 6px 18px rgba(0,0,0,.25)}
  .u-hero__cta:focus-visible,.u-go:focus-visible{outline:3px solid #fff;outline-offset:3px}
  /* Precio y boton juntos: lo que cuesta y como calcularlo, en el mismo lugar. */
  .u-hero__accion{display:flex;flex-wrap:wrap;align-items:center;gap:14px 24px;margin-top:20px}
  .u-hero__accion .u-hero__cta{margin-top:0}
  .u-hero__precio{display:block;color:#fff;font-size:14.5px;font-weight:700;line-height:1.3}
  .u-hero__precio b{display:block;font-family:var(--fh);font-size:32px;font-weight:800;color:var(--accent);line-height:1.1}
  .u-hero__precio:empty{display:none}
  /* Franja debajo de la portada: que incluye el estimado, como llegar y cuando ir, en una sola tarjeta pareja. */
  .u-franja{border:1px solid var(--line);border-radius:20px;background:var(--surface);overflow:hidden}
  .u-f{padding:18px}
  .u-f+.u-f{border-top:1px solid var(--line)}
  .u-cuerpo{padding:18px 18px 0}
  .u-mas[hidden]{display:none}
  .u-dato__l{display:flex;align-items:center;gap:6px;margin-bottom:8px;font-size:13px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:var(--ink2)}
  .u-dato__l svg{flex:0 0 auto;color:var(--azul)}
  .u-dato__r{display:block;font-size:16px;font-weight:700;line-height:1.4;color:var(--ink)}
  .u-dato__r+.u-dato__r{margin-top:5px}
  .u-dato__r small{display:block;margin-top:1px;font-size:14.5px;font-weight:600;color:var(--ink2)}
  .u-dato__n{display:block;margin-top:8px;font-size:14px;font-weight:600;line-height:1.45;color:var(--ink2)}
  .u-tabs{display:flex;gap:8px;position:sticky;top:0;z-index:3;margin:0 -18px;padding:12px 18px;background:var(--bg);overflow-x:auto;scrollbar-width:none}
  .u-tabs::-webkit-scrollbar{display:none}
  .u-tab{flex:0 0 auto;padding:11px 17px;border:1.5px solid var(--line);border-radius:99px;background:var(--surface);color:var(--ink);font-size:15.5px;font-weight:700;cursor:pointer}
  .u-tab.is-on{background:var(--action-bg);border-color:var(--action-bg);color:var(--action-ink)}
  .u-tab:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
  .u-lead{margin:26px 0 6px;font-size:17.5px;font-weight:600;color:var(--ink);line-height:1.55}
  .u-h2{margin:28px 0 14px;font-family:var(--fh);font-size:24px;font-weight:800;color:var(--ink)}
  .u-item{padding:16px;border:1px solid var(--line);border-radius:20px;background:var(--surface);margin-bottom:14px}
  .u-item b{display:block;font-size:19px;line-height:1.3}
  .u-item .meta{display:block;margin-top:5px;font-size:14.5px;font-weight:700;color:var(--azul)}
  .u-item p{margin:9px 0 0;font-size:16px;font-weight:500;color:var(--ink2);line-height:1.55;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:3;overflow:hidden}
  .u-item.is-abierta p{display:block;-webkit-line-clamp:unset}
  .u-mas{margin:6px 0 0;padding:6px 0;border:0;background:transparent;color:var(--azul);font-size:14.5px;font-weight:800;cursor:pointer}
  .u-mas:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:6px}
  .u-foto{height:220px;margin:-16px -16px 14px;border-radius:20px 20px 0 0;background:var(--cel-soft) center/cover}
  .u-precio{display:inline-block;margin-top:7px;padding:5px 11px;border-radius:99px;background:var(--good-soft);color:var(--good);font-size:14px;font-weight:800}
  [role="tabpanel"]>section[aria-label="Clima por mes"]{grid-column:1/-1}
  .u-meses{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:6px;margin:16px 0 4px}
  .u-mes{border-radius:10px;padding:7px 2px;text-align:center;font-size:12.5px;font-weight:600;line-height:1.25;color:var(--ink);border:1px solid transparent}
  .u-mes b{display:block;font-size:13px;font-weight:800}
  .u-mes--baja{background:rgba(47,182,111,.14);border-color:rgba(47,182,111,.45)}.u-mes--baja b{color:#2FB66F}
  .u-mes--media{background:rgba(246,178,27,.14);border-color:rgba(246,178,27,.45)}.u-mes--media b{color:#E0A100}
  .u-mes--alta{background:rgba(229,72,72,.14);border-color:rgba(229,72,72,.45)}.u-mes--alta b{color:#E54848}
  @media (max-width:560px){.u-meses{grid-template-columns:repeat(6,minmax(0,1fr))}}
  .u-clima{overflow-x:auto;border:1px solid var(--line);border-radius:20px;background:var(--surface);margin-bottom:10px;scrollbar-width:thin}
  .u-clima table{border-collapse:collapse;width:100%;font-size:12.5px}
  .u-clima th,.u-clima td{padding:9px 1px;text-align:center;border-bottom:1px solid var(--line);color:var(--ink);white-space:nowrap}
  .u-clima thead th{font-size:11.5px;font-weight:800;color:var(--ink2)}
  .u-clima th[scope=row]{position:sticky;left:0;z-index:1;text-align:left;padding:9px 6px 9px 10px;font-size:12px;font-weight:700;color:var(--ink2);background:var(--surface)}
  .u-clima tr:last-child th,.u-clima tr:last-child td{border-bottom:0}
  .u-dem{display:inline-block;width:12px;height:12px;border-radius:50%;vertical-align:middle}
  .u-dem--alta{background:#E54848}.u-dem--media{background:#F6B21B}.u-dem--baja{background:#2FB66F}
  .u-clima__ley{display:flex;gap:14px;flex-wrap:wrap;margin:2px 0 0;font-size:13px;font-weight:600;color:var(--ink2)}.u-clima__ley span{display:inline-flex;align-items:center;gap:6px}
  .u-clima__n{margin:4px 0 0;font-size:15px;font-weight:600;color:var(--ink2);line-height:1.5}
  .u-clima__f{margin:6px 0 0;font-size:12.5px;color:var(--ink2)}
  .u-item--temp .u-temp{margin:0}
  .u-temp{margin:6px 0 0;font-size:16px;font-weight:600;color:var(--ink2);line-height:1.5}
  /* El cierre: desde la guia al buscador, como en la maqueta. */
  .u-handoff{margin:36px 0 0;padding:0;text-align:center;color:var(--ink)}
  .u-ruta{display:block;width:100%;max-width:320px;height:auto;margin:0 auto 10px;overflow:visible}
  .u-ruta__l{fill:none;stroke:var(--line);stroke-width:2.5;stroke-dasharray:6 7;stroke-linecap:round}
  .u-ruta__o{fill:var(--ink2)}.u-ruta__d{fill:var(--accent);animation:u-pulso 1.8s ease-in-out infinite}
  .u-ruta__a path{fill:var(--accent)}
  .u-ruta__a{offset-path:path('M20 70 Q160 -10 300 60');offset-rotate:auto;animation:u-vuelo 4.5s cubic-bezier(.45,0,.4,1) infinite}
  @keyframes u-vuelo{0%{offset-distance:0%;opacity:0}8%{opacity:1}88%{opacity:1}100%{offset-distance:100%;opacity:0}}
  @keyframes u-pulso{0%,100%{r:6;opacity:1}50%{r:8.5;opacity:.65}}
  @media (prefers-reduced-motion:reduce){.u-ruta__a,.u-ruta__d{animation:none}.u-ruta__a{offset-distance:55%}}
  .u-handoff__eye{display:block;margin-bottom:6px;font-size:12.5px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--accent)}
  .u-handoff h2{margin:0 0 8px;font-family:var(--fh);font-size:26px;font-weight:800;line-height:1.2;color:var(--ink)}
  .u-handoff p{margin:0 auto 18px;max-width:520px;font-size:16.5px;font-weight:500;color:var(--ink2);line-height:1.5}
  .u-handoff__b{display:flex;justify-content:center}
  .u-handoff__b a{flex:0 1 360px;box-sizing:border-box;min-height:54px;padding:15px;border-radius:14px;font-size:16.5px;font-weight:800;text-decoration:none;cursor:pointer;text-align:center}
  .u-go{background:var(--action-bg);color:var(--action-ink);border:0}
  .u-volver{background:transparent;color:#fff;box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.6);border:0}
  .u-cargando{padding:30px 18px;text-align:center;font-size:14px;font-weight:600;color:var(--ink2)}
  .u-cerrada{margin:14px 18px 0;padding:18px;border:1px dashed var(--line);border-radius:18px;background:var(--surface);text-align:center}
  .u-cerrada b{display:block;font-family:var(--fh);font-size:16px;margin-bottom:5px}
  .u-cerrada small{display:block;font-size:12.5px;font-weight:600;color:var(--ink2);line-height:1.5}
  /* Candado: la guia se abre con sesion iniciada (sin XP). */
  .u-lock{margin:16px 0 0;padding:20px 18px;border:1.5px solid var(--line);border-radius:20px;background:var(--surface);text-align:center}
  .u-lock__ico{display:grid;place-items:center;width:52px;height:52px;margin:0 auto 10px;border-radius:50%;background:var(--cel-soft);color:var(--azul)}
  .u-lock h2{margin:0 0 8px;font-family:var(--fh);font-size:21px;font-weight:800;color:var(--ink)}
  .u-lock p{margin:0 0 14px;font-size:15.5px;font-weight:600;color:var(--ink2);line-height:1.5}
  .u-lock__bar{height:10px;margin:4px 0 6px;border-radius:99px;background:var(--line);overflow:hidden}
  .u-lock__bar i{display:block;height:100%;border-radius:99px;background:var(--accent)}
  .u-lock__n{display:block;margin-bottom:14px;font-size:12.5px;font-weight:800;color:var(--ink)}
  .u-lock ul{margin:0 0 16px;padding:0;list-style:none;text-align:left}
  .u-lock li{display:flex;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:13px;font-weight:600;color:var(--ink2)}
  .u-lock li b{flex:0 0 42px;color:var(--good);font-weight:800}
  .u-lock__cta{display:block;width:100%;box-sizing:border-box;padding:15px;border:0;border-radius:14px;background:var(--action-bg);color:var(--action-ink);font-size:16px;font-weight:800;text-align:center;text-decoration:none;cursor:pointer}
  .u-tab small{margin-left:4px;font-size:13px;font-weight:800;color:var(--ink2);opacity:.75}
  .u-foto{position:relative}
  .u-cred{position:absolute;right:6px;bottom:5px;max-width:70%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:1px 6px;border-radius:4px;background:rgba(0,0,0,.4);color:rgba(255,255,255,.9);font-size:10px;font-weight:600;line-height:1.4}
  .u-num{position:absolute;left:10px;top:10px;display:grid;place-items:center;width:26px;height:26px;border-radius:50%;background:#0B1F3A;color:#fff;font-size:12.5px;font-weight:800;box-shadow:0 2px 6px rgba(0,0,0,.3)}
  .u-num--in{position:static;display:inline-grid;width:22px;height:22px;margin-right:7px;font-size:11.5px;box-shadow:none;vertical-align:1px}
  .u-acc{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
  .u-acc:empty{display:none}
  .u-acc .u-precio{margin-top:9px}
  .u-llegar{display:inline-flex;align-items:center;gap:5px;margin-top:9px;padding:8px 14px;border-radius:99px;background:var(--cel-soft);color:var(--azul);font-size:14.5px;font-weight:800;text-decoration:none}
  .u-llegar:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
  .u-mapa{height:280px;margin:0 0 14px;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:var(--cel-soft);position:relative;z-index:0}
  .u-pin span{display:grid;place-items:center;width:28px;height:28px;box-sizing:border-box;border:2px solid #fff;border-radius:50%;background:#0B1F3A;color:#fff;font:800 12.5px/1 var(--fb);box-shadow:0 2px 6px rgba(0,0,0,.35)}
  .u-lock__trae{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;margin:2px 0 12px}
  .u-lock__chip{padding:6px 12px;border-radius:99px;background:var(--cel-soft);color:var(--ink);font-size:14px;font-weight:700}
  .u-lock__chip b{font-weight:800;color:var(--azul)}
  .u-lock__sec{display:block;width:100%;margin-top:8px;padding:12px;border:0;border-radius:14px;background:transparent;box-shadow:inset 0 0 0 1.5px var(--line);color:var(--ink);font-size:13.5px;font-weight:800;cursor:pointer}
  .u-foot{flex:0 0 auto;padding:8px 18px 20px;background:var(--bg)}
  @media (max-width:520px){
    body{display:block;padding:0;background:var(--bg)}
    .phone{width:100%;height:100vh;height:100dvh;max-height:none;border:0;border-radius:0;box-shadow:none}
    .status{display:none}
  }
</style>

<script>
(function () {
  var qs = new URLSearchParams(location.search), debug = /[?&]debug=1/.test(location.search);
  var C = window.CS_Viaje, $ = function (id) { return document.getElementById(id); };
  var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };
  var K = /^[a-z0-9-]{1,40}$/.test(qs.get('destino') || '') ? qs.get('destino') : 'fln', NOM = C.Nombres[K] || 'Tu destino';
  /* Pestanas: solo salen las que tienen algo. "Qué ver" son las atracciones (en Sao Paulo, Gramado, Canela y Porto
     Alegre es la seccion principal, con foto y mapa). La primera pestana es Playas si hay, si no Qué ver. */
  var TAB = [{ id: 'clima', nom: 'Clima', k: 'clima' }, { id: 'playas', nom: 'Playas', k: 'beaches' }, { id: 'ver', nom: 'Lugares para ver', k: 'atracciones' }, { id: 'hacer', nom: 'Paseos y excursiones', k: 'hacer' },
    { id: 'comer', nom: 'Dónde comer', k: 'comer' }, { id: 'tips', nom: 'Tips', k: 'tips' }];
  var S = { tab: '', guia: null, region: '', tours: [], estado: 'cargando', est: null };
  /* El presupuesto de la guia: el viaje real de CuantoSale con el destino ya elegido (/destinos), no una pantalla aparte. */
  var aPresupuesto = function (fuente) { return 'home-destino.html?destino=' + K + '&fuente=' + fuente; };
  var track = function (n, p) { window.mockTrack(n, Object.assign({ destino: K }, p || {})); };
  var usd = function (n) { return window.CSMoneda ? CSMoneda.fmt(Number(n) || 0) : 'US$ ' + Math.round(Number(n) || 0); };
  var lista = function (k) { return (S.guia && Array.isArray(S.guia[k])) ? S.guia[k] : []; };
  var cuantos = function (t) {
    if (t.id === 'clima') return S.guia && S.guia.clima && Array.isArray(S.guia.clima.meses) ? 1 : 0;
    return lista(t.k).length + (t.id === 'hacer' ? S.tours.length : 0);
  };
  var tabs = function () { return TAB.filter(cuantos); };
  var tieneLugar = function (x) { return typeof x.lat === 'number' && typeof x.lng === 'number'; };

  function cabecera() {
    var check = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg>';
    return '<div class="u-hero" style="background-image:url(../fotos/' + K + '.jpg)"><div class="u-hero__t">' +
      '<span class="u-hero__eye">Guía de viaje · ' + (S.region ? esc(S.region) + ', Brasil' : 'Brasil') + '</span>' +
      '<h1>' + esc(NOM) + ': <span>descubrí cuánto cuesta viajar</span></h1>' +
      '<p class="u-hero__p">Qué hacer, cómo llegar desde Uruguay y cuánto presupuestar para organizar tu viaje.</p>' +
      '<p class="u-hero__val">' + check + 'Con el costo total desde Montevideo, no solo el pasaje.</p>' +
      '<div class="u-hero__accion"><span class="u-hero__precio" id="u-precio">' + precioPortada() + '</span>' +
      '<a class="u-hero__cta" href="' + aPresupuesto('guia_portada') + '" data-evento="guia_calcular_viaje" data-lugar="portada" data-destino="' + K + '">Calculá tu viaje →</a></div>' +
      '</div></div>';
  }
  function precioPortada() {
    var e = S.est && S.est.barato;
    return e ? '<b>Desde ' + usd(e.pp) + '</b>por persona, estimado' : '';
  }
  /* Resumen practico. Cada dato sale de algo que ya existe y si no esta, no se muestra:
     - presupuesto y como llegar: la misma estimacion de la portada de la app (/api/destinos-destacados, calibrada con
       precios reales de vuelos y de Booking), para 2 personas y 7 noches; se dice que es estimado y que incluye.
     - cuando ir: la temporada de la guia (alta y baja, con su nota), que el server manda tambien sin sesion.
     - en esta guia: cuantas playas, lugares y datos trae.

  var MEDIO = { avion_mvd: 'En avión desde Montevideo', avion_ba: 'En avión vía Buenos Aires', auto: 'En auto desde Montevideo', bus: 'En bus desde Montevideo', ferry: 'En ferry' };

          });
      })
      .catch(function () { S.estado = 'cerrada'; pintar(); });
  }

  document.addEventListener('click', function (e) {
    var t = e.target.closest('button'); if (!t) return;
    if (t.id === 'atras') { location.href = 'home-guias.html' + (debug ? '?debug=1' : ''); return; }
    if (t.dataset.tab) { S.tab = t.dataset.tab; track('guia_pestana', { pestana: S.tab }); pintar(); $('main').scrollTop = 0; return; }
    if (t.dataset.login) { if (window.CSCuenta) CSCuenta.abrir(); return; }
    if (t.dataset.mas) { var it = t.closest('.u-item'), ab = it.classList.toggle('is-abierta'); t.textContent = ab ? 'Ver menos' : 'Ver más'; t.setAttribute('aria-expanded', String(ab)); return; }
    if (t.dataset.volver) { $('main').scrollTop = 0; track('guia_volver'); }
  });
  pintar();
  cargarEstimado();
  /* cuenta.js y los creditos de las fotos cargan despues de este script: se espera a que carguen
     (load, por el defer de los creditos). Al iniciar sesion con la guia bloqueada se vuelve a pedir. */
  window.addEventListener('load', function () {
    pedirGuia();
    if (window.CSCuenta) CSCuenta.alCambiar(function (u) { if (u && S.estado === 'bloqueada') { S.estado = 'cargando'; pintar(); pedirGuia(); } });
  });
})();
</script>
<script src="cuenta.js"></script>
<script src="cabecera.js"></script>
<script defer src="/creditos-fotos.generated.js"></script>
</body>
</html>
