<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<!-- data-cs-medicion: el server no le inyecta Analytics ni el aviso de cookies a esta pagina (datos de clientes). -->
<meta name="cs-medicion" content="ninguna" data-cs-medicion>
<title>Panel · CuántoSale</title>
<!-- Instalable en el celular ("Agregar a la pantalla de inicio"): abre directo el panel, con su nombre y sin la barra del navegador. -->
<link rel="manifest" href="/admin/manifest.json">
<meta name="theme-color" content="#0A101A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="CS Panel">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<style>
:root{--bg:#F4F5F8;--card:#fff;--ink:#0F172A;--muted:#64748B;--line:#E2E6EE;--brand:#0A101A;--accent:#F6B21B;--ok:#16825D;--okbg:#E4F5EE;--warn:#B45309;--warnbg:#FEF3C7;--bad:#B42318;--badbg:#FDE8E6;--info:#1D4ED8;--infobg:#E3ECFF;--r:12px}
@media (prefers-color-scheme:dark){:root{--bg:#0B1020;--card:#141B2E;--ink:#E8ECF6;--muted:#97A3C0;--line:#26304A;--brand:#05080F;--ok:#3DD6A0;--okbg:#0E2E26;--warn:#F5B94A;--warnbg:#33260B;--bad:#FF8A7A;--badbg:#3A1512;--info:#8FB2FF;--infobg:#14224A}}
@font-face{font-family:Poppins;src:url(/fonts/poppins-400.woff2) format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:Poppins;src:url(/fonts/poppins-500.woff2) format("woff2");font-weight:500;font-display:swap}
@font-face{font-family:Poppins;src:url(/fonts/poppins-600.woff2) format("woff2");font-weight:600;font-display:swap}
@font-face{font-family:Poppins;src:url(/fonts/poppins-700.woff2) format("woff2");font-weight:700;font-display:swap}
*{box-sizing:border-box}
html,body{margin:0}
body{font:14px/1.5 Poppins,system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink);-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
[hidden]{display:none!important}
.wrap{max-width:1240px;margin:0 auto;padding:0 16px}
.top{background:var(--brand);color:#fff;position:sticky;top:0;z-index:20}
.top .wrap{display:flex;align-items:center;gap:8px 24px;min-height:64px;flex-wrap:wrap;padding-top:8px;padding-bottom:8px}
.top h1{font-size:19px;font-weight:700;margin:0;white-space:nowrap;letter-spacing:-.2px}
.top h1 i{font-style:normal;color:var(--accent)}
.top h1 span{color:#9CA3AF;font-weight:500}
/* 4 secciones; en el celular entran en una linea y si no, se deslizan de costado. */
.tabs{display:flex;gap:4px;overflow-x:auto;max-width:100%;scrollbar-width:none;flex:1 1 auto}
.tabs::-webkit-scrollbar{display:none}
.tab{background:transparent;border:0;color:#E5E7EB;padding:9px 16px;border-radius:999px;font-weight:500;white-space:nowrap;flex:none;display:inline-flex;align-items:center;gap:8px;min-height:40px}
.tab:hover{background:rgba(255,255,255,.08)}
.tab[aria-current=page]{background:var(--accent);color:#0B0F17;font-weight:600}
.badge{display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:#22C55E;color:#052E16;font-size:12px;font-weight:700;line-height:1}
.tab[aria-current=page] .badge{background:#0B0F17;color:var(--accent)}
.top__acc{display:flex;gap:8px;align-items:center}
.btn--icono{width:40px;min-height:40px;padding:0;display:inline-grid;place-items:center;border-radius:999px}
.top .btn--sm{min-height:40px;border-radius:999px;padding:0 16px}
.top .btn--icono{padding:0}
.subtabs{display:flex;gap:4px;flex-wrap:wrap;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:4px;margin:20px 0 0;width:max-content;max-width:100%}
.subtab{border:0;background:transparent;padding:8px 14px;border-radius:9px;font-weight:500;color:var(--muted);min-height:38px;display:inline-flex;align-items:center;gap:6px}
.subtab[aria-current=page]{background:var(--brand);color:#fff;font-weight:600}
.vhead{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;margin:24px 0 16px}
.vhead h2{margin:0;font-size:26px;font-weight:700;letter-spacing:-.4px}
.vhead p{margin:2px 0 0;color:var(--muted)}
.btn--lg{min-height:44px;padding:0 20px;border-radius:12px;font-size:15px}
.btn{border:1px solid var(--line);background:var(--card);border-radius:9px;padding:8px 14px;font-weight:600;min-height:38px}
.btn:hover{border-color:var(--muted)}
.btn--main{background:var(--accent);border-color:var(--accent);color:#1b1300}
.btn--danger{color:var(--bad)}
.btn--wa{display:inline-flex;align-items:center;background:#1DAA61;border-color:#1DAA61;color:#fff;text-decoration:none}
.btn--wa:hover{background:#168A4E;border-color:#168A4E}
.btn--sm{padding:4px 10px;min-height:30px;font-size:13px}
/* Cruz para quitar: cuadrada y fija. Sin esto el padding la hacia ovalada y en la grilla del celular se estiraba a todo el ancho. */
.btn--x{width:32px;height:32px;min-height:32px;padding:0;display:inline-grid;place-items:center;flex:none;justify-self:start;font-size:14px;line-height:1}
.top .btn{background:transparent;color:#fff;border-color:rgba(255,255,255,.3)}
.login{min-height:100vh;display:grid;place-items:center;padding:16px}
.login form{width:100%;max-width:360px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:28px 24px;display:grid;gap:14px}
.login h1{margin:0;font-size:20px}
.login p{margin:0;color:var(--muted);font-size:14px}
label.f{display:grid;gap:4px;font-size:13px;font-weight:600;color:var(--muted)}
input,select,textarea{border:1px solid var(--line);background:var(--card);border-radius:9px;padding:9px 10px;min-height:40px;width:100%}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--info);outline-offset:1px}
textarea{min-height:76px;resize:vertical}
.err{color:var(--bad);font-size:13.5px;margin:0}
.aviso{background:var(--warnbg);color:var(--warn);border-radius:var(--r);padding:10px 14px;margin:14px 0;font-size:14px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin:20px 0}
.kpis--4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:900px){.kpis--4{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 18px}
.kpi small{display:block;color:var(--muted);font-weight:500;font-size:13px}
.kpi b{display:block;font-size:24px;font-weight:700;margin-top:2px;font-variant-numeric:tabular-nums}
.kpi em{font-style:normal;font-size:12px;color:var(--muted)}
.kpi--btn{font:inherit;color:inherit;text-align:left;cursor:pointer}
.kpi--btn:hover{border-color:var(--muted)}
.kpi__ver{display:block;margin-top:6px;font-size:12px;font-weight:700;color:var(--muted)}
.precarga{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin:-6px 0 16px;font-size:13.5px}
.precarga p{margin:0 0 12px;line-height:1.5}
.precarga__tabla{overflow-x:auto}
.precarga table{border-collapse:collapse;font-size:12.5px;font-variant-numeric:tabular-nums}
.precarga th,.precarga td{padding:5px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
.precarga thead th{color:var(--muted);font-weight:600}
.precarga tbody th{text-align:left}
.precarga tbody th small{display:block;font-weight:400;color:var(--muted);max-width:190px;overflow:hidden;text-overflow:ellipsis}
.precarga td.ok{color:var(--ok);font-weight:700}
.precarga td.falta,.precarga__hoteles .falta b{color:var(--muted)}
.precarga__hoteles{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:4px 16px}
.precarga__hoteles li{display:flex;justify-content:space-between;gap:8px;padding:5px 0;border-bottom:1px solid var(--line)}
.precarga__hoteles .ok b{color:var(--ok)}
.kpi--warn b{color:var(--warn)}.kpi--ok b{color:var(--ok)}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.chips{display:flex;gap:6px;flex-wrap:wrap;flex:1}
.chip{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:5px 12px;font-size:13.5px;font-weight:600}
.chip[aria-pressed=true]{background:var(--brand);color:#fff;border-color:var(--brand)}
.chip span{opacity:.65;margin-left:4px}
.bar input[type=search]{max-width:260px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden}
/* Lista de pedidos: filtros arriba y una fila por pedido con el proximo paso. En el celular cada fila es una tarjeta. */
.filtros{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--line)}
.filtros__der{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.filtros input[type=search]{width:280px;max-width:100%}
.fsel{width:auto;min-height:40px;padding:0 10px;font-size:13px}
.seg{display:flex;flex-wrap:wrap;gap:4px;background:var(--bg);padding:4px;border-radius:12px}
.seg__b{border:0;background:transparent;padding:7px 12px;border-radius:9px;font-size:13px;color:var(--muted);font-weight:500;min-height:36px}
.seg__b span{opacity:.7}
.seg__b[aria-pressed=true]{background:var(--card);color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.plist__h,.prow{display:grid;grid-template-columns:minmax(0,2.2fr) minmax(0,1.6fr) minmax(0,1.4fr) minmax(0,1fr) minmax(0,.9fr) minmax(0,1.4fr);gap:16px;align-items:center;padding:14px 16px}
.plist__h{padding-top:10px;padding-bottom:10px;font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);background:color-mix(in srgb,var(--bg) 50%,var(--card))}
.prow{border-top:1px solid var(--line);cursor:pointer}
.prow:hover{background:color-mix(in srgb,var(--info) 5%,transparent)}
.prow--off{opacity:.6}
.prow b{font-weight:600}
.prow__cli{display:flex;gap:12px;align-items:center;min-width:0}
.avatar{width:40px;height:40px;flex:none;border-radius:999px;background:var(--warnbg);color:var(--warn);display:grid;place-items:center;font-weight:600;font-size:13px}
.sub.warn{color:var(--warn);font-weight:500}
.pend{color:var(--warn);font-weight:500}
.btn-paso{white-space:nowrap;text-decoration:none;min-height:36px;display:inline-flex;align-items:center;border-radius:10px}
@media (max-width:760px){
  .plist__h{display:none}
  .prow{grid-template-columns:minmax(0,1fr) auto;gap:6px 12px}
  .prow__viaje,.prow__serv{grid-column:1}
  .prow__total{grid-column:2;grid-row:1}
  .prow__estado{grid-column:2;grid-row:2;justify-self:end}
  .prow__paso{grid-column:1 / -1}
  .prow__paso .btn-paso{width:100%;justify-content:center;min-height:44px}
  .filtros input[type=search],.fsel{flex:1 1 140px;width:auto}
  .subtabs{width:100%}
  /* Celular: logo y botones en un renglon, las 5 secciones en el de abajo. */
  .top h1{flex:1;font-size:17px}
  .tabs{order:3;flex:1 1 100%}
  .tab{flex:1 1 auto;justify-content:center;padding:9px 4px;font-size:12px;gap:4px}
  .tab .badge{min-width:18px;height:18px;padding:0 5px;font-size:11px}
  .seg{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;max-width:100%}
  .seg::-webkit-scrollbar{display:none}
  .seg__b{white-space:nowrap;flex:none}
  .kpi{padding:12px 14px}
  .kpi b{font-size:20px}
  .vhead{margin-top:16px}
  .vhead h2{font-size:22px}
}
table{width:100%;border-collapse:collapse}
th{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
tbody tr:last-child td{border-bottom:0}
tbody tr.row{cursor:pointer}
tbody tr.row:hover{background:color-mix(in srgb,var(--info) 6%,transparent)}
.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.sub{display:block;color:var(--muted);font-size:12.5px}
.pill{display:inline-block;border-radius:99px;padding:2px 10px;font-size:12px;font-weight:700;white-space:nowrap}
.tags{display:flex;flex-wrap:wrap;gap:4px}
.tag{display:inline-block;border-radius:99px;padding:2px 9px;font-size:12px;font-weight:600;background:var(--infobg);color:var(--info);white-space:nowrap}
/* Marketing: un color por categoria del calendario (destinos azul, la app verde, experiencias mostaza) */
:root{--mc-destinos:#1D4ED8;--mc-destinos-bg:#E3ECFF;--mc-app:#16825D;--mc-app-bg:#E4F5EE;--mc-experiencias:#9A6700;--mc-experiencias-bg:#FDF1D3}
@media (prefers-color-scheme:dark){:root{--mc-destinos:#8FB2FF;--mc-destinos-bg:#14224A;--mc-app:#3DD6A0;--mc-app-bg:#0E2E26;--mc-experiencias:#F6B21B;--mc-experiencias-bg:#33260B}}
.mc-destinos{--mc:var(--mc-destinos);--mcbg:var(--mc-destinos-bg)}.mc-app{--mc:var(--mc-app);--mcbg:var(--mc-app-bg)}.mc-experiencias{--mc:var(--mc-experiencias);--mcbg:var(--mc-experiencias-bg)}
.tag.mc{background:var(--mcbg);color:var(--mc)}
tr.mc>td:first-child{box-shadow:inset 4px 0 0 var(--mc)}
.mkt-cat{border-left:4px solid var(--mc)}
.mkt-barras{display:grid;gap:12px;margin:6px 0 4px}
.mkt-barra__cab{display:flex;justify-content:space-between;gap:12px;font-size:14px;margin-bottom:5px}
.mkt-barra__riel{height:10px;border-radius:99px;background:var(--line);position:relative;overflow:hidden}
.mkt-barra__riel span{position:absolute;inset:0 auto 0 0;border-radius:99px;background:var(--mc)}
.mkt-barra__meta{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink)}
.p-nuevo{background:var(--infobg);color:var(--info)}.p-en_gestion{background:var(--warnbg);color:var(--warn)}
.p-confirmado,.p-completado,.p-pagado{background:var(--okbg);color:var(--ok)}
.p-cancelado,.p-sin_pago{background:var(--badbg);color:var(--bad)}.p-parcial{background:var(--warnbg);color:var(--warn)}
.p-pendiente{background:var(--warnbg);color:var(--warn)}.p-consultado{background:var(--infobg);color:var(--info)}
.deuda{color:var(--bad);font-weight:700}.ok{color:var(--ok);font-weight:700}
.vacio{padding:34px 16px;text-align:center;color:var(--muted)}
.drawer{position:fixed;inset:0;z-index:40;display:flex;justify-content:flex-end;background:rgba(5,8,15,.55)}
.panel{width:min(980px,100%);height:100%;background:var(--bg);overflow:auto;padding:0 0 90px}
.panel__head{position:sticky;top:0;background:var(--card);border-bottom:1px solid var(--line);padding:12px 16px;display:flex;gap:10px;align-items:center;z-index:2}
.panel__head h2{margin:0;font-size:17px;flex:1}
.panel__body{padding:16px 20px;display:grid;grid-template-columns:minmax(0,1fr);gap:14px}
.sec{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.sec h3{margin:0 0 10px;font-size:14px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}
.item{border:1px solid var(--line);border-radius:10px;padding:10px;display:grid;gap:8px;margin-bottom:10px}
.item__top{display:flex;gap:8px;align-items:flex-start}
.item__top input{flex:1}
.cuentas{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.cuentas div{background:var(--bg);border-radius:9px;padding:8px 10px}
.cuentas small{display:block;color:var(--muted);font-size:12px;font-weight:600}
.cuentas b{font-size:17px;font-variant-numeric:tabular-nums}
.foot{position:sticky;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:10px 16px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:flex-end}
.foot .msg,.foot__msg{margin-right:auto;font-size:13.5px;max-width:none;padding:0;border-radius:0;box-shadow:none;background:none}
/* Por publicar: barra de acciones fija y una tarjeta por cambio, con lo que cambia en cuadritos a lo ancho */
.pubbar{position:sticky;top:64px;z-index:5;display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-bottom:12px;box-shadow:0 4px 14px rgba(0,0,0,.05)}
.pubbar__todos{display:flex;gap:8px;align-items:center;font-weight:600;font-size:14px;padding:0 4px}
.pubbar__todos input,.pub__cab input[type=checkbox]{width:18px;height:18px;min-height:0;accent-color:var(--ink)}
.pubbar__esp{flex:1}
.pubbar .btn[disabled]{opacity:.45;cursor:default}
.pubs{display:grid;gap:12px}
.pub{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;display:grid;gap:12px}
.pub--sel{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
.pub__cab{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;gap:14px;align-items:start}
.pub__cab input[type=checkbox]{margin-top:3px}
.pub__srv .lnk{font-weight:600;font-size:15px}
.pub__srv .sub .tag{padding:0 7px;font-size:11px}
.pub__precio b{display:block;font-size:17px}
.pub__acc{display:flex;gap:6px}
.pub__difs{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px}
.pub__difs .sub{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;background:var(--bg);border-radius:10px;padding:8px 10px;font-size:12.5px;color:var(--ink)}
.pub__difs .sub b{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.03em;color:var(--muted);font-weight:600}
.pub__difs .sub img{height:56px!important}
@media (max-width:760px){
  .pubbar{position:static}
  .pub__cab{grid-template-columns:auto minmax(0,1fr)}
  .pub__precio{grid-column:2;text-align:left}
  .pub__acc{grid-column:1 / -1}
  .pub__acc .btn{flex:1;min-height:40px}
}
/* Servicios: margen editable en la fila */
.mg{display:flex;gap:4px;align-items:center}
.mg__t{width:auto;min-height:34px;padding:0 6px;font-size:13px}
.mg__v{width:72px;min-height:34px;padding:0 8px;font-size:13px}
.mg__v:disabled{background:var(--bg);color:var(--muted)}
td .mg + .sub{margin-top:4px;white-space:nowrap}
td[data-l=Servicio]{min-width:210px}
/* Catalogo > Paso a paso */
.pp-prog{list-style:none;display:flex;gap:6px;padding:0;margin:0 0 16px;overflow-x:auto}
.pp-prog li{flex:1;min-width:0;display:flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 10px;font-size:13px;color:var(--muted)}
.pp-prog li span{flex:0 0 22px;height:22px;border-radius:99px;display:grid;place-items:center;background:var(--bg);font-weight:700;font-size:12px}
.pp-prog li b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.pp-prog li.ahora{border-color:var(--ink);color:var(--ink)}.pp-prog li.ahora span{background:var(--accent);color:#101828}
.pp-prog li.hecho span{background:var(--okbg);color:var(--ok)}
.pp-nav{display:flex;gap:8px;row-gap:8px;justify-content:space-between;align-items:center;flex-wrap:wrap;margin:16px 0 30px}
.pp-nav .btn[disabled]{opacity:.45;cursor:default}
.pp-dests{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;margin-top:12px}
.pp-dest{text-align:left;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;gap:4px;cursor:pointer;font:inherit;color:var(--ink)}
.pp-dest:hover{border-color:var(--ink)}.pp-dest b{font-size:15px}.pp-dest--pend{border-left:4px solid var(--accent)}
.pp-preg{padding:22px;display:grid;gap:10px}.pp-preg h3{margin:0;font-size:19px}
.pp-preg__bot{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}.pp-preg__bot .btn[disabled]{opacity:.45;cursor:default}
