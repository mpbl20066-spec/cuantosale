<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<!-- data-cs-medicion: el server no le inyecta Analytics ni el aviso de cookies a esta pagina (datos de clientes). -->
<meta name="cs-medicion" content="ninguna" data-cs-medicion>
<title>Panel · CuántoSale</title>
<!-- Instalable en el celular ("Agregar a la pantalla de inicio"): abre directo el panel, con su nombre y sin la barra del navegador. -->
<link rel="manifest" href="/admin/manifest.json">
<meta name="theme-color" content="#0A101A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="CS Panel">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<style>
:root{--bg:#F4F5F8;--card:#fff;--ink:#0F172A;--muted:#64748B;--line:#E2E6EE;--brand:#0A101A;--accent:#F6B21B;--ok:#16825D;--okbg:#E4F5EE;--warn:#B45309;--warnbg:#FEF3C7;--bad:#B42318;--badbg:#FDE8E6;--info:#1D4ED8;--infobg:#E3ECFF;--r:12px}
@media (prefers-color-scheme:dark){:root{--bg:#0B1020;--card:#141B2E;--ink:#E8ECF6;--muted:#97A3C0;--line:#26304A;--brand:#05080F;--ok:#3DD6A0;--okbg:#0E2E26;--warn:#F5B94A;--warnbg:#33260B;--bad:#FF8A7A;--badbg:#3A1512;--info:#8FB2FF;--infobg:#14224A}}
*{box-sizing:border-box}
html,body{margin:0}
body{font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
[hidden]{display:none!important}
.wrap{max-width:1240px;margin:0 auto;padding:0 16px}
.top{background:var(--brand);color:#fff;position:sticky;top:0;z-index:20}
.top .wrap{display:flex;align-items:center;gap:12px;min-height:56px;flex-wrap:wrap}
.top h1{font-size:17px;margin:0;flex:1;white-space:nowrap}
.top h1 i{font-style:normal;color:var(--accent)}
/* Las pestanas se deslizan de costado en el celular en vez de ensanchar la pagina. */
.tabs{display:flex;gap:4px;overflow-x:auto;max-width:100%;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{background:transparent;border:0;color:#cbd5e1;padding:8px 12px;border-radius:8px;font-weight:600;white-space:nowrap;flex:none}
.tab[aria-selected=true]{background:rgba(255,255,255,.14);color:#fff}
.btn{border:1px solid var(--line);background:var(--card);border-radius:9px;padding:8px 14px;font-weight:600;min-height:38px}
.btn:hover{border-color:var(--muted)}
.btn--main{background:var(--accent);border-color:var(--accent);color:#1b1300}
.btn--danger{color:var(--bad)}
.btn--wa{display:inline-flex;align-items:center;background:#1DAA61;border-color:#1DAA61;color:#fff;text-decoration:none}
.btn--wa:hover{background:#168A4E;border-color:#168A4E}
.btn--sm{padding:4px 10px;min-height:30px;font-size:13px}
/* Cruz para quitar: cuadrada y fija. Sin esto el padding la hacia ovalada y en la grilla del celular se estiraba a todo el ancho. */
.btn--x{width:32px;height:32px;min-height:32px;padding:0;display:inline-grid;place-items:center;flex:none;justify-self:start;font-size:14px;line-height:1}
.top .btn{background:transparent;color:#fff;border-color:rgba(255,255,255,.3)}
.login{min-height:100vh;display:grid;place-items:center;padding:16px}
.login form{width:100%;max-width:360px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:28px 24px;display:grid;gap:14px}
.login h1{margin:0;font-size:20px}
.login p{margin:0;color:var(--muted);font-size:14px}
label.f{display:grid;gap:4px;font-size:13px;font-weight:600;color:var(--muted)}
input,select,textarea{border:1px solid var(--line);background:var(--card);border-radius:9px;padding:9px 10px;min-height:40px;width:100%}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--info);outline-offset:1px}
textarea{min-height:76px;resize:vertical}
.err{color:var(--bad);font-size:13.5px;margin:0}
.aviso{background:var(--warnbg);color:var(--warn);border-radius:var(--r);padding:10px 14px;margin:14px 0;font-size:14px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin:16px 0}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.kpi small{display:block;color:var(--muted);font-weight:600;font-size:12.5px}
.kpi b{display:block;font-size:22px;margin-top:2px;font-variant-numeric:tabular-nums}
.kpi em{font-style:normal;font-size:12px;color:var(--muted)}
.kpi--btn{font:inherit;color:inherit;text-align:left;cursor:pointer}
.kpi--btn:hover{border-color:var(--muted)}
.kpi__ver{display:block;margin-top:6px;font-size:12px;font-weight:700;color:var(--muted)}
.precarga{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin:-6px 0 16px;font-size:13.5px}
.precarga p{margin:0 0 12px;line-height:1.5}
.precarga__tabla{overflow-x:auto}
.precarga table{border-collapse:collapse;font-size:12.5px;font-variant-numeric:tabular-nums}
.precarga th,.precarga td{padding:5px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
.precarga thead th{color:var(--muted);font-weight:600}
.precarga tbody th{text-align:left}
.precarga tbody th small{display:block;font-weight:400;color:var(--muted);max-width:190px;overflow:hidden;text-overflow:ellipsis}
.precarga td.ok{color:var(--ok);font-weight:700}
.precarga td.falta,.precarga__hoteles .falta b{color:var(--muted)}
.precarga__hoteles{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:4px 16px}
.precarga__hoteles li{display:flex;justify-content:space-between;gap:8px;padding:5px 0;border-bottom:1px solid var(--line)}
.precarga__hoteles .ok b{color:var(--ok)}
.kpi--warn b{color:var(--warn)}.kpi--ok b{color:var(--ok)}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.chips{display:flex;gap:6px;flex-wrap:wrap;flex:1}
.chip{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:5px 12px;font-size:13.5px;font-weight:600}
.chip[aria-pressed=true]{background:var(--brand);color:#fff;border-color:var(--brand)}
.chip span{opacity:.65;margin-left:4px}
.bar input[type=search]{max-width:260px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
table{width:100%;border-collapse:collapse}
th{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
tbody tr:last-child td{border-bottom:0}
tbody tr.row{cursor:pointer}
tbody tr.row:hover{background:color-mix(in srgb,var(--info) 6%,transparent)}
.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.sub{display:block;color:var(--muted);font-size:12.5px}
.pill{display:inline-block;border-radius:99px;padding:2px 10px;font-size:12px;font-weight:700;white-space:nowrap}
.tags{display:flex;flex-wrap:wrap;gap:4px}
.tag{display:inline-block;border-radius:99px;padding:2px 9px;font-size:12px;font-weight:600;background:var(--infobg);color:var(--info);white-space:nowrap}
.p-nuevo{background:var(--infobg);color:var(--info)}.p-en_gestion{background:var(--warnbg);color:var(--warn)}
.p-confirmado,.p-completado,.p-pagado{background:var(--okbg);color:var(--ok)}
.p-cancelado,.p-sin_pago{background:var(--badbg);color:var(--bad)}.p-parcial{background:var(--warnbg);color:var(--warn)}
.p-pendiente{background:var(--warnbg);color:var(--warn)}.p-consultado{background:var(--infobg);color:var(--info)}
.deuda{color:var(--bad);font-weight:700}.ok{color:var(--ok);font-weight:700}
.vacio{padding:34px 16px;text-align:center;color:var(--muted)}
.drawer{position:fixed;inset:0;z-index:40;display:flex;justify-content:flex-end;background:rgba(5,8,15,.55)}
.panel{width:min(980px,100%);height:100%;background:var(--bg);overflow:auto;padding:0 0 90px}
.panel__head{position:sticky;top:0;background:var(--card);border-bottom:1px solid var(--line);padding:12px 16px;display:flex;gap:10px;align-items:center;z-index:2}
.panel__head h2{margin:0;font-size:17px;flex:1}
.panel__body{padding:14px 16px;display:grid;gap:14px}
.sec{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.sec h3{margin:0 0 10px;font-size:14px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}
.item{border:1px solid var(--line);border-radius:10px;padding:10px;display:grid;gap:8px;margin-bottom:10px}
.item__top{display:flex;gap:8px;align-items:flex-start}
.item__top input{flex:1}
.cuentas{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.cuentas div{background:var(--bg);border-radius:9px;padding:8px 10px}
.cuentas small{display:block;color:var(--muted);font-size:12px;font-weight:600}
.cuentas b{font-size:17px;font-variant-numeric:tabular-nums}
.foot{position:sticky;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:10px 16px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:flex-end}
.foot .msg{margin-right:auto;font-size:13.5px}
a.lnk{color:var(--info);font-weight:600;text-decoration:none}
a.lnk:hover{text-decoration:underline}
.pagoRow{display:grid;grid-template-columns:130px 110px 1fr 1fr auto;gap:8px;margin-bottom:8px;align-items:center}
.chat{display:grid;grid-template-columns:320px 1fr;height:calc(100vh - 290px);min-height:420px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-bottom:24px}
.chat-lista{border-right:1px solid var(--line);overflow:auto}
.chat-it{display:grid;gap:2px;width:100%;text-align:left;background:transparent;border:0;border-bottom:1px solid var(--line);padding:10px 14px}
.chat-it:hover{background:var(--bg)}.chat-it.is-on{background:var(--infobg)}
.chat-it__top{display:flex;justify-content:space-between;gap:8px}.chat-it__top small{color:var(--muted);font-size:12px;white-space:nowrap}
.chat-it__prev{display:flex;justify-content:space-between;gap:8px;color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chat-badge{font-style:normal;background:#1DAA61;color:#fff;border-radius:99px;min-width:20px;height:20px;padding:0 6px;font-size:12px;font-weight:700;display:inline-grid;place-items:center}
.chat-conv{display:flex;flex-direction:column;min-width:0;min-height:0}
.chat-cab{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:10px 14px;border-bottom:1px solid var(--line)}
.chat-cab div{flex:1;min-width:120px}.chat-cab small{display:block;color:var(--muted);font-size:12px}
.chat-volver{display:none}
.chat-msgs{flex:1;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:6px;background:var(--bg)}
.msg{max-width:min(76%,520px);padding:8px 10px 6px;border-radius:12px;font-size:14.5px;line-height:1.4;word-wrap:break-word;box-shadow:0 1px 1px rgba(0,0,0,.06)}
.msg--in{align-self:flex-start;background:var(--card);border-top-left-radius:4px}
.msg--out{align-self:flex-end;background:#D9FDD3;color:#111;border-top-right-radius:4px}
.msg--auto{background:#FFF4CC;color:#111}
.msg__h{display:block;text-align:right;font-size:11px;opacity:.6;margin-top:2px}
.tilde.is-leido{color:#1D8CF8;opacity:1}.tilde.is-mal{color:#B42318}
.msg__err{display:block;color:#B42318;font-size:12px;margin-top:4px}
.chat-caja{display:flex;gap:8px;padding:10px;border-top:1px solid var(--line);align-items:flex-end}
.chat-caja textarea{min-height:44px;max-height:160px}
.chat-conv>#chat-caja>.err{padding:0 12px 8px}
.chat-aviso{margin:0;padding:12px 14px;border-top:1px solid var(--line);background:var(--warnbg);color:var(--warn);font-size:13.5px}
@media (max-width:760px){.chat{grid-template-columns:1fr;height:calc(100vh - 200px)}.chat.con-chat .chat-lista{display:none}.chat:not(.con-chat) .chat-conv{display:none}.chat-volver{display:inline-flex}}
.avisos{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:10px 14px;margin-bottom:10px;font-size:14px}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--brand);color:#fff;padding:10px 18px;border-radius:99px;z-index:60;font-weight:600}
@media (max-width:760px){
  .hide-m{display:none}
  table,thead,tbody,tr,td{display:block}
  thead{display:none}
  tbody tr{padding:10px 12px;border-bottom:1px solid var(--line)}
  td{border:0;padding:3px 0;display:flex;justify-content:space-between;gap:10px;text-align:right}
  td::before{content:attr(data-l);color:var(--muted);font-size:12.5px;font-weight:600;text-align:left}
  .num{text-align:right}
  .pagoRow{grid-template-columns:1fr 1fr}
  .bar input[type=search]{max-width:none;flex:1 1 100%}
}
.uso-card{margin-top:12px}.uso-h{margin:0;padding:14px 14px 6px;font-size:15px}.uso-card>.sub,.uso-card>.vacio{padding:0 14px 12px}
.uso-barra{display:block;height:10px;border-radius:5px;background:var(--accent);min-width:2px}
</style>
</head>
<body>
<main id="app"></main>
<script src="/admin/admin.js?v=19"></script>
</body>
</html>
