<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Preview · Transfer y reservar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css"><style>
body{background:#F2F6FA;padding:16px 0 40px;margin:0}
.pv{display:flex;gap:18px;align-items:flex-start;flex-wrap:wrap;padding:0 16px}
.pv__col{background:#fff;padding:8px;border-radius:12px}
.pv__tag{font:700 11px Poppins,sans-serif;color:#48617F;padding:4px 8px 8px;text-transform:uppercase;letter-spacing:.08em}
.w940{width:940px;max-width:100%}
.w760{width:760px;max-width:100%}
.w390{width:390px;max-width:100%}
.pv__modal{position:static;padding:0;background:none;place-items:start}
.pv__modal .booking-dialog{max-height:none;box-shadow:0 10px 30px rgba(16,35,62,.12)}
@media (prefers-color-scheme: dark){body{background:#0A1830}.pv__col{background:#12294A}.pv__tag{color:#A6BBD3}}
</style></head><body>
<div class="pv">
  <div class="pv__col w390"><div class="pv__tag">seccion de transfer · sin elegir</div><div id="a"></div></div>
  <div class="pv__col w390"><div class="pv__tag">seccion de transfer · compartido</div><div id="b"></div></div>
  <div class="pv__col w760"><div class="pv__tag">seccion de transfer · 760</div><div id="c"></div></div>
</div>

<div class="pv" style="margin-top:22px">
  <div class="pv__col w390"><div class="pv__tag">Mi Viaje · sin nada</div><div id="d"></div></div>
  <div class="pv__col w390"><div class="pv__tag">Mi Viaje · 2 act + transfer</div><div id="e"></div></div>
</div>

<div class="pv" style="margin-top:22px">
  <div class="pv__col w940"><div class="pv__tag">checkout · paso 1, los dos pedidos</div><div class="pv__modal" id="f"></div></div>
  <div class="pv__col w760"><div class="pv__tag">checkout · paso 3</div><div class="pv__modal" id="g"></div></div>
</div>

<script>
var ART_VAN = '<svg class="transfer-choice__art" viewBox="0 0 40 40" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9h20a3 3 0 0 1 3 3v13H6z"/><path d="M29 15h5l3 5v5h-8z"/><path d="M6 25h6M24 25h6"/><circle cx="11" cy="29" r="2.4"/><circle cx="31" cy="29" r="2.4"/><circle cx="12" cy="14" r="1.6"/><circle cx="19" cy="14" r="1.6"/><circle cx="26" cy="14" r="1.6"/></svg>';
var ART_CAR = '<svg class="transfer-choice__art" viewBox="0 0 40 40" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 16h30l-2 8H7z"/><path d="M9 16l3-5h16l3 5"/><path d="M7 24h6M27 24h6"/><circle cx="12" cy="27" r="2.4"/><circle cx="28" cy="27" r="2.4"/><circle cx="20" cy="19" r="1.4"/></svg>';
var CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12.5 9.5 18 20 6.5"/></svg>';
var ICONO_TRASLADOS = '<svg class="trip-summary__ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" style="color:var(--cel)" aria-hidden="true"><path d="M3 14.5h18v3.5H3z"/><path d="M5 14.5v-2.8A1.7 1.7 0 0 1 6.7 10h10.6a1.7 1.7 0 0 1 1.7 1.7v2.8"/><path d="M6.5 18v2.5M17.5 18v2.5"/></svg>';

function card(key, title, desc, price, selected) {
  return '<button type="button" class="transfer-choice' + (selected ? ' is-selected' : '') + '" data-transfer-choice="' + key + '" aria-pressed="' + (selected ? 'true' : 'false') + '">' +
    '<span class="transfer-choice__icon">' + (key === 'shared' ? ART_VAN : ART_CAR) + '</span>' +
    '<span class="transfer-choice__body"><strong>' + title + '</strong><small>' + desc + '</small></span>' +
    '<b class="transfer-choice__price">' + price + '</b>' +
    '<span class="transfer-choice__check" aria-hidden="true">' + CHECK + '</span></button>';
}
function seccion(elegido) {
  var total = elegido === 'private' ? 'R$ 118' : elegido === 'shared' ? 'R$ 70' : '';
  return '<section class="transport-options official-transfer" data-official-transfer>' +
    '<div class="official-transfer__head"><div><h2>Transfer desde el aeropuerto</h2>' +
    '<p>Elegí cómo querés llegar a tu alojamiento en Río de Janeiro (43 km desde GIG).</p>' +
    (total ? '<b class="official-transfer__total">' + total + ' total</b>' : '') +
    '</div></div>' +
    '<div class="transfer-choice-grid">' +
    card('shared', 'Transfer compartido', 'Compartís el vehículo con otros pasajeros. Se cobra por persona.', 'R$ 35', elegido === 'shared') +
    card('private', 'Transfer privado', 'Vehículo exclusivo para los que viajan. Se cobra el auto, no por persona.', 'R$ 118', elegido === 'private') +
    '</div>' +
    (elegido ? '<p class="transfer-hint">El horario de recogida lo coordinás con el operador al reservar.</p>' : '') +
    '</section>';
}
a.innerHTML = seccion('');
b.innerHTML = seccion('shared');
c.innerHTML = seccion('shared');

/* ---- Mi Viaje ---- */
function fila(icono, label, meta, value, zero) {
  return '<button type="button" class="trip-summary__item' + (zero ? ' is-zero' : '') + '">' +
    '<svg class="trip-summary__ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.85" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + icono + '</svg>' +
    '<div class="trip-summary__meta"><b>' + label + '</b><span>' + meta + '</span></div><em>' + value + '</em></button>';
}
var ICO = {
  bus: '<rect x="4" y="3.5" width="16" height="14" rx="2.5"/><path d="M4 11h16M4 15.5h16"/><path d="M8 21v-2.6M16 21v-2.6"/>',
  traslados: '<path d="M3 14.5h18v3.5H3z"/><path d="M5 14.5v-2.8A1.7 1.7 0 0 1 6.7 10h10.6a1.7 1.7 0 0 1 1.7 1.7v2.8"/><path d="M6.5 18v2.5M17.5 18v2.5"/>',
  alojamiento: '<path d="M3.5 20V6.5A1.5 1.5 0 0 1 5 5h7a1.5 1.5 0 0 1 1.5 1.5V20"/><path d="M13.5 10H18a1.5 1.5 0 0 1 1.5 1.5V20"/><path d="M2.5 20h19"/>',
  comidas: '<path d="M6.5 3v4.8a2.2 2.2 0 0 0 4.4 0V3"/><path d="M8.7 10v11"/><path d="M16.8 3v18"/><path d="M16.8 3c2.4 1.6 3.4 4 3.4 6.4 0 1.6-1.4 2.4-3.4 2.4"/>',
  local: '<path d="M3 19h18M6 19v-6h12v6"/><path d="M6 13V6.5A1.5 1.5 0 0 1 7.5 5h9A1.5 1.5 0 0 1 18 6.5V13"/><path d="M9.5 16.5h.01M14.5 16.5h.01" stroke-width="2.4"/>',
  tours: '<path d="M4 8.5A2.5 2.5 0 0 1 6.5 6h11A2.5 2.5 0 0 1 20 8.5V10a2 2 0 0 0 0 4v1.5a2.5 2.5 0 0 1-2.5 2.5h-11A2.5 2.5 0 0 1 4 15.5V14a2 2 0 0 0 0-4Z"/><path d="M14 7v1.6M14 11.2v1.6M14 15.4V17" stroke-width="2.2"/>'
};
function miViaje(pedido) {
  var filas = fila(ICO.pasajes || '<path d="M2.6 12.3 21.4 4.6l-7.4 17.3-2.5-8.1-8.9-1.5Z"/>', 'Vuelo', 'GOL', 'R$ 620') +
    fila(ICO.traslados, 'Transfer', pedido.transfer ? 'Compartido' : 'No incluido', pedido.transfer ? 'R$ 70' : '—', !pedido.transfer) +
    fila(ICO.alojamiento, 'Hotel', 'Casa Joseph', 'R$ 900') +
    fila(ICO.comidas, 'Comida', 'R$ 210/día', 'R$ 1.470') +
    fila(ICO.local, 'Transporte local', 'R$ 80/día', 'R$ 560') +
    fila(ICO.tours, 'Tours', pedido.tours.length ? pedido.tours.length + (pedido.tours.length === 1 ? ' actividad seleccionada' : ' actividades seleccionadas') : 'Sin actividades seleccionadas', pedido.tours.length ? 'R$ ' + (42 * pedido.tours.length) : 'R$ 0', !pedido.tours.length);
  var boton = '<button type="button" class="trip-summary__reserve" data-book-reserve' + (pedido.count ? '' : ' disabled') + '><span>' +
    (pedido.count ? 'Reservar ' + (pedido.tours.length && pedido.transfer ? 'actividades y transfer' : pedido.transfer ? 'transfer' : pedido.tours.length + (pedido.tours.length === 1 ? ' actividad' : ' actividades')) : 'Elegí algo para reservar') +
    '</span>' + (pedido.count ? '<em>R$ ' + (42 * pedido.tours.length + (pedido.transfer ? 70 : 0)) + '</em>' : '') + '</button>';
  return '<div class="trip-summary" style="position:static;width:auto;max-height:none"><div class="trip-summary__inner">' +
    '<button type="button" class="trip-summary__head"><span class="trip-summary__eyebrow">Mi Viaje</span><strong>R$ 3.620</strong></button>' +
    '<div class="trip-summary__details"><div class="trip-summary__bar"><span style="width:41%;background:var(--c1)"></span><span style="width:25%;background:var(--c5)"></span><span style="width:19%;background:var(--c3)"></span><span style="width:15%;background:var(--c6)"></span></div>' +
    '<div class="trip-summary__items">' + filas + '</div>' +
    '<div class="trip-summary__actions">' + boton +
    '<button type="button" class="trip-summary__cta">Ver mi presupuesto</button>' +
    '<button type="button" class="trip-summary__save">Guardar viaje</button></div></div></div></div>';
}
d.innerHTML = miViaje({ tours: [], transfer: false, count: 0 });
e.innerHTML = miViaje({ tours: [1, 2], transfer: true, count: 3 });

/* ---- checkout ---- */
var STEPS = [
  { label: 'Datos del viaje', hint: 'Quién viaja y a dónde avisarle' },
  { label: 'Método de pago', hint: 'Cómo te resulta más cómodo pagar' },
  { label: 'Revisar y confirmar', hint: 'Último control antes de enviar' }
];
function stepper(cur) {
  return '<ol class="checkout-steps" aria-label="Pasos de la reserva">' + STEPS.map(function (s, i) {
    var st = i < cur ? 'is-done' : (i === cur ? 'is-current' : '');
    return '<li class="checkout-steps__step ' + st + '"><span class="checkout-steps__num" aria-hidden="true">' + (i < cur ? '✓' : (i + 1)) + '</span>' +
      '<span class="checkout-steps__text"><b>' + s.label + '</b><em>' + s.hint + '</em></span></li>';
  }).join('') + '</ol>';
}
function fact(k, v) { return '<li><span>' + k + '</span><b>' + v + '</b></li>'; }
function linea(t, v) { return '<li class="checkout-aside__row"><span class="checkout-aside__row-name">' + t + '</span><b>' + v + '</b></li>'; }
function aside() {
  return '<aside class="checkout-aside">' +
    '<div class="checkout-aside__media"><span class="checkout-aside__name">Río de Janeiro</span></div>' +
    '<div class="checkout-aside__total"><span>Total a confirmar</span><strong>R$ 154</strong><em>R$ 42 por persona · 2 personas</em></div>' +
    '<ul class="checkout-aside__facts">' + fact('Salís de', 'Montevideo') + fact('Fechas', '17 – 24 dic. 2026 · 7 noches') +
    fact('Viajeros', '2 adultos') + fact('Actividades', '2 elegidas') + fact('Transfer', 'Transfer compartido') +
    fact('Vuelo', 'GOL · G3 1748') + fact('Hotel', 'Casa Joseph') + '</ul>' +
    '<div class="checkout-aside__list"><h3>Tu reserva</h3><ul class="checkout-aside__rows">' +
    linea('Paseo en escuna', 'R$ 42') + linea('Catamarán con almuerzo', 'R$ 42') + linea('Transfer compartido', 'R$ 70') + '</ul>' +
    '<p class="checkout-aside__total-line"><span>Total</span><b>R$ 154</b></p></div></aside>';
}
function field(label, name, value, wide) {
  return '<div class="checkout-field' + (wide ? ' is-wide' : '') + '"><label for="ck-' + name + '">' + label + '</label>' +
    '<input id="ck-' + name + '" name="' + name + '" value="' + (value || '') + '"></div>';
}
function acciones(last) {
  return '<footer class="checkout-actions">' +
    (last ? '<button type="button" class="checkout-btn checkout-btn--ghost" data-checkout-back>Volver</button>' : '<button type="button" class="checkout-btn checkout-btn--ghost">Cancelar</button>') +
    (last ? '<button type="button" class="checkout-btn checkout-btn--pay"><span>Confirmar por WhatsApp</span></button>'
          : '<button type="button" class="checkout-btn checkout-btn--next">Continuar</button>') + '</footer>';
}
function dialogo(panel, cur, last) {
  return '<div class="booking-dialog checkout-dialog" role="dialog">' +
    '<button type="button" class="booking-close" aria-label="Cerrar">×</button>' +
    '<div class="checkout-layout">' + aside() +
    '<div class="checkout-main"><header class="checkout-main__head"><h2>Río de Janeiro</h2>' + stepper(cur) + '</header>' +
    panel + acciones(last) + '</div></div></div>';
}
var panelDatos = '<div class="checkout-panel" data-checkout-panel="datos">' +
  '<h2 class="checkout-panel__title">Contanos quién viaja</h2>' +
  '<p class="checkout-panel__lead">Con esto el operador te confirma disponibilidad y el punto de encuentro.</p>' +
  '<div class="checkout-grid">' +
  '<div class="checkout-field"><label for="ck-t">Título</label><select id="ck-t" name="titulo"><option>Sr.</option></select></div>' +
  field('Nombre', 'nombre', 'Ana') + field('Apellido', 'apellido', 'Pérez') +
  '<div class="checkout-field"><label for="ck-d">Tipo de documento</label><select id="ck-d" name="docTipo"><option>Cédula de identidad</option></select></div>' +
  field('Número de documento', 'docNumero', '4512345') +
  '<div class="checkout-field"><label for="ck-n">Fecha de nacimiento</label><input id="ck-n" name="nacimiento" type="date"></div>' +
  '<div class="checkout-field"><label for="ck-na">Nacionalidad</label><select id="ck-na" name="nacionalidad"><option>Uruguay</option></select></div>' +
  field('Correo electrónico', 'email', 'ana@correo.com') + field('Teléfono', 'telefono', '09 123 456') +
  field('Dirección', 'direccion', '', true) + '</div>' +
  '<h3 class="checkout-panel__subtitle">El traslado</h3>' +
  '<div class="checkout-grid">' + field('Hotel o pousada de destino', 'transferHotel', 'Casa Joseph', true) + '</div>' +
  '<p class="checkout-transfer-note">' + ICONO_TRASLADOS +
  '<span><b>Transfer compartido</b> · R$ 70,00. El horario de recogida y el punto de encuentro los confirma el operador.</span></p>' +
  '<p class="checkout-legal">Usamos estos datos solo para coordinar la reserva. No los guardamos en el servidor.</p></div>';
function row(k, v) { return '<li><span>' + k + '</span><b>' + v + '</b></li>'; }
var panelListo = '<div class="checkout-panel" data-checkout-panel="listo">' +
  '<h2 class="checkout-panel__title">Revisá y confirmá</h2>' +
  '<p class="checkout-panel__lead">Te vamos a mandar esta solicitud por WhatsApp. Ahí te confirman disponibilidad, horario y el valor final.</p>' +
  '<div class="checkout-recap"><h3>Viajero</h3><ul>' + row('Nombre', 'Sr. Ana Pérez') + row('Documento', 'Cédula 4512345') + row('Contacto', 'ana@correo.com · 09 123 456') + '</ul>' +
  '<h3>Actividades en Río de Janeiro</h3><ul>' + row('Paseo en escuna', 'R$ 42 c/u') + row('Catamarán con almuerzo', 'R$ 42 c/u') + '</ul>' +
  '<h3>El traslado</h3><ul>' + row('Transfer', 'Transfer compartido · R$ 70') + row('Hotel', 'Casa Joseph') + row('Vuelo', 'GOL · G3 1748') +
  row('Horario de recogida', 'A coordinar con el operador') + '</ul>' +
  '<h3>Pago</h3><ul>' + row('Medio de pago', 'Banco República') + '</ul>' +
  '<p class="checkout-recap__total"><span>Total a confirmar</span><b>R$ 154</b></p></div></div>';
f.innerHTML = dialogo(panelDatos, 0, false);
g.innerHTML = dialogo(panelListo, 2, true);
</script>
</body></html>
