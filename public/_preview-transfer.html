<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Preview · Transfer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css"><style>
body{background:#F2F6FA;padding:16px 0 40px;margin:0}
.pv{display:flex;gap:18px;align-items:flex-start;flex-wrap:wrap;padding:0 16px}
.pv__col{background:#fff;padding:8px;border-radius:12px}
.pv__tag{font:700 11px Poppins,sans-serif;color:#48617F;padding:4px 8px 8px;text-transform:uppercase;letter-spacing:.08em}
.w940{width:940px;max-width:100%}
.w760{width:760px;max-width:100%}
.w390{width:390px;max-width:100%}
/* El modal es fixed: en el preview lo pasamos a estatico para poder medirlo. */
.pv__modal{position:static;padding:0;background:none;place-items:start}
.pv__modal .booking-dialog{max-height:none;box-shadow:0 10px 30px rgba(16,35,62,.12)}
@media (prefers-color-scheme: dark){body{background:#0A1830}.pv__col{background:#12294A}.pv__tag{color:#A6BBD3}}
</style></head><body>
<div class="pv">
  <div class="pv__col w760"><div class="pv__tag">seccion de transfer · 760</div><div id="a"></div></div>
  <div class="pv__col w390"><div class="pv__tag">seccion de transfer · 390</div><div id="b"></div></div>
</div>

<div class="pv" style="margin-top:22px">
  <div class="pv__col w940"><div class="pv__tag">checkout transfer · paso 1</div><div class="pv__modal" id="c"></div></div>
  <div class="pv__col w760"><div class="pv__tag">checkout transfer · paso 3</div><div class="pv__modal" id="d"></div></div>
</div>

<script>
var ART_VAN = '<svg class="transfer-choice__art" viewBox="0 0 40 40" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9h20a3 3 0 0 1 3 3v13H6z"/><path d="M29 15h5l3 5v5h-8z"/><path d="M6 25h6M24 25h6"/><circle cx="11" cy="29" r="2.4"/><circle cx="31" cy="29" r="2.4"/><circle cx="12" cy="14" r="1.6"/><circle cx="19" cy="14" r="1.6"/><circle cx="26" cy="14" r="1.6"/></svg>';
var ART_CAR = '<svg class="transfer-choice__art" viewBox="0 0 40 40" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 16h30l-2 8H7z"/><path d="M9 16l3-5h16l3 5"/><path d="M7 24h6M27 24h6"/><circle cx="12" cy="27" r="2.4"/><circle cx="28" cy="27" r="2.4"/><circle cx="20" cy="19" r="1.4"/></svg>';
var CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12.5 9.5 18 20 6.5"/></svg>';
var T = { km: '43', iata: 'GIG', compartido: 35, privado: 118 };

function card(key, title, desc, amount, price, selected) {
  return '<button type="button" class="transfer-choice' + (selected ? ' is-selected' : '') + '" data-transfer-choice="' + key + '" aria-pressed="' + (selected ? 'true' : 'false') + '">' +
    '<span class="transfer-choice__icon">' + (key === 'shared' ? ART_VAN : ART_CAR) + '</span>' +
    '<span class="transfer-choice__body"><strong>' + title + '</strong><small>' + desc + '</small></span>' +
    '<b class="transfer-choice__price">' + price + '</b>' +
    '<span class="transfer-choice__check" aria-hidden="true">' + CHECK + '</span></button>';
}
function seccion(elegido) {
  var total = elegido === 'private' ? 'R$ 118' : 'R$ 70';
  var cta = '<div class="official-transfer__cta">' +
    '<b class="official-transfer__cta-total"' + (elegido ? '' : ' hidden') + '>' + (elegido ? total + ' total' : '') + '</b>' +
    '<button type="button" class="official-transfer__reserve"' + (elegido ? '' : ' disabled') + '>' +
    '<span>' + (elegido ? 'Reservar transfer' : 'Elegí un transfer') + '</span></button></div>';
  var chips = elegido ? '<div class="transfer-pickup" data-transfer-pickup><span class="transfer-pickup__label">Horario de recogida</span><div class="transfer-pickup__chips">' +
    '<button type="button" class="transfer-pickup__chip is-selected" aria-pressed="true">1 h después · 15:20</button>' +
    '<button type="button" class="transfer-pickup__chip" aria-pressed="false">2 h después · 16:20</button>' +
    '<button type="button" class="transfer-pickup__chip" aria-pressed="false">Personalizado</button>' +
    '</div></div>' : '';
  return '<section class="transport-options official-transfer" data-official-transfer data-budget-anchor="traslados">' +
    '<div class="official-transfer__head"><div><h2>Transfer desde el aeropuerto</h2>' +
    '<p>Elegí cómo querés llegar a tu alojamiento en Río de Janeiro (' + T.km + ' km desde ' + T.iata + ').</p></div>' + cta + '</div>' +
    '<p class="transfer-suggestion">✈️ Tu vuelo llega 14:20 hs. Te sugerimos coordinar la recogida para 15:20 hs (1 hora después).</p>' +
    '<div class="transfer-choice-grid">' +
    card('shared', 'Transfer compartido', 'Compartís el vehículo con otros pasajeros. Se cobra por persona.', T.compartido, 'R$ 35', elegido === 'shared') +
    card('private', 'Transfer privado', 'Vehículo exclusivo para los que viajan. Se cobra el auto, no por persona.', T.privado, 'R$ 118', elegido === 'private') +
    '</div>' + chips + '</section>';
}
a.innerHTML = seccion('shared');
b.innerHTML = seccion('private');

/* ---- checkout del transfer: aside + pasos ---- */
var STEPS = [
  { label: 'Datos del viaje', hint: 'Quién viaja y a dónde avisarle' },
  { label: 'Método de pago', hint: 'Cómo te resulta más cómodo pagar' },
  { label: 'Revisar y confirmar', hint: 'Último control antes de enviar' }
];
function stepper(current) {
  return '<ol class="checkout-steps" aria-label="Pasos de la reserva">' + STEPS.map(function (s, i) {
    var state = i < current ? 'is-done' : (i === current ? 'is-current' : '');
    return '<li class="checkout-steps__step ' + state + '"><span class="checkout-steps__num" aria-hidden="true">' + (i < current ? '✓' : (i + 1)) + '</span>' +
      '<span class="checkout-steps__text"><b>' + s.label + '</b><em>' + s.hint + '</em></span></li>';
  }).join('') + '</ol>';
}
function fact(k, v) { return '<li><span>' + k + '</span><b>' + v + '</b></li>'; }
function aside(total, em) {
  return '<aside class="checkout-aside">' +
    '<div class="checkout-aside__media"><span class="checkout-aside__name">Río de Janeiro</span></div>' +
    '<div class="checkout-aside__total"><span>Total del transfer</span><strong>' + total + '</strong><em>' + em + '</em></div>' +
    '<ul class="checkout-aside__facts">' +
    fact('Salís de', 'Montevideo') + fact('Fechas', '17 – 24 dic. 2026 · 7 noches') + fact('Viajeros', '2 adultos') +
    fact('Transfer', '1 elegido') + fact('Recogida', '1 hora después de la llegada · 15:20') +
    fact('Vuelo', 'GOL · G3 1748') + fact('Hotel', 'Casa Joseph') +
    '</ul>' +
    '<div class="checkout-aside__list"><h3>Tu traslado</h3><ul class="checkout-aside__rows">' +
    '<li class="checkout-aside__row"><span class="checkout-aside__row-name">Transfer compartido</span><b>' + total + '</b></li></ul>' +
    '<p class="checkout-aside__total-line"><span>Total transfer</span><b>' + total + '</b></p></div></aside>';
}
function field(label, name, value, wide) {
  return '<div class="checkout-field' + (wide ? ' is-wide' : '') + '"><label for="ck-' + name + '">' + label + '</label>' +
    '<input id="ck-' + name + '" name="' + name + '" value="' + (value || '') + '"></div>';
}
function acciones(last) {
  return '<footer class="checkout-actions">' +
    (last ? '<button type="button" class="checkout-btn checkout-btn--ghost" data-checkout-back>Volver</button>' : '<button type="button" class="checkout-btn checkout-btn--ghost" data-close-booking>Cancelar</button>') +
    (last ? '<button type="button" class="checkout-btn checkout-btn--pay" data-checkout-confirm><span>Confirmar por WhatsApp</span></button>'
          : '<button type="button" class="checkout-btn checkout-btn--next" data-checkout-next>Continuar</button>') +
    '</footer>';
}
function dialogo(panel, current, last) {
  return '<div class="booking-dialog checkout-dialog" role="dialog" data-checkout-kind="transfer">' +
    '<button type="button" class="booking-close" aria-label="Cerrar">×</button>' +
    '<div class="checkout-layout">' + aside('R$ 70', 'R$ 35 por persona · 2 personas') +
    '<div class="checkout-main"><header class="checkout-main__head"><h2>Río de Janeiro</h2>' + stepper(current) + '</header>' +
    panel + acciones(last) + '</div></div></div>';
}
var panelDatos = '<div class="checkout-panel" data-checkout-panel="datos">' +
  '<h2 class="checkout-panel__title">Contanos quién viaja</h2>' +
  '<p class="checkout-panel__lead">Con esto el operador te confirma disponibilidad y el punto de encuentro.</p>' +
  '<div class="checkout-grid">' +
  '<div class="checkout-field"><label for="ck-titulo">Título</label><select id="ck-titulo" name="titulo"><option>Sr.</option></select></div>' +
  field('Nombre', 'nombre', 'Ana') + field('Apellido', 'apellido', 'Pérez') +
  '<div class="checkout-field"><label for="ck-d">Tipo de documento</label><select id="ck-d" name="docTipo"><option>Cédula de identidad</option></select></div>' +
  field('Número de documento', 'docNumero', '4.512.345') +
  '<div class="checkout-field"><label for="ck-n">Fecha de nacimiento</label><input id="ck-n" name="nacimiento" type="date"></div>' +
  '<div class="checkout-field"><label for="ck-pa">Nacionalidad</label><select id="ck-pa" name="nacionalidad"><option>Uruguay</option></select></div>' +
  field('Correo electrónico', 'email', 'ana@correo.com') + field('Teléfono', 'telefono', '09 123 456') +
  field('Dirección', 'direccion', '', true) +
  '</div>' +
  '<h3 class="checkout-panel__subtitle">El traslado</h3>' +
  '<div class="checkout-grid">' + field('Hotel o pousada de destino', 'transferHotel', 'Casa Joseph', true) + '</div>' +
  '<p class="checkout-transfer-note"><svg class="trip-summary__ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" style="color:var(--cel)" aria-hidden="true"><path d="M3 14.5h18v3.5H3z"/><path d="M5 14.5v-2.8A1.7 1.7 0 0 1 6.7 10h10.6a1.7 1.7 0 0 1 1.7 1.7v2.8"/><path d="M6.5 18v2.5M17.5 18v2.5"/></svg>' +
  '<span><b>Transfer compartido</b> · recogida 1 hora después de la llegada (15:20). Si el horario no es ese, cambialo en la sección de transfer.</span></p>' +
  '<p class="checkout-legal">Usamos estos datos solo para coordinar la reserva. No los guardamos en el servidor.</p></div>';

function row(k, v) { return '<li><span>' + k + '</span><b>' + v + '</b></li>'; }
var panelListo = '<div class="checkout-panel" data-checkout-panel="listo">' +
  '<h2 class="checkout-panel__title">Revisá y confirmá</h2>' +
  '<p class="checkout-panel__lead">Te vamos a mandar esta solicitud por WhatsApp. Ahí te confirman disponibilidad, horario y el valor final.</p>' +
  '<div class="checkout-recap"><h3>Viajero</h3><ul>' + row('Nombre', 'Sr. Ana Pérez') + row('Documento', 'Cédula de identidad 4512345') + row('Contacto', 'ana@correo.com · 09 123 456') + '</ul>' +
  '<h3>El traslado</h3><ul>' + row('Transfer compartido', 'R$ 70 · R$ 35 c/u') + row('Recogida', '1 hora después de la llegada · 15:20') + row('Hotel', 'Casa Joseph') + row('Vuelo', 'GOL · G3 1748') + '</ul>' +
  '<h3>Pago</h3><ul>' + row('Medio de pago', 'Banco República') + '</ul>' +
  '<p class="checkout-recap__total"><span>Total a confirmar</span><b>R$ 70</b></p></div></div>';

c.innerHTML = dialogo(panelDatos, 0, false);
d.innerHTML = dialogo(panelListo, 2, true);
</script>
</body></html>
